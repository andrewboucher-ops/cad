name: Android Legacy APK

# Separate from android.yml on purpose: this is a plain native Android
# project (no Capacitor, no AndroidX, minSdk 19) for the older Android
# 4.4.2 handsets in the fleet, which can't run the main WebRTC-based app
# at all (see android-legacy/app/build.gradle for why). It also has no
# committed Gradle wrapper — there's no local Android SDK to generate one
# from — so this workflow provisions Gradle itself instead of invoking
# ./gradlew.

on:
  push:
    branches: [main, master]
    paths: ['android-legacy/**', '.github/workflows/android-legacy.yml']
  pull_request:
    branches: [main, master]
    paths: ['android-legacy/**', '.github/workflows/android-legacy.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-legacy
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cccs-radio-legacy-apk
          path: android-legacy/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
