name: Android APK

# Builds the handset app on GitHub's runners, so nobody needs an Android SDK
# on their own machine. Every push produces an installable debug APK; tagging
# a release produces a signed one.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # lets you build on demand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Point the app at the production server
        # Set APP_SERVER_URL as a repository variable (Settings > Secrets and
        # variables > Actions > Variables). Without it the placeholder in
        # capacitor.config.json is used and the app will not reach anything.
        env:
          APP_SERVER_URL: ${{ vars.APP_SERVER_URL }}
        run: |
          cd android
          if [ -n "$APP_SERVER_URL" ]; then
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.server.url = process.env.APP_SERVER_URL;
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
              console.log('server.url =', cfg.server.url);
            "
          else
            echo "::warning::APP_SERVER_URL is not set — building against the placeholder host"
          fi

      - name: Install Capacitor
        working-directory: android
        run: npm install

      - name: Stage the web consoles
        working-directory: android
        run: |
          rm -rf www && mkdir -p www
          cp -r ../public/* www/

      - name: Generate the native project
        working-directory: android
        run: |
          npx cap add android
          # Our hand-written sources and config win over Capacitor's defaults.
          cp -r app/src/main/java android/app/src/main/
          cp app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp app/src/main/res/xml/*.xml android/app/src/main/res/xml/
          cp app/src/main/res/values/strings.xml android/app/src/main/res/values/strings.xml
          cp app/build.gradle android/app/build.gradle
          cp variables.gradle android/variables.gradle
          cp gradle.properties android/gradle.properties
          # Only overwrite generated build.gradle/settings.gradle if ours actually
          # differ from Capacitor's own template (google-services classpath, etc.);
          # skip silently otherwise so a future Capacitor version's defaults win.
          [ -f build.gradle ] && cp build.gradle android/build.gradle
          [ -f settings.gradle ] && cp settings.gradle android/settings.gradle
          npx cap sync android

      - name: Decode the signing keystore
        # Only present for tagged releases. Store it as a secret:
        #   base64 -w0 cccs-release.jks | pbcopy      (macOS)
        #   base64 -w0 cccs-release.jks               (Linux)
        # then paste into the ANDROID_KEYSTORE_BASE64 secret.
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Tagged build with no ANDROID_KEYSTORE_BASE64 secret — cannot sign"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > cccs-release.jks
          cat > keystore.properties <<PROPS
          storeFile=cccs-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove signing material
        # Runs even if the build failed, so nothing is left in the workspace.
        if: always()
        working-directory: android/android
        run: rm -f cccs-release.jks keystore.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cccs-radio-apk
          path: android/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
