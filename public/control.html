<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — control room</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCCS Control">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  /* MAP-PRIMARY. The map is the whole working area; every other surface is
     docked over it, translucent, so a controller never loses sight of where
     things are while reading about them. There are no modals: creating a
     job or visit, assigning by call sign, messaging and notification set-up
     are all modes of the Detail panel, so nothing ever covers the map or
     blocks the emergency banners. */
  body { height: 100vh; overflow: hidden; padding-left: 228px; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; }
  /* Leaflet's own controls, moved to the bottom of the map clear of the
     docked panels AND of the banner strip. Leaflet stacks its controls at
     z-index 1000; the banners and panels sit above that (see z-index below)
     so nothing the map draws can ever cover an emergency. */
  #map .leaflet-top.leaflet-left { top: auto; bottom: 64px; left: 356px; }
  #map .leaflet-top.leaflet-right { top: auto; bottom: 64px; right: 440px; }

  .glass {
    position: absolute; z-index: 1050; display: flex; flex-direction: column; min-height: 0;
    background: color-mix(in srgb, var(--panel) 84%, transparent);
    backdrop-filter: blur(10px) saturate(1.1); -webkit-backdrop-filter: blur(10px) saturate(1.1);
    border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28);
  }
  .glass > header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex: none; cursor: pointer; user-select: none;
    font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim);
    border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  }
  .glass > header .count { font-family: var(--mono); color: var(--ink); }
  .glass > header .tools { margin-left: auto; display: flex; gap: 6px; }
  .glass > header .tools .btn { padding: 2px 8px; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .glass > .gbody { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px; }
  .glass.collapsed > .gbody { display: none; }
  /* Top-anchored panels shrink upward to their header; the log is docked to
     the bottom and must stay there when collapsed. */
  .glass.collapsed:not(#pLog) { bottom: auto !important; }
  .chev { transition: transform .15s; display: inline-block; }
  .glass.collapsed .chev { transform: rotate(-90deg); }

  #pDispatch { top: 12px; left: 12px; bottom: 12px; width: 340px; }
  #pShift    { top: 12px; right: 12px; width: 320px; bottom: 50%; }
  #pDetail   { right: 12px; bottom: 12px; width: 420px; top: calc(50% + 12px); }
  #pLog      { left: 364px; bottom: 12px; width: min(520px, calc(100% - 820px)); max-height: 170px; }
  #pLog.collapsed { max-height: none; }
  @media (max-width: 1400px) { #pLog { display: none; } }

  .attn-strip { position: absolute; z-index: 1100; top: 12px; left: 364px; right: 344px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
  .attn-strip > * { pointer-events: auto; }
  .banner { border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  /* Fixed colours, not theme tokens: an emergency banner must read the same,
     at full contrast, in the light theme as in the dark one. */
  .banner.emg { background: #5b1215; border: 1px solid #dc2626; color: #fee2e2; }
  .banner.emg strong { color: #fff; letter-spacing: .08em; }
  .banner.emg .mono, .banner.emg .dim { color: #fecaca; }
  .banner.emg .btn:not(.ok):not(.armed) { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.35); }
  .banner.emg .btn.danger:not(.armed) { background: #dc2626; border-color: #fca5a5; }
  .banner.req { background: color-mix(in srgb, #14202e 92%, transparent); border: 1px solid var(--line); }
  .banner.req.pri { background: #2a1c11; border-color: var(--priority); }
  .banner.req.pri strong { color: var(--priority); }
  .banner .btn { padding: 3px 10px; font-size: 12px; }

  /* cards */
  .card { border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-2) 88%, transparent); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
  .card:hover { border-color: var(--accent-dim); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card.alarm { border-color: var(--emergency); }
  .card.closed { opacity: .55; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-top .cs { font-family: var(--mono); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .card-sub { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-dim); font-size: 11.5px; margin-top: 4px; }
  .kind { font-size: 9.5px; font-weight: 800; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; background: var(--panel); color: var(--ink-dim); border: 1px solid var(--line); }
  .kind.job { color: #93c5fd; border-color: #1d4ed8; }
  .kind.visit { color: #86efac; border-color: #15803d; }
  .needs { font-size: 10px; font-weight: 700; color: var(--priority); }
  .status-pill { font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; white-space: nowrap; }
  .status-pill.on { background: rgba(34,197,94,.16); color: var(--available); }
  .status-pill.busy { background: rgba(234,179,8,.16); color: var(--busy); }
  .status-pill.off { background: rgba(100,116,139,.18); color: var(--offline); }
  .status-pill.emg { background: rgba(239,68,68,.2); color: var(--emergency); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font-size: 11.5px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--line); background: transparent; color: var(--ink-dim); cursor: pointer; }
  .chip.on { background: var(--accent-dim); color: #eafffb; border-color: var(--accent-dim); }
  .grp { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); margin: 10px 2px 6px; display: flex; justify-content: space-between; }
  .grp:first-child { margin-top: 2px; }
  .avail { display: flex; gap: 6px; flex-wrap: wrap; }
  .avail .chip { color: var(--available); border-color: color-mix(in srgb, var(--available) 50%, transparent); }

  /* detail */
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 3px 10px; font-size: 13px; }
  .kv dt { color: var(--ink-dim); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; align-self: center; }
  .kv dd { margin: 0; }
  .dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .dhead h3 { margin: 0; font-size: 16px; font-weight: 800; }
  .dsec { margin-top: 12px; }
  .dsec > .t { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; }
  .contact { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
  .contact .who { flex: 1; min-width: 0; }
  .contact .num { font-family: var(--mono); font-size: 13px; }
  .contact .btn { padding: 3px 10px; font-size: 12px; }
  .src { font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-dim); }
  .src.duty { color: var(--available); }
  .src.line { color: var(--busy); }
  .mini-log { font-size: 12px; }
  .mini-log div { padding: 2px 0; border-bottom: 1px solid var(--line-soft); }
  .stepper { display: flex; gap: 4px; margin: 6px 0; }
  .stepper span { flex: 1; text-align: center; font-size: 10px; padding: 3px 0; border-radius: 4px; background: var(--panel); color: var(--ink-dim); border: 1px solid var(--line); }
  .stepper span.done { background: var(--accent-dim); color: #eafffb; border-color: var(--accent-dim); }
  .stepper span.cur { border-color: var(--accent); color: var(--accent); }
  .gbody label { margin-top: 8px; }
  .gbody input:not([type=checkbox]), .gbody select, .gbody textarea { width: 100%; box-sizing: border-box; }
  .armed { background: var(--emergency) !important; color: #fff !important; }

  .ext { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .ext input { width: 70px; padding: 4px 8px; font-family: var(--mono); }
  .ext.missing input { border-color: var(--priority); box-shadow: 0 0 0 2px color-mix(in srgb, var(--priority) 35%, transparent); }
  .log div { font-size: 12px; }
</style>
</head>
<body>
<div class="topbar">
  <span class="link-net" id="net">link down</span>
  <span class="ext" id="extWrap" title="The phone at your desk. Click-to-dial rings this first, then connects you.">
    Your extension <input id="ext" inputmode="numeric" maxlength="6" placeholder="e.g. 201">
    <label style="display:flex;gap:4px;align-items:center;margin:0;text-transform:none;letter-spacing:0;font-size:11px"><input type="checkbox" id="extRemember">remember</label>
  </span>
  <span class="spacer"></span>
  <button class="btn" id="btnNotify" style="padding:6px 10px;font-size:11px" title="Emergency and job alerts on this device while it's in the background">🔔 Notifications</button>
  <button class="btn" id="btnMessage" style="padding:6px 10px;font-size:11px">Message</button>
  <button class="btn" id="btnFitMap" style="padding:6px 10px;font-size:11px">Fit map</button>
  <button class="btn" id="btnCallsigns" style="padding:6px 10px;font-size:11px">Call signs</button>
  <a class="btn" href="/forms.html" style="padding:6px 10px;font-size:11px">Reports <span id="reportsBadge"></span></a>
  <span class="clock" id="clock">--:--:--</span>
  <div class="user-block">
    <span class="avatar" id="avatar"></span>
    <span class="who"><span class="name" id="whoName"></span><span class="role" id="whoRole"></span></span>
  </div>
  <button class="btn" id="signout" style="padding:6px 12px;font-size:12px">Sign out</button>
</div>

<div class="stage">
  <div id="map"></div>

  <div class="attn-strip" id="attn"></div>

  <section class="glass" id="pDispatch">
    <header data-collapse="pDispatch"><span class="chev">▾</span> Dispatch <span class="count" id="dispCount"></span>
      <span class="tools"><button class="btn primary" id="newJob">New job</button><button class="btn" id="newVisit">New visit</button></span>
    </header>
    <div class="gbody">
      <div class="chips" id="dispFilter">
        <button class="chip on" data-f="attention">Needs attendance</button>
        <button class="chip" data-f="all">All open</button>
        <button class="chip" data-f="jobs">Jobs</button>
        <button class="chip" data-f="visits">Visits</button>
        <button class="chip" data-f="closed">Closed 24h</button>
      </div>
      <div id="dispList"></div>
    </div>
  </section>

  <section class="glass" id="pShift">
    <header data-collapse="pShift"><span class="chev">▾</span> On shift <span class="count" id="shiftCount"></span></header>
    <div class="gbody" id="shiftBody"></div>
  </section>

  <section class="glass" id="pDetail">
    <header data-collapse="pDetail"><span class="chev">▾</span> <span id="detailTitle">Detail</span>
      <span class="tools"><button class="btn" id="detailClose" hidden>Close</button></span>
    </header>
    <div class="gbody" id="detailBody"></div>
  </section>

  <section class="glass collapsed" id="pLog">
    <header data-collapse="pLog"><span class="chev">▾</span> Event log
      <span class="tools"><input id="logFilter" placeholder="filter" style="padding:2px 6px;font-size:11px;width:120px" onclick="event.stopPropagation()"></span>
    </header>
    <div class="gbody"><div class="log" id="log"></div></div>
  </section>
</div>

<div class="icon-rail"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/app.js"></script>
<script src="/nav.js"></script>
<script src="/forms-ui.js"></script>
<script>
'use strict';
const { api, el, els, esc } = CCCS;
if (!CCCS.requireAuth(['DISPATCHER', 'SUPERVISOR', 'SYSTEM_ADMIN'])) throw new Error('auth');
const localDT = (iso) => (iso ? new Date(Date.parse(iso) - new Date(iso).getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '');
const me = CCCS.getSession().user;

el('#whoName').textContent = me.display_name;
el('#whoRole').textContent = me.role.replace('_', ' ');
el('#avatar').textContent = me.display_name.split(/\s+/).map((s) => s[0]).slice(0, 2).join('').toUpperCase();
el('#signout').onclick = () => { CCCS.clearSession(); location.href = '/index.html'; };
setInterval(() => (el('#clock').textContent = CCCS.hhmmss()), 250);

const state = {
  personnel: [], mdts: [], jobs: [], sites: [], site_visits: [], shifts: [], requests: [], emergencies: [], events: [], reports: [],
  selected: null,          // { kind: 'j'|'v'|'p'|'m', id }
  mode: null,              // non-selection Detail modes: newJob, newVisit, assign, message, notify, callsigns, report
  modeArg: null,
  dispFilter: 'attention',
};
const CLOSED_JOB = ['COMPLETED', 'CANCELLED'];
const CLOSED_VISIT = ['COMPLETED', 'CANCELLED', 'MISSED'];

/* ------------------------------------------------------------------ *
 * Panels: collapse state per panel, remembered on this browser
 * ------------------------------------------------------------------ */
const collapsed = (() => { try { return JSON.parse(localStorage.getItem('cccs.control.collapsed') || '{}'); } catch { return {}; } })();
function applyCollapsed() {
  for (const id of ['pDispatch', 'pShift', 'pDetail', 'pLog']) {
    if (id in collapsed) el('#' + id).classList.toggle('collapsed', collapsed[id]);
  }
}
els('[data-collapse]').forEach((h) => h.addEventListener('click', (e) => {
  if (e.target.closest('.tools')) return;
  const p = el('#' + h.dataset.collapse);
  p.classList.toggle('collapsed');
  collapsed[h.dataset.collapse] = p.classList.contains('collapsed');
  try { localStorage.setItem('cccs.control.collapsed', JSON.stringify(collapsed)); } catch {}
}));
applyCollapsed();
const openPanel = (id) => { el('#' + id).classList.remove('collapsed'); collapsed[id] = false; };

/** Two-step confirm in place of a confirm() dialog: the first click arms the
 * button (turns red, says so), a second within 4s does it. */
function armed(btn, label, fn) {
  const original = btn.textContent;
  btn.onclick = async () => {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = label;
      setTimeout(() => { btn.classList.remove('armed'); btn.textContent = original; }, 4000);
      return;
    }
    btn.classList.remove('armed'); btn.textContent = original;
    try { await fn(); } catch (e) { showErr(e); }
  };
}
function showErr(e) {
  const n = el('#detailErr');
  if (n) n.textContent = e.message || String(e); else console.warn(e);
}

/* ------------------------------------------------------------------ *
 * Operator extension — chosen per session, because an operator works a
 * different desk on a different shift; "remember" only sets a default.
 * ------------------------------------------------------------------ */
const EXT_KEY = 'cccs.extension';
let ringsOperatorFirst = true;
function extension() { return el('#ext').value.trim(); }
function paintExt() { el('#extWrap').classList.toggle('missing', ringsOperatorFirst && !/^\d{2,6}$/.test(extension())); }
el('#ext').addEventListener('input', () => { sessionStorage.setItem(EXT_KEY, extension()); paintExt(); });
el('#ext').addEventListener('change', async () => {
  if (el('#extRemember').checked && /^\d{2,6}$/.test(extension())) await api('POST', '/api/me/extension', { extension: extension(), remember: true }).catch(() => {});
});
el('#extRemember').addEventListener('change', () => el('#ext').dispatchEvent(new Event('change')));
(async () => {
  const cfg = await api('GET', '/api/me/extension').catch(() => ({ default_extension: '', rings_operator_first: true }));
  ringsOperatorFirst = cfg.rings_operator_first !== false;
  el('#ext').value = sessionStorage.getItem(EXT_KEY) || cfg.default_extension || '';
  el('#extRemember').checked = Boolean(cfg.default_extension);
  paintExt();
})();

/* ------------------------------------------------------------------ *
 * Derived views
 * ------------------------------------------------------------------ */
const jobStatusLabel = (s) => (s === 'ACKNOWLEDGED' ? 'ACK' : s.replace('_', ' '));
const busyCls = (s) => ({ EN_ROUTE: 'busy', ON_SCENE: 'busy', TRANSPORTING: 'busy', DISPATCHED: 'busy', ACKNOWLEDGED: 'busy', MISSED: 'emg', CANCELLED: 'off' }[s] || 'on');
const openJobFor = (p) => state.jobs.find((j) => !CLOSED_JOB.includes(j.status) && j.resources.some((r) => r.personnel === p.name));
const openVisitFor = (p) => state.site_visits.find((v) => !CLOSED_VISIT.includes(v.status) && v.resources.some((r) => r.personnel_id === p.id));
const emergencyFor = (p) => state.emergencies.find((e) => e.personnel_id === p.id && e.state !== 'RESOLVED');
function welfareLeft(p) {
  if (!p.welfare_due_at) return '';
  const left = Math.round((Date.parse(p.welfare_due_at) - Date.now()) / 1000);
  if (left <= 0) return 'overdue';
  return `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
}

/** Why a job or visit "needs attendance": nobody sent, nobody accepted, or a
 * scheduled patrol that has been missed or is due with nobody on it. Null
 * means it is in hand. This is the definition the Dispatch panel's default
 * filter and the count in its header both use. */
function needsAttendance(item) {
  if (item.kind === 'job') {
    const j = item.row;
    if (CLOSED_JOB.includes(j.status)) return null;
    if (j.emergency_id) return 'emergency';
    if (!j.resources.length) return 'unassigned';
    if (j.status === 'DISPATCHED' && !j.resources.some((r) => r.acknowledged)) return 'not accepted';
    return null;
  }
  const v = item.row;
  if (v.status === 'MISSED') return 'missed';
  if (CLOSED_VISIT.includes(v.status)) return null;
  if (!v.resources.length && Date.parse(v.scheduled_for) <= Date.now() + 30 * 60000) return 'due, unassigned';
  if (v.status === 'DISPATCHED' && Date.parse(v.scheduled_for) < Date.now()) return 'not accepted';
  return null;
}

/** Jobs and patrol visits together — they share a lifecycle (dispatched →
 * acknowledged → en route → on scene → completed), so one panel. */
function dispatchItems() {
  const dayAgo = Date.now() - 86400000;
  const all = [
    ...state.jobs.map((row) => ({ kind: 'job', row, closed: CLOSED_JOB.includes(row.status) })),
    ...state.site_visits.map((row) => ({ kind: 'visit', row, closed: CLOSED_VISIT.includes(row.status) && row.status !== 'MISSED' })),
  ];
  const f = state.dispFilter;
  const out = all.filter((it) => {
    if (f === 'closed') return it.closed && Date.parse(it.row.updated_at || it.row.created_at) > dayAgo;
    if (it.closed) return false;
    if (f === 'attention') return Boolean(needsAttendance(it));
    if (f === 'jobs') return it.kind === 'job';
    if (f === 'visits') return it.kind === 'visit';
    return true;
  });
  const priRank = { RED: 0, AMBER: 1, GREEN: 2, ROUTINE: 3 };
  out.sort((a, b) => (Boolean(needsAttendance(b)) - Boolean(needsAttendance(a)))
    || ((a.kind === 'job' ? priRank[a.row.priority] ?? 4 : 3.5) - (b.kind === 'job' ? priRank[b.row.priority] ?? 4 : 3.5))
    || (Date.parse(a.row.scheduled_for || a.row.created_at) - Date.parse(b.row.scheduled_for || b.row.created_at)));
  return out;
}

/** A shift now carries several people (assignments), so control's "who's on"
 * view works over one flattened row per person per shift rather than over
 * shifts directly — everything downstream (grouping, clocked-in counts,
 * "find this person's shift") reads personnel_id/clocked_in/starts_at off
 * these rows exactly as it used to read them off a shift itself. */
function personShiftRows(shifts) {
  const rows = [];
  for (const s of shifts) {
    for (const a of s.assignments) {
      if (['REMOVED', 'DECLINED'].includes(a.status)) continue;
      rows.push({
        personnel_id: a.personnel_id, clocked_in: Boolean(a.clocked_in_at && !a.clocked_out_at), clocked_in_at: a.clocked_in_at,
        is_duty_supervisor: a.is_duty_supervisor,
        shift_id: s.id, shift_status: s.status, starts_at: s.starts_at, ends_at: s.ends_at, site_name: s.site_name,
      });
    }
  }
  return rows;
}
/** Shifts that are live now: clocked in, or rostered to have started and not
 * clocked in (shown so control sees a no-show forming, not only after it). */
function liveShifts() {
  const now = Date.now();
  return personShiftRows(state.shifts).filter((s) => s.clocked_in
    || (['PUBLISHED', 'IN_PROGRESS'].includes(s.shift_status) && Date.parse(s.starts_at) <= now && Date.parse(s.ends_at) > now));
}
const hhmm = (iso) => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
function shiftBand(s) {
  const h = new Date(s.starts_at).getHours();
  return h >= 5 && h < 12 ? 'Early' : h >= 12 && h < 18 ? 'Late' : 'Night';
}
function isAvailable(p) { return !emergencyFor(p) && !openJobFor(p) && !openVisitFor(p) && p.employment_status === 'ACTIVE'; }

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
/* Someone rostered who still hasn't clocked in 15 minutes after their shift
 * started (routes-attendance.js raises it). Read from the shifts, so it is
 * there after a reload too; it goes when they clock in or the shift ends. */
const lateLive = new Map(), lateDismissed = new Set();
function lateAlerts() {
  const now = Date.now(), out = new Map(lateLive);
  for (const s of state.shifts || []) for (const a of s.assignments || []) {
    if (a.late_alert_at) out.set(a.id, { assignment_id: a.id, personnel_id: a.personnel_id, name: a.personnel_name, site_name: s.site_name, starts_at: s.starts_at, ends_at: s.ends_at, clocked: Boolean(a.clocked_in_at) });
  }
  return [...out.values()].filter((x) => !x.clocked && !lateDismissed.has(x.assignment_id) && (!x.ends_at || Date.parse(x.ends_at) > now));
}
// Only STANDARD-visibility reports ever reach state.reports (a RESTRICTED
// one broadcasts no content, by design — see routes-forms.js's header) and
// only OPEN ones stay in it, so a severity banner can never show a report
// this login isn't entitled to read, and clears itself once reviewed.
function urgentReports() { return state.reports.filter((r) => r.severity === 'HIGH' || r.severity === 'CRITICAL'); }
function updateReportsBadge() {
  const n = state.reports.length, badge = el('#reportsBadge');
  if (badge) badge.textContent = n ? `(${n})` : '';
}
function renderAttention() {
  const emgs = state.emergencies.filter((e) => e.state !== 'RESOLVED');
  const reqs = state.requests.filter((r) => r.state === 'PENDING')
    .sort((a, b) => (b.priority - a.priority) || (Date.parse(a.requested_at) - Date.parse(b.requested_at)));
  updateReportsBadge();
  el('#attn').innerHTML = urgentReports().map((r) => `
    <div class="banner ${r.severity === 'CRITICAL' ? 'emg' : 'req pri'}">
      <strong>${esc(r.severity)} SEVERITY REPORT</strong>
      <span class="mono">${esc(r.reference)} · ${esc(r.definition_name)}</span>
      <span class="dim">${esc(r.subject_label || '')} · filed by ${esc(r.submitted_by)}</span>
      <span style="flex:1"></span>
      <button class="btn primary" data-reviewreport="${r.id}">Review</button>
    </div>`).join('') + emgs.map((e) => `
    <div class="banner emg">
      <strong>${e.kind === 'WELFARE' ? 'WELFARE OVERDUE — NO CHECK-IN' : 'EMERGENCY'}</strong>
      <span class="mono">${esc(e.callsign)} · ${e.lat ? e.lat.toFixed(4) + ', ' + e.lon.toFixed(4) : 'no fix'} · ${new Date(e.activated_at).toLocaleTimeString()}</span>
      ${e.note ? `<span class="dim">last task: ${esc(e.note)}</span>` : ''}
      <span class="dim">${e.state === 'ACKNOWLEDGED' ? 'acknowledged by ' + esc(e.acknowledged_by) : ''}</span>
      <span style="flex:1"></span>
      ${e.job_id ? `<button class="btn" data-emgjob="${e.job_id}">Job ${esc((state.jobs.find((j) => j.id === e.job_id) || {}).reference || '')}</button>` : ''}
      ${e.state === 'ACTIVE' ? `<button class="btn danger" data-ack="${e.id}">Acknowledge</button>` : ''}
      ${e.personnel_id ? `<button class="btn" data-emgp="${e.personnel_id}">Officer</button>` : ''}
      ${e.mdt_id ? `<button class="btn" data-emgm="${e.mdt_id}">Vehicle</button>` : ''}
      <button class="btn ok" data-emgres="${e.id}">Reset emergency</button>
    </div>`).join('') + reqs.map((r) => `
    <div class="banner req ${r.priority ? 'pri' : ''}">
      <strong>${r.priority ? 'PRIORITY CALLBACK REQUEST' : 'CALLBACK REQUEST'}</strong>
      <span class="mono">${esc(r.callsign)} · ${new Date(r.requested_at).toLocaleTimeString()}</span>
      ${r.note ? `<span class="dim">${esc(r.note)}</span>` : ''}
      <span style="flex:1"></span>
      <button class="btn primary" data-reqp="${r.personnel_id}">Contact</button>
      <button class="btn" data-reqclear="${r.id}">Mark answered</button>
    </div>`).join('') + lateAlerts().map((x) => `
    <div class="banner req pri">
      <strong>NOT CLOCKED IN</strong>
      <span class="mono">${esc(x.name)}${x.site_name ? ' · ' + esc(x.site_name) : ''} · started ${new Date(x.starts_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</span>
      <span class="dim">reminder text sent at 5 min</span>
      <span style="flex:1"></span>
      <button class="btn primary" data-reqp="${x.personnel_id}">Contact</button>
      <button class="btn" data-latedismiss="${x.assignment_id}">Dismiss</button>
    </div>`).join('');
  els('[data-reviewreport]').forEach((b) => (b.onclick = () => setMode('report', Number(b.dataset.reviewreport))));
  els('[data-latedismiss]').forEach((b) => (b.onclick = () => { lateDismissed.add(Number(b.dataset.latedismiss)); renderAttention(); }));
  els('[data-ack]').forEach((b) => (b.onclick = () => api('POST', `/api/emergency/${b.dataset.ack}/ack`)));
  els('[data-emgres]').forEach((b) => armed(b, 'Confirm reset', () => api('POST', `/api/emergency/${b.dataset.emgres}/resolve`)));
  els('[data-emgjob]').forEach((b) => (b.onclick = () => select('j', Number(b.dataset.emgjob))));
  els('[data-emgp]').forEach((b) => (b.onclick = () => select('p', Number(b.dataset.emgp))));
  els('[data-emgm]').forEach((b) => (b.onclick = () => select('m', Number(b.dataset.emgm))));
  els('[data-reqp]').forEach((b) => (b.onclick = () => select('p', Number(b.dataset.reqp))));
  els('[data-reqclear]').forEach((b) => (b.onclick = () => api('POST', `/api/calls/requests/${b.dataset.reqclear}/clear`, {})));
}

function renderDispatch() {
  const items = dispatchItems();
  const attention = [...state.jobs.map((row) => ({ kind: 'job', row })), ...state.site_visits.map((row) => ({ kind: 'visit', row }))].filter(needsAttendance).length;
  el('#dispCount').textContent = attention ? `${attention} need attendance` : '';
  els('#dispFilter .chip').forEach((c) => c.classList.toggle('on', c.dataset.f === state.dispFilter));
  const sel = state.selected;
  el('#dispList').innerHTML = items.length ? items.map((it) => {
    const r = it.row, need = needsAttendance(it);
    const isSel = sel && ((it.kind === 'job' && sel.kind === 'j') || (it.kind === 'visit' && sel.kind === 'v')) && sel.id === r.id;
    const who = it.kind === 'job' ? r.resources.map((x) => x.callsign || x.personnel || x.mdt) : r.resources.map((x) => x.personnel);
    return `<div class="card ${isSel ? 'sel' : ''} ${need === 'emergency' || need === 'missed' ? 'alarm' : ''} ${it.closed ? 'closed' : ''}" data-open="${it.kind === 'job' ? 'j' : 'v'}:${r.id}">
      <div class="card-top">
        <span style="display:flex;gap:6px;align-items:center"><span class="kind ${it.kind}">${it.kind === 'job' ? 'JOB' : 'VISIT'}</span><span class="cs">${esc(r.reference)}</span></span>
        <span style="display:flex;gap:6px;align-items:center">
          ${it.kind === 'job' ? `<span class="pri pri-${r.priority}">${r.priority}</span>` : ''}
          <span class="status-pill ${busyCls(r.status)}">${jobStatusLabel(r.status)}</span>
        </span>
      </div>
      <div class="card-sub">
        <span>${esc(it.kind === 'job' ? `${r.incident_type} — ${r.location}` : `${r.site_name || 'Site'}${r.beat_name ? ' — ' + r.beat_name : ''}`)}</span>
      </div>
      <div class="card-sub">
        <span>${need ? `<span class="needs">▲ ${esc(need)}</span>` : esc(who.join(', ') || 'unassigned')}</span>
        <span>${it.kind === 'visit' ? hhmm(r.scheduled_for) : hhmm(r.created_at)}</span>
      </div>
    </div>`;
  }).join('') : `<p class="dim">${state.dispFilter === 'attention' ? 'Nothing needs attendance.' : 'Nothing here.'}</p>`;
  els('#dispList [data-open]').forEach((n) => n.addEventListener('click', () => {
    const [k, id] = n.dataset.open.split(':'); select(k, Number(id), { pan: true });
  }));
}
els('#dispFilter .chip').forEach((c) => (c.onclick = () => { state.dispFilter = c.dataset.f; renderDispatch(); }));

function personCard(p, shift) {
  const emg = emergencyFor(p), job = openJobFor(p), visit = openVisitFor(p);
  const task = job || visit;
  const pill = emg ? ['emg', 'EMERGENCY'] : task ? [busyCls(task.status), jobStatusLabel(task.status)] : ['on', 'AVAILABLE'];
  const clockedIn = shift && shift.clocked_in;
  const sel = state.selected && state.selected.kind === 'p' && state.selected.id === p.id;
  return `<div class="card ${sel ? 'sel' : ''} ${emg ? 'alarm' : ''}" data-p="${p.id}" style="${clockedIn || !shift ? '' : 'opacity:.7'}">
    <div class="card-top">
      <span class="cs">${esc(p.callsign || p.name)}</span>
      <span style="display:flex;gap:6px;align-items:center">
        ${shift && shift.is_duty_supervisor ? '<span class="src duty">DUTY SUP</span>' : ''}
        ${clockedIn || !shift ? `<span class="status-pill ${pill[0]}">${pill[1]}</span>` : '<span class="status-pill emg">NOT CLOCKED IN</span>'}
      </span>
    </div>
    <div class="card-sub">
      <span>${esc(p.name)}${shift && shift.site_name ? ' · ' + esc(shift.site_name) : ''}</span>
      <span>${task ? esc(task.reference) : ''}${p.welfare_due_at ? ` · welfare ${welfareLeft(p)}` : ''}</span>
    </div>
  </div>`;
}

function renderShift() {
  const live = liveShifts();
  const byPerson = new Map();
  for (const s of live) if (!byPerson.has(s.personnel_id) || s.clocked_in) byPerson.set(s.personnel_id, s);
  const onShift = [...byPerson.values()];
  const clockedIn = onShift.filter((s) => s.clocked_in);
  const people = (s) => state.personnel.find((p) => p.id === s.personnel_id);
  const available = clockedIn.map(people).filter((p) => p && isAvailable(p));
  const mdtsFree = state.mdts.filter((m) => m.connected && !m.emergency && !m.job_id && (m.duty_status || 'AVAILABLE') === 'AVAILABLE');
  el('#shiftCount').textContent = `${clockedIn.length} clocked in`;

  // Group by the shift itself, not by matching times — several distinct
  // shifts can share a start/end, and one shift now carries several people.
  const groups = new Map();
  for (const s of onShift) {
    if (!groups.has(s.shift_id)) groups.set(s.shift_id, { s, rows: [] });
    groups.get(s.shift_id).rows.push(s);
  }
  const ordered = [...groups.values()].sort((a, b) => Date.parse(a.s.starts_at) - Date.parse(b.s.starts_at));
  // Anyone on a job or with a welfare timer but no live shift is still shown,
  // under its own heading — an officer mid-task must never vanish from view
  // just because their rota entry is wrong.
  const offRota = state.personnel.filter((p) => !byPerson.has(p.id) && (openJobFor(p) || openVisitFor(p) || p.welfare_due_at || emergencyFor(p)));

  el('#shiftBody').innerHTML = `
    <div class="grp"><span>Available patrols</span><span>${available.length + mdtsFree.length}</span></div>
    <div class="avail">${available.map((p) => `<button class="chip" data-p="${p.id}">${esc(p.callsign || p.name)}</button>`).join('')}
      ${mdtsFree.map((m) => `<button class="chip" data-m="${m.id}">${esc(m.mdt_code)}${m.callsign ? ' · ' + esc(m.callsign) : ''}</button>`).join('')}
      ${available.length + mdtsFree.length ? '' : '<span class="dim" style="font-size:12px">None free right now.</span>'}</div>
    ${ordered.map((g) => `
      <div class="grp"><span>${shiftBand(g.s)} · ${hhmm(g.s.starts_at)}–${hhmm(g.s.ends_at)}</span><span>${g.rows.filter((s) => s.clocked_in).length}/${g.rows.length}</span></div>
      ${g.rows.map((s) => { const p = people(s); return p ? personCard(p, s) : ''; }).join('')}`).join('')
      || '<p class="dim" style="margin-top:10px">Nobody is rostered on right now.</p>'}
    ${offRota.length ? `<div class="grp"><span>Working, not on the rota</span><span>${offRota.length}</span></div>${offRota.map((p) => personCard(p, null)).join('')}` : ''}
    <div class="grp"><span>Vehicles (MDT)</span><span>${state.mdts.filter((m) => m.connected).length} online</span></div>
    ${state.mdts.map((m) => `<div class="card ${state.selected && state.selected.kind === 'm' && state.selected.id === m.id ? 'sel' : ''} ${m.emergency ? 'alarm' : ''}" data-m="${m.id}">
      <div class="card-top"><span class="cs">${esc(m.mdt_code)}</span><span class="status-pill ${m.emergency ? 'emg' : !m.connected ? 'off' : m.job_id ? 'busy' : 'on'}">${m.emergency ? 'EMERGENCY' : !m.connected ? 'OFFLINE' : m.job_id ? 'ON JOB' : (m.duty_status || 'AVAILABLE').replace('_', ' ')}</span></div>
      <div class="card-sub"><span>${esc(m.callsign || 'no call sign')}</span><span>${esc((m.crew || []).map((c) => c.name).join(', ') || 'no crew')}</span></div>
    </div>`).join('')}`;
  els('#shiftBody [data-p]').forEach((n) => (n.onclick = () => select('p', Number(n.dataset.p), { pan: true })));
  els('#shiftBody [data-m]').forEach((n) => (n.onclick = () => select('m', Number(n.dataset.m), { pan: true })));
}

let map = null;
function renderMap() {
  if (!map) return;
  const mdtUnits = state.mdts.filter((m) => m.lat != null).map((m) => ({
    ...m, _kind: 'm', callsign: m.callsign || m.mdt_code, status: m.emergency ? 'EMERGENCY' : (!m.connected ? 'OFFLINE' : (m.duty_status || 'AVAILABLE')),
  }));
  // A foot officer's dot only ever appears once they're reporting a
  // position at all (FOOT_TRACKING on, clocked in) — its mere presence
  // already means "on task", so unlike an MDT there's no separate
  // duty_status to reflect; ON_TASK is a reasonable single colour for it.
  const personnelUnits = state.personnel.filter((p) => p.lat != null).map((p) => ({
    ...p, _kind: 'p', callsign: p.callsign || p.name, status: 'ON_TASK',
  }));
  const units = [...mdtUnits, ...personnelUnits];
  // Visits ride the job-marker layer with their own reference, so the map
  // shows every place someone is due to attend, not only incidents.
  const markers = [
    ...state.jobs.filter((j) => !CLOSED_JOB.includes(j.status)),
    ...state.site_visits.filter((v) => !CLOSED_VISIT.includes(v.status) && v.lat != null).map((v) => ({ ...v, priority: 'ROUTINE' })),
  ];
  map.render(units, markers, (u) => select(u._kind, u.id));
}

function renderLog() {
  const f = el('#logFilter').value.toLowerCase();
  const rows = state.events.filter((e) => !f || e.summary.toLowerCase().includes(f)).slice(-200);
  el('#log').innerHTML = rows.map((e) => `<div><span class="t">${CCCS.hhmmss(new Date(e.at))}</span>${esc(e.summary)}</div>`).join('');
  el('#log').scrollTop = el('#log').scrollHeight;
}
el('#logFilter').addEventListener('input', renderLog);

function renderAll() { renderAttention(); renderDispatch(); renderShift(); renderMap(); renderDetail(); }

/* ------------------------------------------------------------------ *
 * Selection and Detail modes
 * ------------------------------------------------------------------ */
function select(kind, id, opts = {}) {
  state.selected = { kind, id }; state.mode = null; state.modeArg = null;
  openPanel('pDetail');
  renderDispatch(); renderShift(); renderDetail({ force: true });
  if (opts.pan && map) {
    const t = kind === 'j' ? state.jobs.find((x) => x.id === id) : kind === 'v' ? state.site_visits.find((x) => x.id === id)
      : kind === 'm' ? state.mdts.find((x) => x.id === id) : null;
    if (t && t.lat != null) map.centerOn(t.lat, t.lon, 15);
  }
}
function setMode(mode, arg = null) {
  state.mode = mode; state.modeArg = arg;
  openPanel('pDetail');
  renderDetail({ force: true });
}
el('#detailClose').onclick = () => { state.mode = null; state.selected = null; renderDispatch(); renderShift(); renderDetail({ force: true }); };

let detailTick = null;
function renderDetail({ force = false } = {}) {
  // A live update must never yank a half-typed field out from under the
  // person typing in it — unless they just chose something else.
  if (!force && document.activeElement && el('#detailBody').contains(document.activeElement)
    && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (detailTick) { clearInterval(detailTick); detailTick = null; }
  el('#detailClose').hidden = !state.mode && !state.selected;
  const body = el('#detailBody');
  const mode = state.mode;
  const title = (t) => (el('#detailTitle').textContent = t);
  if (mode === 'newJob') { title('New job'); return renderNewJob(body); }
  if (mode === 'newVisit') { title('New patrol visit'); return renderNewVisit(body); }
  if (mode === 'assign') { title('Assign'); return renderAssign(body); }
  if (mode === 'message') { title('Send message'); return renderMessage(body); }
  if (mode === 'notify') { title('Notifications'); return renderNotify(body); }
  if (mode === 'callsigns') { title('Call signs'); return renderCallsigns(body); }
  if (mode === 'report') { title('Report'); return renderReport(body); }
  if (!state.selected) { title('Detail'); body.innerHTML = '<p class="dim">Select a job, a patrol visit, an officer or a vehicle.</p>'; return; }
  const { kind } = state.selected;
  if (kind === 'j') { title('Job'); return renderJob(body); }
  if (kind === 'v') { title('Patrol visit'); return renderVisit(body); }
  if (kind === 'p') { title('Officer'); return renderPerson(body); }
  if (kind === 'm') { title('Vehicle'); return renderMdt(body); }
}

function fmtElapsed(fromIso, toIso) {
  const ms = (toIso ? Date.parse(toIso) : Date.now()) - Date.parse(fromIso);
  if (!(ms >= 0)) return '—';
  const mins = Math.floor(ms / 60000);
  return mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, '0')}m`;
}
function stepper(stages, stageAt, active) {
  let last = -1; stages.forEach(([c], i) => { if (stageAt[c]) last = i; });
  return `<div class="stepper">${stages.map(([c, label], i) => `<span class="${stageAt[c] ? (i === last && active ? 'cur' : 'done') : ''}" title="${stageAt[c] ? new Date(stageAt[c]).toLocaleTimeString() : 'waiting'}">${label}</span>`).join('')}</div>`;
}

/** Reports filed against this job / visit / person, as the server allows
 * this controller to see them — restricted ones they are not named on are
 * simply not returned. */
async function paintReports(host, subjectType, subjectId) {
  try {
    const rows = await api('GET', `/api/form-submissions?subject_type=${subjectType}&subject_id=${subjectId}`);
    CCCSForms.list(host, rows, (id) => setMode('report', id), 'No reports filed.');
  } catch { host.innerHTML = '<p class="dim">Reports unavailable.</p>'; }
}

function renderJob(body) {
  const j = state.jobs.find((x) => x.id === state.selected.id);
  if (!j) { body.innerHTML = '<p class="dim">That job is no longer open.</p>'; return; }
  const active = !CLOSED_JOB.includes(j.status);
  const stageAt = { DISPATCHED: j.dispatched_at, ACKNOWLEDGED: j.acknowledged_at, EN_ROUTE: j.en_route_at, ON_SCENE: j.on_scene_at, COMPLETED: j.completed_at };
  body.innerHTML = `
    <div class="dhead">
      <div><div style="display:flex;gap:8px;align-items:center"><span class="pri pri-${j.priority}">${j.priority}</span><h3>${esc(j.incident_type)}</h3></div>
        <div class="dim" style="margin-top:4px;font-size:12.5px">${esc(j.reference)} · ${esc(j.location)}</div></div>
      ${active ? `<div style="text-align:right"><div style="font-size:20px;font-weight:800" id="jElapsed">${fmtElapsed(j.created_at)}</div><div class="dim" style="font-size:10px">SINCE CREATED</div></div>`
        : `<span class="status-pill ${j.status === 'CANCELLED' ? 'off' : 'on'}">${esc(j.status)}</span>`}
    </div>
    ${j.status === 'CANCELLED' ? '' : stepper([['DISPATCHED', 'Disp'], ['ACKNOWLEDGED', 'Ack'], ['EN_ROUTE', 'En rt'], ['ON_SCENE', 'Scene'], ['COMPLETED', 'Done']], stageAt, active)}
    <dl class="kv" id="jView">
      ${j.what3words ? `<dt>What3Words</dt><dd class="mono">///${esc(j.what3words)}</dd>` : ''}
      <dt>Caller</dt><dd>${esc(j.caller || '—')}</dd>
      <dt>Detail</dt><dd>${esc(j.description || '—')}</dd>
      ${j.keyholder ? `<dt>Keyholder</dt><dd>${esc(j.keyholder)}</dd>` : ''}
    </dl>
    <div id="jEdit" class="hide">
      <label>Incident type</label><input id="eType" value="${esc(j.incident_type)}">
      <label>Location</label><input id="eLoc" value="${esc(j.location)}">
      <label>What3Words</label><input id="eW3w" value="${esc(j.what3words || '')}">
      <label>Caller</label><input id="eCaller" value="${esc(j.caller || '')}">
      <label>Detail</label><textarea id="eDesc" rows="3">${esc(j.description || '')}</textarea>
      <div class="btn-row" style="margin-top:6px"><button class="btn primary" id="eSave">Save details</button><button class="btn" id="eCancel">Cancel</button></div>
    </div>
    <div class="dsec"><div class="t">Resources</div>
      ${j.resources.length ? j.resources.map((r) => `<div style="display:flex;gap:6px;align-items:center;margin-bottom:3px">
        <span style="flex:1">${esc(r.callsign || r.personnel || r.mdt)}${r.personnel && r.callsign ? ` <span class="dim">(${esc(r.personnel)})</span>` : ''}${r.acknowledged ? ' ✓' : ''}</span>
        ${r.personnel ? `<button class="btn" data-contact="${esc(r.personnel)}" style="padding:1px 8px;font-size:11px">Contact</button>` : ''}
        ${active ? `<button class="btn danger" data-standdown="${esc(r.personnel ? 'p:' + r.personnel : 'm:' + r.mdt)}" style="padding:1px 8px;font-size:11px">Stand down</button>` : ''}
      </div>`).join('') : '<p class="dim" style="margin:0">Nobody assigned.</p>'}
      ${active ? `<div class="btn-row" style="margin-top:6px"><button class="btn primary" id="jAssign">Assign</button><button class="btn" id="jEditBtn">Edit details</button></div>` : ''}
    </div>
    <div class="dsec"><div class="t">Notes — visible to every assigned call sign</div>
      <textarea id="jNotes" rows="2">${esc(j.notes || '')}</textarea>
      <div class="btn-row" style="margin-top:4px"><button class="btn" id="jSaveNotes">Save notes</button></div>
    </div>
    <div class="dsec"><div class="t">Reports</div><div id="jReports"><p class="dim">Loading…</p></div></div>
    ${active ? `<div class="dsec">
      <div class="t">Complete manually</div>
      <p class="dim" style="margin:0 0 6px;font-size:12.5px">Confirmed done by radio or in person, without the phone app or MDT — set when it happened and mark it complete.</p>
      <div style="display:flex;gap:8px">
        <div style="flex:1"><label style="font-size:11px">On scene</label><input type="datetime-local" id="jOnScene" value="${localDT(j.on_scene_at)}"></div>
        <div style="flex:1"><label style="font-size:11px">Completed</label><input type="datetime-local" id="jCompletedAt" value="${localDT(j.completed_at)}"></div>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn ok" id="jDone">Mark completed</button>
        <button class="btn danger" id="jCancel">Cancel job</button>

async function paintContact(p) {
  const host = el('#pContact');
  let c;
  try { c = await api('GET', `/api/personnel/${p.id}/contact`); }
  catch (e) { host.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  if (!el('#pContact') || !state.selected || state.selected.kind !== 'p' || state.selected.id !== p.id) return;
  const line = (who, phone, valid, supervisor, source) => `
    <div class="contact">
      <div class="who">
        <div>${esc(who)} ${source ? `<span class="src ${source === 'DUTY_SUPERVISOR' ? 'duty' : 'line'}">${source === 'DUTY_SUPERVISOR' ? 'DUTY SUPERVISOR' : 'LINE MANAGER'}</span>` : ''}</div>
        <div class="num">${phone ? esc(phone) : '<span class="dim">no number on record</span>'}</div>
      </div>
      ${phone ? `<button class="btn primary" data-dial="${supervisor ? 1 : 0}">Dial</button>` : ''}
      ${phone && valid ? `<button class="btn" data-sms="${supervisor ? 1 : 0}">SMS</button>` : ''}
    </div>`;
  host.innerHTML = line(c.name, c.phone, c.phone_valid, false, null)
    + (c.supervisor ? line(`Supervisor: ${c.supervisor.name}`, c.supervisor.phone, c.supervisor.phone_valid, true, c.supervisor.source)
      : '<div class="contact"><div class="who dim">No supervisor — nobody is rostered as duty supervisor and no line manager is set.</div></div>');
  els('[data-dial]', host).forEach((b) => (b.onclick = () => dial(p, b.dataset.dial === '1', c)));
  els('[data-sms]', host).forEach((b) => (b.onclick = () => {
    const sup = b.dataset.sms === '1';
    el('#smsBox').classList.remove('hide'); el('#smsBox').dataset.sup = sup ? '1' : '0';
    el('#smsTo').textContent = `SMS to ${sup ? c.supervisor.name : c.name}`;
    el('#smsText').focus();
  }));
  el('#smsCancel').onclick = () => el('#smsBox').classList.add('hide');
  el('#smsSend').onclick = async () => {
    const text = el('#smsText').value.trim(); if (!text) return;
    el('#smsSend').disabled = true;
    try {
      const r = await api('POST', '/api/contact/sms', { personnel: p.id, supervisor: el('#smsBox').dataset.sup === '1', body: text, job_id: (openJobFor(p) || {}).id });
      el('#contactStatus').textContent = r.dry_run ? 'Recorded — SMS is in dry-run mode, nothing was actually sent.' : 'SMS accepted by Twilio; delivery status will follow.';
      el('#smsText').value = ''; el('#smsBox').classList.add('hide');
      paintContactLog(p);
    } catch (e) { el('#contactStatus').textContent = `SMS failed: ${e.message}`; }
    el('#smsSend').disabled = false;
  };
  paintContactLog(p);
}

/** Every dial is recorded server-side before anything rings. With FreePBX
 * configured the server places the call (your extension first) and the
 * outcome arrives later as an event; without it the server hands back a
 * tel: link and records an attempt only — the browser cannot report what
 * happened next, and the log says so. */
async function dial(p, supervisor, c) {
  const ext = extension();
  if (ringsOperatorFirst && !/^\d{2,6}$/.test(ext)) {
    el('#contactStatus').textContent = 'Set the extension you are working from (top bar) first — the call rings your phone before connecting.';
    el('#ext').focus(); return;
  }
  try {
    const r = await api('POST', '/api/contact/dial', { personnel: p.id, supervisor, extension: ext, job_id: (openJobFor(p) || {}).id });
    const target = supervisor ? c.supervisor.name : c.name;
    if (r.dial_uri) {
      el('#contactStatus').textContent = `Dialling ${target} from this device — logged as an attempt (no outcome is reported for this kind of call).`;
      location.href = r.dial_uri;
    } else {
      el('#contactStatus').textContent = `Ringing your extension ${ext} — answer it to be connected to ${target}.`;
      pendingDials.set(r.id, p.id);
    }
    paintContactLog(p);
  } catch (e) { el('#contactStatus').textContent = e.message; }
}
const pendingDials = new Map(); // dial_log id -> personnel id, for outcome events

async function paintContactLog(p) {
  const host = el('#pContactLog'); if (!host) return;
  try {
    const rows = await api('GET', `/api/personnel/${p.id}/contact-log?limit=6`);
    const label = (d) => d.outcome === 'ANSWERED' && d.duration_s != null ? `ANSWERED ${d.duration_s}s` : d.outcome;
    host.innerHTML = rows.length ? rows.map((d) => `<div><span class="mono dim">${hhmm(d.attempted_at)}</span> ${d.channel === 'SMS' ? 'SMS' : 'Call'} by ${esc(d.actor_name)} — <strong>${esc(label(d))}</strong>${d.supervisor_source ? ` <span class="dim">(via ${d.supervisor_source === 'DUTY_SUPERVISOR' ? 'duty supervisor' : 'line manager'})</span>` : ''}${d.error_code ? ` <span class="dim">${esc(d.error_code)}</span>` : ''}</div>`).join('') : '<p class="dim" style="margin:0">None yet.</p>';
  } catch { host.innerHTML = '<p class="dim">Unavailable.</p>'; }
}

          <button class="btn primary" id="asPersonGo" ${unassigned.length ? '' : 'disabled'}>Assign</button>
        </div>
      </div>
      <div class="btn-row" style="margin-top:10px"><button class="btn" id="asBack">Back to ${esc(job.reference)}</button></div>
      <p class="err" id="detailErr"></p>`;
    els('[data-cs]', body).forEach((b) => (b.onclick = async () => {
      try { upsert(state.jobs, await api('POST', `/api/jobs/${jobId}/assign`, { resources: [b.dataset.cs] })); paint(); renderDispatch(); }
      catch (e) { showErr(e); }
    }));
    if (el('#asPersonGo')) el('#asPersonGo').onclick = async () => {
      try { upsert(state.jobs, await api('POST', `/api/jobs/${jobId}/assign`, { resources: [el('#asPerson').value] })); paint(); renderDispatch(); }
      catch (e) { showErr(e); }
    };
    el('#asBack').onclick = () => select('j', jobId);
  };
  paint();
}

function renderMessage(body) {
  const pre = state.modeArg;
  body.innerHTML = `
    <label style="margin-top:0">To</label>
    <select id="msgTo">
      ${state.personnel.map((p) => `<option value="p:${p.id}" ${pre === 'p:' + p.id ? 'selected' : ''}>${esc(p.callsign || p.name)}</option>`).join('')}
      ${state.mdts.map((m) => `<option value="m:${esc(m.mdt_code)}" ${pre === 'm:' + m.mdt_code ? 'selected' : ''}>MDT ${esc(m.mdt_code)}</option>`).join('')}
    </select>
    <label>Message</label><textarea id="msgBody" rows="3"></textarea>
    <div class="btn-row" style="margin-top:8px"><button class="btn primary" id="msgSend">Send</button><button class="btn" id="msgBack">Back</button></div>
    <p class="dim" id="msgStatus" style="font-size:12px"></p>
    <p class="err" id="detailErr"></p>`;
  el('#msgBack').onclick = () => { state.mode = null; renderDetail({ force: true }); };
  el('#msgSend').onclick = async () => {
    const [k, id] = el('#msgTo').value.split(':');
    const text = el('#msgBody').value.trim(); if (!text) return;
    try { await api('POST', '/api/messages', { [k === 'p' ? 'to_personnel' : 'to_mdt']: id, body: text }); el('#msgBody').value = ''; el('#msgStatus').textContent = 'Sent.'; }
    catch (e) { showErr(e); }
  };
  el('#msgBody').focus();
}

function renderNotify(body) {
  body.innerHTML = `
    <p class="dim" style="margin-top:0">Get an alert on this device for emergencies and welfare alarms even when this tab is in the background. On iPhone this only works after adding this page to the Home Screen.</p>
    <div class="btn-row"><button class="btn primary" id="pushOn">Enable notifications</button><button class="btn" id="pushOff" hidden>Turn off</button><button class="btn" id="pushBack">Back</button></div>
    <p class="dim" id="pushStatus" style="font-size:12px"></p>`;
  const paint = async () => {
    const s = await CCCS.push.status();
    if (s === 'unsupported' || s === 'denied') {
      el('#pushStatus').textContent = s === 'denied' ? 'Blocked — allow notifications for this site in your browser settings.' : 'Not supported in this browser.';
      el('#pushOn').hidden = true; el('#pushOff').hidden = true; return;
    }
    el('#pushOn').hidden = s === 'subscribed'; el('#pushOff').hidden = s !== 'subscribed';
    el('#pushStatus').textContent = s === 'subscribed' ? 'Notifications are on.' : '';
  };
  paint();
  el('#pushOn').onclick = async () => { try { await CCCS.push.enable(); } catch (e) { el('#pushStatus').textContent = e.message; } paint(); };
  el('#pushOff').onclick = async () => { await CCCS.push.disable(); paint(); };
  el('#pushBack').onclick = () => { state.mode = null; renderDetail({ force: true }); };
}

async function renderCallsigns(body) {
  body.innerHTML = '<p class="dim">Loading…</p>';
  const cs = await api('GET', '/api/callsigns').catch(() => null);
  if (!cs || state.mode !== 'callsigns') return;
  body.innerHTML = cs.map((c) => `
    <div class="dsec"><div class="t">${esc(c.name)} <span style="text-transform:none;letter-spacing:0;font-weight:400">${esc(c.description || '')}</span></div>
      ${c.personnel.map((p) => `<div class="dim" style="font-size:12.5px">${esc(p)}</div>`).join('')}
      ${c.mdts.map((m) => `<div style="font-size:12.5px;display:flex;gap:6px;align-items:center">${esc(m.mdt_code)} <button class="btn" data-unm="${c.id}:${esc(m.mdt_code)}" style="padding:0 6px;font-size:11px">remove</button></div>`).join('')}
      <div style="display:flex;gap:6px;margin-top:4px"><select data-pick="${c.id}">${state.mdts.map((m) => `<option>${esc(m.mdt_code)}</option>`).join('')}</select><button class="btn" data-assign="${c.id}">Assign MDT</button></div>
    </div>`).join('') + '<div class="btn-row" style="margin-top:10px"><button class="btn" id="csBack">Back</button></div>';
  els('[data-assign]', body).forEach((b) => (b.onclick = async () => { await api('POST', `/api/callsigns/${b.dataset.assign}/assign`, { mdt: body.querySelector(`[data-pick="${b.dataset.assign}"]`).value }); renderCallsigns(body); }));
  els('[data-unm]', body).forEach((b) => (b.onclick = async () => { const [id, code] = b.dataset.unm.split(':'); await api('DELETE', `/api/callsigns/${id}/assign`, { mdt: code }); renderCallsigns(body); }));
  el('#csBack').onclick = () => { state.mode = null; renderDetail({ force: true }); };
}

/* ------------------------------------------------------------------ *
 * Buttons that open a mode
 * ------------------------------------------------------------------ */
el('#newJob').onclick = (e) => { e.stopPropagation(); setMode('newJob'); };
el('#newVisit').onclick = (e) => { e.stopPropagation(); setMode('newVisit'); };
el('#btnNotify').onclick = () => setMode('notify');
el('#btnCallsigns').onclick = () => setMode('callsigns');
el('#btnMessage').onclick = () => setMode('message', state.selected && state.selected.kind === 'p' ? 'p:' + state.selected.id : null);
el('#btnFitMap').onclick = () => { if (map) map.fitToData(state.mdts, [...state.jobs, ...state.site_visits].filter((x) => x.lat != null)); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (state.mode || state.selected) && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) el('#detailClose').click();
});

/* ------------------------------------------------------------------ *
 * Alert tones (synthesised; kept verbatim from the previous console)
 * ------------------------------------------------------------------ */
const alertCtx = { current: null };
function actx() {
  if (!alertCtx.current) alertCtx.current = new (window.AudioContext || window.webkitAudioContext)();
  if (alertCtx.current.state === 'suspended') alertCtx.current.resume().catch(() => {});
  return alertCtx.current;
}
function beep(freq, ms, delayMs = 0, gain = 0.25, type = 'sine') {
  const session = CCCS.getSession();
  if (session && session.user.ui_prefs && session.user.ui_prefs.sound === false) return;
  const ctx = actx();
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  const start = ctx.currentTime + delayMs / 1000, end = start + ms / 1000;
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(gain, start + 0.005);
  g.gain.setValueAtTime(gain, Math.max(start + 0.005, end - 0.01));
  g.gain.linearRampToValueAtTime(0, end);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(start); osc.stop(end + 0.02);
}
const sound = {
  jobCreated() { beep(1100, 90); beep(1500, 110, 110); },
  callRequest() { beep(1300, 80); beep(1300, 80, 140); },
  reportEscalated() { beep(1500, 100); beep(1000, 160, 120); beep(1500, 100, 320); },
  _emergencyTimer: null,
  // Keeps sounding while ANY emergency is still ACTIVE (not yet
  // acknowledged) — re-evaluated after every emergency.* event.
  refreshEmergencyAlarm() {
    const stillActive = state.emergencies.some((e) => e.state === 'ACTIVE');
    if (stillActive && !sound._emergencyTimer) {
      const cycle = () => { beep(880, 220, 0, 0.35, 'square'); beep(660, 220, 260, 0.35, 'square'); };
      cycle();
      sound._emergencyTimer = setInterval(cycle, 900);
    } else if (!stillActive && sound._emergencyTimer) {
      clearInterval(sound._emergencyTimer);
      sound._emergencyTimer = null;
    }
  },
};

/* ------------------------------------------------------------------ *
 * Realtime
 * ------------------------------------------------------------------ */
const upsert = (list, item, key = 'id') => { const i = list.findIndex((x) => x[key] === item[key]); if (i >= 0) list[i] = item; else list.push(item); };
const bus = CCCS.bus((up) => { const n = el('#net'); n.textContent = up ? 'link up' : 'link down'; n.classList.toggle('up', up); if (up) boot(); });
const onPersonChange = (p) => { upsert(state.personnel, p); renderShift(); renderDetail(); };

bus.on('mdt.status_changed', (m) => { upsert(state.mdts, m); renderShift(); renderMap(); renderDetail(); })
   .on('mdt.created', (m) => { upsert(state.mdts, m); renderShift(); })
   .on('mdt.assigned', (m) => { upsert(state.mdts, m); renderShift(); })
   .on('mdt.crew_changed', (m) => { upsert(state.mdts, m); renderShift(); renderDetail(); })
   .on('mdt.deleted', (m) => { state.mdts = state.mdts.filter((x) => x.id !== m.id); renderShift(); renderMap(); })
   .on('job.created', (j) => { upsert(state.jobs, j); renderDispatch(); renderMap(); sound.jobCreated(); })
   .on('job.dispatched', (j) => { upsert(state.jobs, j); renderDispatch(); renderShift(); renderDetail(); })
   .on('job.status_changed', (j) => { upsert(state.jobs, j); renderDispatch(); renderShift(); renderMap(); renderDetail(); })
   .on('job.acknowledged', ({ job }) => { upsert(state.jobs, job); renderDispatch(); renderShift(); renderDetail(); })
   .on('job.stood_down', (j) => { upsert(state.jobs, j); renderDispatch(); renderShift(); renderDetail(); })
   .on('site_visit.created', (v) => { upsert(state.site_visits, v); renderDispatch(); renderMap(); })
   .on('site_visit.dispatched', (v) => { upsert(state.site_visits, v); renderDispatch(); renderShift(); renderDetail(); })
   .on('site_visit.acknowledged', ({ visit }) => { upsert(state.site_visits, visit); renderDispatch(); renderShift(); renderDetail(); })
   .on('site_visit.status_changed', (v) => { upsert(state.site_visits, v); renderDispatch(); renderShift(); renderMap(); renderDetail(); })
   .on('site_visit.stood_down', (v) => { upsert(state.site_visits, v); renderDispatch(); renderShift(); renderDetail(); })
   .on('site_visit.missed', (v) => { upsert(state.site_visits, v); renderDispatch(); renderDetail(); })
   .on('shift.created', (s) => { upsert(state.shifts, s); renderShift(); })
   .on('shift.updated', (s) => { upsert(state.shifts, s); renderShift(); renderDetail(); })
   .on('emergency.activated', (e) => { upsert(state.emergencies, e); renderAttention(); renderShift(); renderDispatch(); sound.refreshEmergencyAlarm(); })
   .on('emergency.acknowledged', (e) => { upsert(state.emergencies, e); renderAttention(); sound.refreshEmergencyAlarm(); })
   .on('emergency.resolved', (e) => { upsert(state.emergencies, e); renderAttention(); renderShift(); sound.refreshEmergencyAlarm(); })
   .on('call.request', (r) => { upsert(state.requests, r); renderAttention(); sound.callRequest(); })
   .on('call.request_cleared', (r) => { upsert(state.requests, r); renderAttention(); })
   .on('shift.not_clocked_in', (x) => { lateLive.set(x.assignment_id, x); renderAttention(); })
   .on('shift.updated', (sh) => { for (const a of sh.assignments || []) if (a.clocked_in_at) lateLive.delete(a.id); renderAttention(); })
   .on('welfare.started', ({ personnel }) => onPersonChange(personnel))
   .on('welfare.checked_in', onPersonChange)
   .on('welfare.stopped', onPersonChange)
   .on('personnel.location', (p) => { upsert(state.personnel, p); renderMap(); })
   // RESTRICTED submissions never broadcast (see routes-forms.js's header) —
   // every row this ever receives is one this login was already allowed to
   // read, same as the per-job/visit/person Reports lists elsewhere on this
   // page. A report stops appearing in the OPEN-only state.reports once it's
   // actioned, via the form.actioned event.logged entry below — there is no
   // separate broadcast for that, reusing the log line routes-forms.js
   // already sends rather than adding a second feed to keep in sync.
   .on('form.submitted', (r) => {
     upsert(state.reports, r); renderAttention();
     if (r.severity === 'HIGH' || r.severity === 'CRITICAL') sound.reportEscalated();
   })
   .on('event.logged', (e) => {
     state.events.push(e); if (state.events.length > 400) state.events.shift(); renderLog();
     if (e.type === 'form.actioned' && e.data && e.data.submission_id) {
       state.reports = state.reports.filter((r) => r.id !== e.data.submission_id);
       renderAttention();
     }
     // A PBX-placed call settles later; refresh the officer's contact log
     // if that's who is on screen.
     if (e.type === 'contact.dial_outcome' && pendingDials.has(e.data.dial_log_id)) {
       const pid = pendingDials.get(e.data.dial_log_id); pendingDials.delete(e.data.dial_log_id);
       if (state.selected && state.selected.kind === 'p' && state.selected.id === pid) {
         const s = el('#contactStatus'); if (s) s.textContent = e.summary;
         paintContactLog(state.personnel.find((p) => p.id === pid));
       }
     }
   })
   .on('message.received', () => {});

// Welfare countdowns tick without a round trip.
setInterval(() => { if (state.personnel.some((p) => p.welfare_due_at)) renderShift(); }, 1000);
// "Due, unassigned" visits and not-yet-clocked-in shifts change with time alone.
setInterval(() => { renderDispatch(); renderShift(); }, 60000);

async function boot() {
  const s = await api('GET', '/api/state');
  Object.assign(state, {
    mdts: s.mdts, jobs: s.jobs, personnel: s.personnel, emergencies: s.emergencies, events: s.events,
    sites: s.sites || [], site_visits: s.site_visits || [],
  });
  const from = new Date(Date.now() - 18 * 3600e3).toISOString(), to = new Date(Date.now() + 3600e3).toISOString();
  state.shifts = await api('GET', `/api/shifts?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`).catch(() => []);
  state.requests = await api('GET', '/api/calls/requests').catch(() => []);
  // Already scoped to what this login may read (canRead()) — a RESTRICTED
  // report without a grant is simply absent, same as everywhere else.
  state.reports = await api('GET', '/api/form-submissions?status=OPEN&limit=200').catch(() => []);
  // The map loads from a CDN. If that fails the console must still show
  // emergencies, welfare alarms and the dispatch list — a map outage must
  // never blank the screen that tells control someone needs help.
  if (!map) {
    try { map = CCCS.makeMap(el('#map')); }
    catch (e) { el('#map').innerHTML = `<p class="dim" style="position:absolute;top:50%;width:100%;text-align:center">Map unavailable (${esc(e.message)}). Everything else is live.</p>`; }
  }
  renderAll(); renderLog();
  // A reload landing mid-emergency must still sound.
  sound.refreshEmergencyAlarm();
}
// Load now as well as on every (re)connect: the console must show state even
// if the WebSocket is slow to come up.
boot();
</script>
</body>
</html>
