<link rel="stylesheet" href="https://unpkg.com/golden-layout@2.6.0/dist/css/goldenlayout-base.css">
<link rel="stylesheet" href="https://unpkg.com/golden-layout@2.6.0/dist/css/themes/goldenlayout-dark-theme.css">
<style>
  /* Real docking panels (GoldenLayout): drag tabs to rearrange, drag borders
     to resize, close one and its neighbours reflow to fill the space, and
     each tab's own maximise button is our "expand to fill screen". This
     replaces an earlier hand-rolled minimize/close/expand-per-panel scheme
     that could only approximate this. */
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; padding-left: 228px; }
  #glRoot { flex: 1; min-height: 0; margin: 8px; }
  .lm_content { background: var(--panel); overflow: hidden; }
  .lm_header { background: var(--panel-2) !important; }
  .lm_tab { background: var(--panel-2) !important; color: var(--ink-dim) !important; border: none !important; }
  .lm_tab.lm_active { background: var(--panel) !important; color: var(--ink) !important; box-shadow: inset 0 -2px 0 var(--accent) !important; }
  .lm_tab .lm_title { font-family: var(--font) !important; font-size: 11.5px !important; font-weight: 700 !important; letter-spacing: .04em !important; text-transform: uppercase !important; }
  .lm_splitter { background: var(--bg) !important; }
  .lm_splitter:hover, .lm_splitter.lm_dragging { background: var(--accent-dim) !important; }
  .lm_controls > * { opacity: .7; }
  .lm_controls > *:hover { opacity: 1; }
  /* Each tab already has its own close (lm_close_tab); the stack-level one
     is the same action restated, which read as two close buttons. */
  .lm_controls > .lm_close { display: none; }

  .pcount {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; flex: none;
    border-bottom: 1px solid var(--line); background: var(--panel-2); min-height: 32px; box-sizing: border-box;
  }

  .actionbar { display: flex; gap: 8px; padding: 8px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .emg-banner { background: #4c1113; border-bottom: 1px solid #7f1d1d; padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .emg-banner strong { color: #fecaca; letter-spacing: .08em; }
  .req-bar { background: #14202e; border-bottom: 1px solid var(--line); padding: 6px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .req-bar.pri { background: #2a1c11; border-color: var(--priority); }
  .req-bar strong { letter-spacing: .06em; }
  .req-bar.pri strong { color: var(--priority); }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 2px 10px; font-size: 13px; }
  .kv dt { color: var(--ink-dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; align-self: center; }
  .kv dd { margin: 0; font-family: var(--mono); }
  .tg-pill { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }

  /* ---- terminal / incident cards (replaces the plain text rows) ---- */
  #resList .row, #jobList .row {
    flex-direction: column; align-items: stretch; gap: 7px; padding: 11px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); margin-bottom: 7px; border-bottom: none;
  }
  #resList .row:hover, #jobList .row:hover { border-color: var(--accent-dim); background: var(--panel-2); }
  #resList .row.sel, #jobList .row.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: var(--panel-2); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-top .cs { font-family: var(--mono); font-weight: 700; font-size: 14px; }
  .card-sub { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-dim); font-size: 11.5px; }
  .status-pill { font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; white-space: nowrap; }
  .status-pill.on { background: rgba(34,197,94,.16); color: var(--available); }
  .status-pill.busy { background: rgba(234,179,8,.16); color: var(--busy); }
  .status-pill.off { background: rgba(100,116,139,.18); color: var(--offline); }
  .status-pill.emg { background: rgba(239,68,68,.2); color: var(--emergency); }
  .assign-ic {
    display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border-radius: 50%; border: none; background: rgba(239,68,68,.16); color: var(--emergency);
    cursor: pointer; flex: none; transition: background-color .12s var(--ease);
  }
  .assign-ic:hover { background: rgba(239,68,68,.3); }
  #jobList .row.closed { opacity: .55; }
  .callback-tag {
    background: linear-gradient(90deg,#4a3405,#5c4008); border: 1px solid #a16207; color: #fde68a;
    font-weight: 700; font-size: 10.5px; letter-spacing: .04em; text-align: center; text-transform: uppercase;
    padding: 6px; border-radius: 5px; cursor: pointer;
  }
  .callback-tag:hover { filter: brightness(1.15); }

  @keyframes flash-glow { 0%, 100% { box-shadow: var(--shadow); } 40% { box-shadow: 0 0 0 2px var(--accent), var(--shadow-lg); } }
  .flash { animation: flash-glow .9s var(--ease); }

  .filters-drop {
    padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px;
    background: var(--panel-2); font-size: 12.5px; flex: none;
  }
  .filters-drop label { display: flex; align-items: center; gap: 8px; margin: 0; text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--ink); }

  /* ---- job detail: header + workflow stepper (job modal) ---- */
  .job-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 14px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  .job-head .titles { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .job-head h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .job-head .elapsed { text-align: right; flex: none; }
  .job-head .elapsed .big { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; color: var(--ink); }
  .job-head .elapsed .lbl { font-size: 9.5px; letter-spacing: .08em; color: var(--ink-dim); text-transform: uppercase; margin-top: 4px; }

  .stepper { display: flex; flex-direction: column; }
  .stepper .step { display: flex; gap: 12px; position: relative; padding-bottom: 14px; }
  .stepper .step:last-child { padding-bottom: 0; }
  .stepper .step::before {
    content: ""; position: absolute; left: 9px; top: 22px; bottom: -2px; width: 1px; background: var(--line);
  }
  .stepper .step:last-child::before { display: none; }
  .stepper .dot-step {
    width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font-size: 10.5px; font-weight: 800; border: 2px solid var(--line); color: var(--ink-dim);
    background: var(--panel-2); z-index: 1;
  }
  .stepper .step.done .dot-step { background: var(--accent-dim); border-color: var(--accent-dim); color: #eafffb; }
  .stepper .step.current .dot-step { border-color: var(--accent); color: var(--accent); background: var(--panel); }
  .stepper .step.current .label { color: var(--accent); }
  .stepper .label { font-weight: 600; font-size: 13px; }
  .stepper .time { font-size: 11px; color: var(--ink-dim); margin-top: 1px; }
</style>
</head>

  <button id="railIncidents" title="Incidents"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4l9 16H3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 17.2h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Incidents</span></button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/app.js"></script>
<script type="module">
import { GoldenLayout } from 'https://unpkg.com/golden-layout@2.6.0/dist/esm/index.js';

const { api, el, esc } = CCCS;
if (!CCCS.requireAuth(['DISPATCHER', 'SUPERVISOR', 'SYSTEM_ADMIN'])) throw new Error('auth');
const me = CCCS.getSession().user;

// A GoldenLayout popout window is this same page reloaded with
// ?gl-window=<id> — but GL takes that as licence to wipe document.body
// entirely and replace it with its own single-panel scaffolding, so none of
// this page's normal chrome (topbar, actionbar, icon rail) exists there.
// Every statement below that touches that chrome has to be skipped, or it
// throws against a null element and can stop other setup mid-script.
const isPopout = /[?&]gl-window=/.test(location.search);

if (!isPopout) {
  el('#whoName').textContent = me.display_name;
  el('#whoRole').textContent = me.role.replace('_', ' ');
  el('#avatar').textContent = me.display_name.split(/\s+/).map((s) => s[0]).slice(0, 2).join('').toUpperCase();
  el('#signout').onclick = () => { CCCS.clearSession(); location.href = '/index.html'; };
  setInterval(() => (el('#clock').textContent = CCCS.hhmmss()), 250);
  // keep welfare countdowns ticking without a server round trip
  setInterval(() => { if (state.radios.some((r) => r.welfare_due_at)) renderResources(); }, 1000);
}

const state = { radios: [], mdts: [], jobs: [], sites: [], requests: [], talkgroups: [], emergencies: [], events: [], selected: null, calls: new Map() };
let map; // assigned once the 'map' panel is mounted, below

/* ---------- rendering ---------- */
function welfareLeft(r) {
  if (!r.welfare_due_at) return '';
  const left = Math.round((Date.parse(r.welfare_due_at) - Date.now()) / 1000);
  if (left <= 0) return 'overdue';
  return `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
}

function pillClass(r) {
  if (r.emergency) return 'emg';
  if (r.status === 'AVAILABLE') return 'on';
  if (['OFFLINE', 'OUT_OF_SERVICE'].includes(r.status)) return 'off';
  return 'busy';
}

// A terminal (radio or MDT) working a job shows that job's cycle status,
// matching what's on its own screen — one status vocabulary end to end,
// not the terminal's own status label competing with the job's. Falls back
// to the terminal's own status once the job clears. ACKNOWLEDGED gets
// abbreviated; the pill is tight on width and "EN ROUTE"/"ON SCENE" already
// read fine at full length.
const jobStatusLabel = (s) => (s === 'ACKNOWLEDGED' ? 'ACK' : s.replace('_', ' '));
const jobStatusClass = (s) => ({ EN_ROUTE: 'busy', ON_SCENE: 'busy', TRANSPORTING: 'busy', DISPATCHED: 'busy', ACKNOWLEDGED: 'busy' }[s] || 'on');

function renderResources() {
  if (!el('#resList')) return;
  const reqByIssi = new Map(state.requests.filter((r) => r.state === 'PENDING').map((r) => [r.issi, r]));
  const rows = state.radios.map((r) => {
    const req = reqByIssi.get(r.issi);
    const job = state.jobs.find((j) => j.resources.some((x) => x.radio === r.issi) && !['COMPLETED', 'CANCELLED'].includes(j.status));
    const pillCls = job && !r.emergency ? jobStatusClass(job.status) : pillClass(r);
    const pillText = r.emergency ? 'EMERGENCY' : job ? jobStatusLabel(job.status) : r.status.replace('_', ' ');
    return `
    <div class="row ${state.selected === r.issi ? 'sel' : ''} ${r.emergency ? 'alarm' : ''}" data-issi="${r.issi}">
      <div class="card-top">
        <span class="cs">${esc(r.callsign || '—')}</span>
        <span class="status-pill ${pillCls}">${pillText}</span>
      </div>
      <div class="card-sub">
        <span class="mono">ISSI ${r.issi}${r.covert ? ' · covert' : ''}</span>
        <span>${esc(r.talkgroup || '—')}${r.welfare_due_at ? ' · welfare ' + welfareLeft(r) : ''}</span>
      </div>
      ${req ? `<div class="callback-tag" data-cbcall="${r.issi}">${req.priority ? 'Priority callback requested' : 'Callback requested'}</div>` : ''}
    </div>`;
  }).join('');
  const mdtPillClass = (m, job) => m.emergency ? 'emg' : !m.connected ? 'off' : job ? jobStatusClass(job.status) : m.duty_status === 'BUSY' ? 'busy' : m.duty_status === 'OUT_OF_SERVICE' ? 'off' : 'on';
  const mdtRows = state.mdts.map((m) => {
    const job = state.jobs.find((j) => j.resources.some((r) => r.mdt === m.mdt_code) && !['COMPLETED', 'CANCELLED'].includes(j.status));
    const label = m.emergency ? 'EMERGENCY' : !m.connected ? 'OFFLINE' : job ? jobStatusLabel(job.status) : (m.duty_status || 'AVAILABLE').replace('_', ' ');
    return `
    <div class="row ${m.emergency ? 'alarm' : ''}" data-mdt="${m.mdt_code}">
      <div class="card-top">
        <span class="cs">${esc(m.mdt_code)}</span>
        <span class="status-pill ${mdtPillClass(m, job)}">${label}</span>
      </div>
      <div class="card-sub"><span>${esc(m.callsign || 'unassigned')}</span><span>${m.crew && m.crew.length ? esc(m.crew.map((c) => c.name).join(', ')) : 'no crew'}</span></div>
    </div>`;
  }).join('');
  el('#resList').innerHTML = rows + `<div style="padding:10px 8px 4px" class="dim" >Mobile data terminals</div>` + mdtRows;
  if (el('#resCount')) el('#resCount').textContent = `${state.radios.filter((r) => r.connected).length}/${state.radios.length} on air`;
  CCCS.els('#resList .row[data-issi]').forEach((n) => n.addEventListener('click', () => select(n.dataset.issi)));
  CCCS.els('[data-cbcall]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); callRadio(b.dataset.cbcall); }));
}

const ASSIGN_ICON = '<svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="8.5" r="2.4" stroke="currentColor" stroke-width="1.6" opacity=".7"/><path d="M14.5 19c.3-2.4 2-4.2 4-4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></svg>';

function renderJobs() {
  if (!el('#jobList')) return;
  const showClosed = el('#fltClosed') && el('#fltClosed').checked;
  const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
  const open = state.jobs.filter((j) => !['COMPLETED', 'CANCELLED'].includes(j.status)
    || (showClosed && Date.parse(j.updated_at) > dayAgo));
  el('#jobList').innerHTML = open.length ? open.map((j) => `
    <div class="row ${['COMPLETED', 'CANCELLED'].includes(j.status) ? 'closed' : ''}" data-job="${j.id}">
      <div class="card-top">
        <span class="cs">${esc(j.reference)}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="pri pri-${j.priority}">${j.priority}</span>
          <button class="assign-ic" data-assignjob="${j.id}" title="Assign call signs">${ASSIGN_ICON}</button>
        </span>
      </div>
      <div class="card-sub">
        <span>${esc(j.status.replace('_', ' '))}</span>
        <span>${esc(j.resources.map((r) => r.callsign || r.radio || r.mdt).join(', ') || 'unassigned')}</span>
      </div>
    </div>`).join('') : '<p class="dim">No open jobs. Create one to start a dispatch.</p>';
  CCCS.els('#jobList .row').forEach((n) => n.addEventListener('click', () => jobModal(state.jobs.find((j) => j.id === Number(n.dataset.job)))));
  CCCS.els('[data-assignjob]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    assignModal(state.jobs.find((j) => j.id === Number(b.dataset.assignjob)));
  }));
  updateCallbackBadge();
}

/** Tap a call sign to dispatch every radio and MDT on it — mirrors how a
 * real dispatch console assigns by call sign rather than by individual
 * device, since a car's radio and its MDT should move together. */
async function assignModal(job) {
  if (!job) return;
  const callsigns = await api('GET', '/api/callsigns');
  const buttonsHtml = () => callsigns.map((c) => {
    const n = c.radios.length + c.mdts.length;
    const already = job.resources.some((r) => r.callsign === c.name);
    return `<button class="btn ${already ? 'ok' : 'primary'}" data-cs="${esc(c.name)}" ${already || !n ? 'disabled' : ''}>${esc(c.name)} ${already ? '— assigned' : `(${n})`}</button>`;
  }).join('') || '<p class="dim">No call signs configured.</p>';

  function paint() {
    el('#csButtons').innerHTML = buttonsHtml();
    CCCS.els('[data-cs]').forEach((b) => (b.onclick = async () => {
      try { job = await api('POST', `/api/jobs/${job.id}/assign`, { resources: [b.dataset.cs] }); paint(); }
      catch (e) { alert(e.message); }
    }));
  }

  modal(`Assign — ${job.reference}`, `
    <p class="dim" style="margin:0 0 12px">Tap a call sign to dispatch every radio and MDT on it to ${esc(job.reference)}.</p>

let audioCtx;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.05;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    o.stop(audioCtx.currentTime + 0.18);
  } catch {}
}

/* "12m" / "1h 04m" — good enough for a status timeline, no need for a
 * date library over two units. */
function fmtElapsed(fromIso, toIso) {
  const ms = (toIso ? Date.parse(toIso) : Date.now()) - Date.parse(fromIso);
  if (!(ms >= 0)) return '—';
  const mins = Math.floor(ms / 60000);
  return mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, '0')}m`;
}

const JOB_STAGES = [
  ['DISPATCHED', 'Dispatched'], ['ACKNOWLEDGED', 'Acknowledged'], ['EN_ROUTE', 'En route'],
  ['ON_SCENE', 'On scene'], ['TRANSPORTING', 'Transporting'], ['COMPLETED', 'Completed'],
];
function jobModal(j) {
  if (!j) return;
  const stageAt = { DISPATCHED: j.dispatched_at, ACKNOWLEDGED: j.acknowledged_at, EN_ROUTE: j.en_route_at, ON_SCENE: j.on_scene_at, TRANSPORTING: j.transporting_at, COMPLETED: j.completed_at };
  let lastDoneIdx = -1;
  JOB_STAGES.forEach(([code], i) => { if (stageAt[code]) lastDoneIdx = i; });
  const active = !['COMPLETED', 'CANCELLED'].includes(j.status);
  const stepper = JOB_STAGES.map(([code, label], i) => {
    const at = stageAt[code];
    const isCurrent = at && i === lastDoneIdx && active;
    return `<div class="step ${at ? (isCurrent ? 'current' : 'done') : ''}">
      <div class="dot-step">${at && !isCurrent ? '✓' : i + 1}</div>
      <div><div class="label">${label}</div><div class="time${at ? '' : ' dim'}">${at ? new Date(at).toLocaleTimeString() : 'waiting'}</div></div>
    </div>`;
  }).join('');
  modal(`Job ${j.reference}`, `
    <div class="job-head">
      <div>
        <div class="titles">
          <span class="pri pri-${j.priority}">${j.priority}</span>
          <h3>${esc(j.incident_type)}</h3>
        </div>
        <div class="dim" style="margin-top:5px">${esc(j.reference)} · ${esc(j.location)}</div>
      </div>
      ${active ? `<div class="elapsed"><div class="big" id="jElapsedBig">${fmtElapsed(j.created_at)}</div><div class="lbl">since created</div></div>`
        : `<span class="status-pill ${j.status === 'CANCELLED' ? 'off' : 'on'}">${esc(j.status)}</span>`}
    </div>
    ${j.status === 'CANCELLED' ? '' : `<div class="stepper">${stepper}</div>`}

    <div class="btn-row" style="margin:16px 0 8px"><span style="flex:1"></span><button class="btn" id="jEditToggle">Edit details</button></div>
    <dl class="kv" id="jDetailsView">
      ${j.what3words ? `<dt>What3Words</dt><dd class="mono">///${esc(j.what3words)}</dd>` : ''}
      <dt>Caller</dt><dd>${esc(j.caller || '—')}</dd>
      <dt>Detail</dt><dd>${esc(j.description || '—')}</dd>
      <dt>Resources</dt><dd>${j.resources.length ? j.resources.map((r) => `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <span style="flex:1">${esc(r.callsign || r.radio || r.mdt)}${r.acknowledged ? ' ✓' : ''}</span>
          <button class="btn danger" style="padding:0 6px;font-size:11px" data-standdown="${esc(r.radio ? 'r:' + r.radio : 'm:' + r.mdt)}">Stand down</button>
        </div>`).join('') : '—'}</dd>
    </dl>
    <div id="jDetailsEdit" class="hide">
      <label for="jType">Incident type</label>
      <input id="jType" value="${esc(j.incident_type)}">
      <label for="jLoc">Location</label>
      <input id="jLoc" value="${esc(j.location)}">
      <label for="jW3w">What3Words</label>
      <input id="jW3w" value="${esc(j.what3words || '')}" placeholder="///word.word.word">
      <label for="jCaller">Caller</label>
      <input id="jCaller" value="${esc(j.caller || '')}">
      <label for="jDesc">Detail</label>
      <textarea id="jDesc" rows="3" style="width:100%;resize:vertical">${esc(j.description || '')}</textarea>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn primary" id="jSaveDetails">Save details</button>
        <button class="btn" id="jCancelEdit">Cancel</button>
      </div>
    </div>
    <label for="jNotes">Notes — visible to every assigned call sign</label>
    <textarea id="jNotes" rows="3" style="width:100%;resize:vertical">${esc(j.notes || '')}</textarea>
    <div class="btn-row" style="margin-top:6px"><button class="btn" id="jSaveNotes">Save notes</button></div>

    <label for="jAdd" style="margin-top:12px;display:block">Assign more resources</label>
    <select id="jAdd" multiple size="4">${state.radios.map((r) => `<option value="${r.callsign || r.issi}">${esc(r.callsign || r.issi)}</option>`).join('')}${state.mdts.map((m) => `<option value="${m.mdt_code}">${esc(m.mdt_code)}</option>`).join('')}</select>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn primary" id="jAssign">Dispatch</button>
      <button class="btn ok" id="jDone">Mark completed</button>
      <button class="btn danger" id="jCancel">Cancel job</button>
    </div>`, () => {
    el('#jAssign').onclick = async () => {
      const picks = [...el('#jAdd').selectedOptions].map((o) => o.value);
      if (picks.length) await api('POST', `/api/jobs/${j.id}/assign`, { resources: picks });
      closeModal();
    };
    el('#jDone').onclick = async () => { await api('PATCH', `/api/jobs/${j.id}`, { status: 'COMPLETED' }); closeModal(); };
    el('#jCancel').onclick = async () => { await api('PATCH', `/api/jobs/${j.id}`, { status: 'CANCELLED' }); closeModal(); };
    el('#jSaveNotes').onclick = async () => { await api('PATCH', `/api/jobs/${j.id}`, { notes: el('#jNotes').value }); closeModal(); };
    el('#jEditToggle').onclick = () => {
      el('#jDetailsView').classList.add('hide');
      el('#jEditToggle').classList.add('hide');
      el('#jDetailsEdit').classList.remove('hide');
    };
    el('#jCancelEdit').onclick = () => { closeModal(); jobModal(j); };
    el('#jSaveDetails').onclick = async () => {
      await api('PATCH', `/api/jobs/${j.id}`, {
        incident_type: el('#jType').value, location: el('#jLoc').value,
        what3words: el('#jW3w').value, caller: el('#jCaller').value, description: el('#jDesc').value,
      });
      closeModal();
    };
    CCCS.els('[data-standdown]').forEach((b) => (b.onclick = async () => {
      const [kind, id] = b.dataset.standdown.split(':');
      if (!confirm(`Stand down ${id} from this job?`)) return;
      await api('POST', `/api/jobs/${j.id}/stand-down`, kind === 'r' ? { radio: id } : { mdt: id });
      closeModal();
    }));
    if (el('#jElapsedBig')) {
      const tick = setInterval(() => { const n = el('#jElapsedBig'); if (!n) return clearInterval(tick); n.textContent = fmtElapsed(j.created_at); }, 30000);
    }
  });
}

      await api('DELETE', `/api/talkgroups/${id}/members`, { radio: issi });
      el('#btnTalkgroups').click();
    }));
    CCCS.els('[data-addbtn]').forEach((b) => (b.onclick = async () => {
      const sel = document.querySelector(`[data-add="${b.dataset.addbtn}"]`);
      await api('POST', `/api/talkgroups/${b.dataset.addbtn}/members`, { radio: sel.value });
      el('#btnTalkgroups').click();
    }));
    el('#tgNew').onclick = async () => { await api('POST', '/api/talkgroups', { name: el('#tgName').value }); el('#btnTalkgroups').click(); };
  });
};
}

if (!isPopout) {
el('#btnAssign').onclick = async () => {
  const cs = await api('GET', '/api/callsigns');
  modal('Call sign assignments', cs.map((c) => `
    <div style="margin-bottom:12px">
      <strong class="mono">${esc(c.name)}</strong> <span class="dim">${esc(c.description || '')}</span>
      <div class="log">
        ${c.radios.map((r) => `<div>radio ${r.issi} <button class="btn" style="padding:0 6px;font-size:11px" data-unr="${c.id}:${r.issi}">remove</button></div>`).join('')}
        ${c.mdts.map((m) => `<div>${esc(m.mdt_code)} <button class="btn" style="padding:0 6px;font-size:11px" data-unm="${c.id}:${m.mdt_code}">remove</button></div>`).join('')}
        ${c.personnel.map((p) => `<div class="dim">${esc(p)}</div>`).join('')}
      </div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <select data-pick="${c.id}" style="flex:1">
          ${state.radios.map((r) => `<option value="r:${r.issi}">radio ${r.issi}</option>`).join('')}
          ${state.mdts.map((m) => `<option value="m:${m.mdt_code}">${esc(m.mdt_code)}</option>`).join('')}
        </select>
        <button class="btn" data-assign="${c.id}">Assign</button>
      </div>
    </div>`).join(''), () => {
    CCCS.els('[data-assign]').forEach((b) => (b.onclick = async () => {
      const v = document.querySelector(`[data-pick="${b.dataset.assign}"]`).value;
      const [kind, id] = v.split(':');
      await api('POST', `/api/callsigns/${b.dataset.assign}/assign`, { [kind === 'r' ? 'radio' : 'mdt']: id });
      el('#btnAssign').click();
    }));
    CCCS.els('[data-unr]').forEach((b) => (b.onclick = async () => {
      const [id, issi] = b.dataset.unr.split(':');
      await api('DELETE', `/api/callsigns/${id}/assign`, { radio: issi });
      el('#btnAssign').click();
    }));
    CCCS.els('[data-unm]').forEach((b) => (b.onclick = async () => {
      const [id, code] = b.dataset.unm.split(':');
      await api('DELETE', `/api/callsigns/${id}/assign`, { mdt: code });
      el('#btnAssign').click();
    }));
  });
};
}

/* ---------- PTT from the console ---------- */
let txTg = null;
function pttDown() {
  const id = Number(el('#pttTg').value);
  if (!id || txTg) return;
  txTg = id; bus.send('radio.ptt_start', { talkgroup_id: id });
  el('#btnPtt').classList.add('danger'); el('#btnPtt').textContent = 'Transmitting';
}
function pttUp() {
  if (!txTg) return;
  audio.stopPublishing();
  bus.send('radio.ptt_release', { talkgroup_id: txTg });
  txTg = null;
  el('#btnPtt').classList.remove('danger'); el('#btnPtt').textContent = 'Hold to transmit';
}
if (!isPopout) {
  el('#btnPtt').addEventListener('mousedown', pttDown);
  el('#btnPtt').addEventListener('touchstart', (e) => { e.preventDefault(); pttDown(); });
  window.addEventListener('mouseup', pttUp);
  window.addEventListener('touchend', pttUp);
}

/* ------------------------------------------------------------------ *
 * GoldenLayout shell — drag tabs to rearrange, drag borders to resize,
 * close one and its neighbours reflow, each tab's own maximise button
 * fills the screen. Panels are plain DOM built the same way they always
 * were; only how they're mounted changes.
 * ------------------------------------------------------------------ */
const glRoot = document.getElementById('glRoot');
// A popout window wipes document.body down to nothing before building its
// single-panel layout (see the isPopout comment above) — but our glRoot div
// was a child of that body, so by the time GL rebuilds, glRoot has been
// detached from the document. Passing it as GL's container here would make
// GL build the whole popout layout inside that now-invisible orphaned node
// (GL only falls back to document.body when no container is given at all),
// which is why a popout used to render nothing after its brief flash of the
// full dashboard. In the popout, let GL manage body itself.
const layout = isPopout ? new GoldenLayout() : new GoldenLayout(glRoot);

function mount(container, toolbarHtml, bodyHtml) {
  container.element.style.cssText = 'display:flex;flex-direction:column;height:100%;overflow:hidden';
  container.element.innerHTML = (toolbarHtml ? `<div class="pcount">${toolbarHtml}</div>` : '') + bodyHtml;
}

layout.registerComponentFactoryFunction('jobs', (container) => {
  mount(container,
    '<button class="btn" id="jobFilters" style="padding:2px 8px;font-size:11px">Filters</button>' +
    '<button class="btn" id="newJob" style="padding:2px 8px;font-size:11px">Create job</button>',
    '<div class="filters-drop hide" id="jobFiltersDrop"><label><input type="checkbox" id="fltClosed"> Include recently closed (last 24h)</label></div>' +
    '<div class="body" id="jobList" style="flex:1;overflow:auto"></div>');
  // GoldenLayout builds new panels in a detached tree before attaching the
  // whole layout, so document-wide queries (plain el()) can't find elements
  // we just created — scope to container.element, which works either way.
  const $ = (sel) => el(sel, container.element);
  $('#jobFilters').onclick = () => $('#jobFiltersDrop').classList.toggle('hide');
  $('#fltClosed').onchange = renderJobs;
  $('#newJob').onclick = openNewJobModal;
  renderJobs();
});

layout.registerComponentFactoryFunction('map', (container) => {
  mount(container, '<button class="btn" id="mapRecenter" style="padding:2px 8px;font-size:11px">Recenter</button>',
    '<div class="map" id="map" style="flex:1"></div>');
  const $ = (sel) => el(sel, container.element);
  map = CCCS.makeMap($('#map'));
  $('#mapRecenter').onclick = () => { const { units, jobs } = mapData(); map.fitToData(units, jobs); };
  container.on('resize', () => map && map.invalidateSize());
  renderMap();
});

layout.registerComponentFactoryFunction('resources', (container) => {
  mount(container, '<span class="spacer" style="flex:1"></span><span class="dim" id="resCount"></span>',
    '<div class="body" id="resList" style="flex:1;overflow:auto"></div>');
  renderResources();
});

layout.registerComponentFactoryFunction('detail', (container) => {
  mount(container, null, '<div class="body" id="detailBody" style="flex:1;overflow:auto"><p class="dim">Select a resource to see its identity, status and location.</p></div>');
  renderDetail();
});

const PANEL_TITLES = { jobs: 'Active Jobs', map: 'Operational Map', resources: 'Resources', detail: 'Resource Detail' };

const defaultLayoutConfig = {
  // Popout really is useful here — genuinely separate windows for a
  // multi-monitor control room, one browser window per screen. If the
  // browser ever blocks the popup, blockedPopoutsThrowError below makes
  // that fail quietly instead of losing the panel. The redundant stack-level
  // close button (each tab already has its own) is hidden with CSS instead
  // of header.close — that config flag turned out to disable more than the
  // icon (drag-to-reorder and close went with it), so leave GL's own
  // defaults alone and just hide the extra icon.
  settings: { blockedPopoutsThrowError: false },
  root: {
    type: 'column',
    content: [
      {
        type: 'row', height: 72,
        content: [
          { type: 'component', componentType: 'jobs', title: PANEL_TITLES.jobs, width: 22 },
          { type: 'component', componentType: 'map', title: PANEL_TITLES.map, width: 56 },
          { type: 'component', componentType: 'resources', title: PANEL_TITLES.resources, width: 22 },
        ],
      },
      {
        type: 'row', height: 28,
        content: [
          { type: 'component', componentType: 'detail', title: PANEL_TITLES.detail, width: 100 },
        ],
      },
    ],
  },
};

// Bump this whenever defaultLayoutConfig's shape or settings change —
// otherwise a browser with an old save never sees the update, since a saved
// layout always wins over the default. This is what silently carried an
// earlier broken config (header.close disabling drag/close) forward even
// after the code was fixed.
const LAYOUT_VERSION = 3;

// (isPopout is declared near the top of the script.) The component
// factories above must still be registered so GL can rebuild whichever one
// component this popout is for, but GL manages its own config for that
// window (it wrote the config to localStorage keyed by <id> before opening
// it) and expects to take over on its own; force-loading the full 5-panel
// default into it as well only fights that and is the other half of
// "popout is blank".
function loadSavedOrDefault() {
  let cfg = defaultLayoutConfig;
  try {
    const saved = JSON.parse(localStorage.getItem('cccs.layout') || 'null');
    if (saved && saved.__v === LAYOUT_VERSION) cfg = saved.config;
  } catch {}
  try { layout.loadLayout(cfg); }
  catch (e) { console.warn('[cccs] saved layout would not load, using default:', e.message); layout.loadLayout(defaultLayoutConfig); }
}

function saveLayoutState() {
  try { localStorage.setItem('cccs.layout', JSON.stringify({ __v: LAYOUT_VERSION, config: layout.saveLayout() })); } catch {}
}

if (!isPopout) {
  loadSavedOrDefault();
  layout.on('stateChanged', saveLayoutState);
}
window.addEventListener('resize', () => layout.updateRootSize());

if (!isPopout) {
el('#resetLayout').onclick = () => {
  if (!confirm('Restore the default panel arrangement? Any custom sizing or rearranging you’ve done will be lost.')) return;
  localStorage.removeItem('cccs.layout');
  location.reload();
};

el('#btnNotify').onclick = () => {
  modal('Notifications', `
    <p class="dim">Get an alert on this device for emergencies and welfare alarms even when this tab is in the background. On iPhone this only works after adding this page to your Home Screen (Share → Add to Home Screen) — a plain Safari tab can't receive it while backgrounded.</p>
    <div class="btn-row">
      <button class="btn primary" id="pushEnable">Enable notifications</button>
      <button class="btn" id="pushDisable" hidden>Turn off</button>
    </div>
    <p class="dim" id="pushStatus" style="font-size:12px"></p>`, async () => {
    async function paint() {
      const s = await CCCS.push.status();
      const enableBtn = el('#pushEnable'), disableBtn = el('#pushDisable'), status = el('#pushStatus');
      if (s === 'unsupported') { status.textContent = 'Not supported in this browser.'; enableBtn.hidden = true; disableBtn.hidden = true; return; }
      if (s === 'denied') { status.textContent = 'Blocked — allow notifications for this site in your phone/browser settings.'; enableBtn.hidden = true; disableBtn.hidden = true; return; }
      enableBtn.hidden = s === 'subscribed';
      disableBtn.hidden = s !== 'subscribed';
      status.textContent = s === 'subscribed' ? 'Notifications are on.' : '';
    }
    paint();
    el('#pushEnable').onclick = async () => {
      try { await CCCS.push.enable(); } catch (e) { el('#pushStatus').textContent = e.message; }
      paint();
    };
    el('#pushDisable').onclick = async () => { await CCCS.push.disable(); paint(); };
  });
};
}

/* ---------- quick-nav icon rail: brings a closed panel back. If it's
 * already open this adds a second copy rather than focusing the existing
 * one — an acceptable trade for not tracking GL's internal tree by hand;
 * closing the extra copy costs one click. ---------- */
function openPanel(type) {
  layout.newComponent(type, undefined, PANEL_TITLES[type]);
  saveLayoutState();
}
function focusPanel(sel) {
  const node = el(sel);
  if (!node) return;
  node.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  node.classList.add('flash');
  setTimeout(() => node.classList.remove('flash'), 900);
}
if (!isPopout) {
el('#railIncidents').onclick = () => openPanel('jobs');
el('#railTerminals').onclick = () => openPanel('resources');
el('#railMessages').onclick = () => el('#btnMessage').click();
el('#railCallbacks').onclick = () => focusPanel('#reqWrap');
el('#railMap').onclick = () => openPanel('map');
el('#railTalkgroups').onclick = () => el('#btnTalkgroups').click();
el('#railAssignments').onclick = () => el('#btnAssign').click();
}

/* ---------- realtime ---------- */
let bus;
bus = CCCS.bus((up) => {
  const n = el('#net');
  if (n) { n.textContent = up ? 'link up' : 'link down'; n.classList.toggle('up', up); }
  if (up) boot();
});

const upsert = (list, item, key = 'id') => {
  const i = list.findIndex((x) => x[key] === item[key]);
  if (i >= 0) list[i] = item; else list.push(item);
};

const audio = CCCS.audio(bus);
window.__cccsAudio = audio; // devtools: await window.__cccsAudio.debugStats()
audio.onPeerAudio = (addr, state) => {
  const b = el('#audioBlocked');
  if (!b) return;
  if (state === 'blocked') b.hidden = false;
  else if (state === true) b.hidden = true;
};
if (el('#audioBlocked')) el('#audioBlocked').onclick = () => { if (audio.resumeAudio()) el('#audioBlocked').hidden = true; };
bus.on('ptt.granted', ({ listeners }) => audio.publishTo(listeners).catch((e) => console.warn('mic', e)))
   .on('call.accepted', (c) => { const other = (c.participants || []).find((p) => p.issi); if (c.kind !== 'PSTN' && other) audio.call(`radio:${other.issi}`).catch(() => {}); })
   .on('call.ended', () => audio.hangUp())
   .on('radio.status_changed', (r) => { upsert(state.radios, r); renderResources(); renderDetail(); renderMap(); })
   .on('radio.connected', (r) => { upsert(state.radios, r); renderResources(); })
   .on('radio.created', (r) => { upsert(state.radios, r); renderResources(); })
   .on('radio.assigned', (r) => { upsert(state.radios, r); renderResources(); renderDetail(); })
   .on('radio.location_changed', (r) => { upsert(state.radios, r); renderMap(); if (state.selected === r.issi) renderDetail(); })
   .on('mdt.status_changed', (m) => { upsert(state.mdts, m); renderResources(); })
   .on('mdt.assigned', (m) => { upsert(state.mdts, m); renderResources(); })
   .on('mdt.crew_changed', (m) => { upsert(state.mdts, m); renderResources(); })
   .on('job.created', (j) => { upsert(state.jobs, j); renderJobs(); renderMap(); })
   .on('job.dispatched', (j) => { upsert(state.jobs, j); renderJobs(); renderResources(); })
   .on('job.status_changed', (j) => { upsert(state.jobs, j); renderJobs(); renderMap(); renderResources(); })
   .on('job.acknowledged', ({ job }) => { upsert(state.jobs, job); renderJobs(); renderResources(); })
   .on('emergency.activated', (e) => { upsert(state.emergencies, e); renderEmergencies(); renderResources(); })
   .on('radio.covert_changed', (r) => { upsert(state.radios, r); renderResources(); renderDetail(); })
   .on('radio.position_report', (r) => { upsert(state.radios, r); renderMap(); renderDetail(); })
   .on('call.request', (r) => { upsert(state.requests, r); renderRequests(); renderResources(); })
   .on('call.request_cleared', (r) => { upsert(state.requests, r); renderRequests(); renderResources(); })
   .on('welfare.started', ({ radio }) => { upsert(state.radios, radio); renderResources(); renderDetail(); })
   .on('welfare.checked_in', (r) => { upsert(state.radios, r); renderResources(); renderDetail(); })
   .on('welfare.stopped', (r) => { upsert(state.radios, r); renderResources(); renderDetail(); })
   .on('emergency.acknowledged', (e) => { upsert(state.emergencies, e); renderEmergencies(); })
   .on('emergency.resolved', (e) => { upsert(state.emergencies, e); renderEmergencies(); })
   .on('event.logged', (e) => { state.events.push(e); if (state.events.length > 400) state.events.shift(); renderLog(); })
   .on('radio.ptt_started', (p) => { const f = el('#floor'); if (f) f.textContent = `TX ${p.callsign} · ${p.talkgroup}`; })
   .on('radio.ptt_released', (p) => { const f = el('#floor'); if (f) f.textContent = ''; })
   .on('ptt.denied', (p) => { const f = el('#floor'); if (f) f.textContent = `${p.reason} — ${p.holder} has the floor`; txTg = null; const b = el('#btnPtt'); if (b) { b.classList.remove('danger'); b.textContent = 'Hold to transmit'; } })
   .on('call.accepted', (c) => { const n = el('#callState'); if (n && state.calls.has(c.id)) n.textContent = 'ACTIVE — connected'; if (state.calls.has(c.id)) { state.calls.set(c.id, c); paintCallBar(); } })
   .on('call.rejected', (c) => { const n = el('#callState'); if (n && state.calls.has(c.id)) n.textContent = `DECLINED by ${c.rejected_by}`; if (state.calls.has(c.id)) { state.calls.set(c.id, c); paintCallBar(); } })
   .on('call.ended', (c) => { const n = el('#callState'); if (n && state.calls.has(c.id)) n.textContent = `ENDED (${c.end_reason}) after ${c.duration_s}s`; if (state.calls.has(c.id)) { state.calls.set(c.id, c); paintCallBar(); } })
   .on('message.received', () => {});

async function boot() {
  const s = await api('GET', '/api/state');
  state.radios = s.radios; state.mdts = s.mdts; state.jobs = s.jobs;
  state.talkgroups = s.talkgroups; state.emergencies = s.emergencies; state.events = s.events;
  state.sites = s.sites || [];
  state.requests = s.call_requests || [];
  if (el('#pttTg')) el('#pttTg').innerHTML = s.talkgroups.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  renderResources(); renderJobs(); renderMap(); renderEmergencies(); renderRequests(); renderLog();
}
boot();
</script>
</body>
</html>
