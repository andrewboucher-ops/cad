<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — set your password</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<style>
  :root { --violet: #7c6ce8; --violet-dim: #5b4bc4; }
  body { background: #0b0a14; }
  .sp-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; box-sizing: border-box; }
  .sp-card { width: 100%; max-width: 380px; }
  .sp-card img { height: 28px; display: block; margin-bottom: 28px; }
  .sp-card .eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--violet); text-transform: uppercase; }
  .sp-card h2 { margin: 6px 0 10px; font-size: 24px; font-weight: 800; color: #fff; }
  .sp-card p.lead { margin: 0 0 24px; font-size: 13.5px; color: #a29cc2; line-height: 1.5; }
  .sp-card label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a83a8; margin: 16px 0 6px; }
  .sp-card label:first-of-type { margin-top: 0; }
  .sp-card input {
    width: 100%; box-sizing: border-box; background: #17142a; border: 1px solid #2c2649; border-radius: 8px;
    color: #fff; padding: 11px 12px; font-size: 14px; font-family: var(--font);
  }
  .sp-card input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,108,232,.25); }
  .sp-btn {
    width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(180deg, var(--violet), var(--violet-dim)); color: #fff; font-weight: 700; font-size: 14.5px;
    font-family: var(--font); box-shadow: 0 8px 20px -8px rgba(124,108,232,.6);
  }
  .sp-btn:disabled { opacity: .6; cursor: default; }
  .sp-err { color: #f87171; font-size: 12.5px; min-height: 16px; margin: 10px 0 0; }
  .sp-ok { color: #4ade80; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div class="sp-page">
  <div class="sp-card">
    <img src="/assets/echelon-wordmark.png" alt="Echelon">
    <div id="spForm">
      <span class="eyebrow">Client portal</span>
      <h2>Set your password</h2>
      <p class="lead">Choose a password for your Echelon client portal account. It needs to be at least 8 characters.</p>
      <label for="p1">New password</label>
      <input id="p1" type="password" autocomplete="new-password">
      <label for="p2">Confirm password</label>
      <input id="p2" type="password" autocomplete="new-password">
      <button class="sp-btn" id="go">Set password</button>
      <p class="sp-err" id="err"></p>
    </div>
    <div id="spDone" hidden>
      <p class="sp-ok">Your password is set. <a href="/index.html" style="color:#fff">Sign in</a> to open your portal.</p>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script>
const { el, api } = CCCS;
const token = new URLSearchParams(location.search).get('token');
if (!token) { el('#spForm').innerHTML = '<p class="sp-err" style="min-height:0">This link is missing its token — check you copied the whole link from the email.</p>'; }
async function submit() {
  el('#err').textContent = '';
  if (el('#p1').value.length < 8) { el('#err').textContent = 'Password must be at least 8 characters.'; return; }
  if (el('#p1').value !== el('#p2').value) { el('#err').textContent = 'Passwords do not match.'; return; }
  el('#go').disabled = true;
  try {
    await api('POST', '/api/auth/set-password', { token, password: el('#p1').value });
    el('#spForm').hidden = true;
    el('#spDone').hidden = false;
  } catch (e) {
    el('#err').textContent = e.message;
    el('#go').disabled = false;
  }
}
el('#go').addEventListener('click', submit);
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
