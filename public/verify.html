<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>ID check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Stand-alone (no login, no app chrome): this is what a member of the
   * public, a client or the police see after scanning someone's ID card. */
  :root { --ink: #0f172a; --dim: #64748b; --line: #e2e8f0; --bg: #f1f5f9; --card: #fff; --ok: #15803d; --okbg: #dcfce7; --bad: #b91c1c; --badbg: #fee2e2; --warn: #a16207; --warnbg: #fef9c3; --navy: #0b1f3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { width: min(480px, 100%); margin: 0 auto; padding: 16px; }
  .brand { display: flex; align-items: center; justify-content: center; padding: 10px 0 16px; }
  .brand img { height: 38px; }
  .card { background: var(--card); border-radius: 18px; box-shadow: 0 2px 12px rgba(15,23,42,.08); overflow: hidden; }
  .status { padding: 18px 16px; text-align: center; font-weight: 800; font-size: 20px; letter-spacing: .02em; }
  .status small { display: block; font-weight: 500; font-size: 13px; margin-top: 4px; letter-spacing: 0; }
  .status.ok { background: var(--ok); color: #fff; } .status.bad { background: var(--bad); color: #fff; } .status.warn { background: var(--warn); color: #fff; }
  .who { display: flex; gap: 16px; align-items: center; padding: 18px 16px; border-bottom: 1px solid var(--line); }
  .photo { width: 112px; height: 140px; border-radius: 10px; object-fit: cover; background: #e2e8f0; flex: none; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; text-align: center; }
  .name { font-size: 22px; font-weight: 800; line-height: 1.15; }
  .meta { color: var(--dim); font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .k { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); width: 64px; flex: none; padding-top: 3px; }
  .row .v { flex: 1; font-size: 15px; }
  .lic { margin-bottom: 8px; } .lic:last-child { margin-bottom: 0; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; margin-left: 4px; }
  .pill.ok { background: var(--okbg); color: var(--ok); } .pill.bad { background: var(--badbg); color: var(--bad); } .pill.warn { background: var(--warnbg); color: var(--warn); }
  .sub { color: var(--dim); font-size: 13px; }
  .foot { text-align: center; color: var(--dim); font-size: 12.5px; padding: 14px 8px; line-height: 1.5; }
  .err { padding: 30px 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/assets/echelon-wordmark-navy.jpg" alt=""></div>
  <div class="card" id="card"><div class="err sub">Checking…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
'use strict';
// The code is in the #fragment so it is never sent in a Referer header or
// kept in a web server's request log for the page itself.
const token = location.hash.slice(1);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const day = (d) => new Date(String(d).length === 10 ? `${d}T12:00:00Z` : d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
(async () => {
  let r;
  try {
    const res = await fetch(`/api/public/verify/${encodeURIComponent(token)}`, { cache: 'no-store' });
    r = await res.json();
  } catch { r = { valid: false, error: 'Could not check this card — check your internet connection and scan again.' }; }
  const company = (r && r.company) || {};
  if (!token || !r.valid) {
    document.getElementById('card').innerHTML = `<div class="status bad">NOT VALID<small>${esc(r.error || 'This ID card is not recognised.')}</small></div>
      <div class="err">Do not accept this card as proof of identity.${company.phone ? ` Call ${esc(company.name)} on <a href="tel:${esc(company.phone)}">${esc(company.phone)}</a>.` : ''}</div>`;
    return;
  }
  const status = !r.employed ? ['bad', 'NOT CURRENTLY EMPLOYED', `by ${esc(company.name)} — do not accept this card`]
    : r.employment_status === 'LEAVE' ? ['warn', 'EMPLOYED — ON LEAVE', `by ${esc(company.name)}`]
    : ['ok', 'CURRENTLY EMPLOYED', `by ${esc(company.name)}`];
  const sia = r.sia.length ? r.sia.map((l) => {
    const pill = l.expired ? '<span class="pill bad">Expired</span>' : l.verified ? '<span class="pill ok">Verified</span>' : '<span class="pill warn">Not verified</span>';
    return `<div class="lic"><strong>${esc(l.type)}</strong> ${pill}<div class="sub">${l.expiry ? `${l.expired ? 'Expired' : 'Valid until'} ${day(l.expiry)}` : 'No expiry recorded'}${l.verified && !l.expired ? ` · checked on the SIA register ${day(l.verified_at)}` : ''}</div></div>`;
  }).join('') : '<span class="pill bad">None held</span>';
  const dbs = r.dbs.verified
    ? `<span class="pill ${r.dbs.recheck_due ? 'warn' : 'ok'}">${r.dbs.recheck_due ? 'Recheck due' : 'Verified'}</span><div class="sub">${r.dbs.level ? `${r.dbs.level === 'ENHANCED' ? 'Enhanced' : 'Standard'} DBS · ` : ''}last checked ${day(r.dbs.checked_at)}</div>`
    : '<span class="pill bad">Not verified</span>';
  document.getElementById('card').innerHTML = `
    <div class="status ${status[0]}">${status[1]}<small>${status[2]}</small></div>
    <div class="who">${r.photo_url ? `<img class="photo" src="${esc(r.photo_url)}" alt="ID photo">` : '<div class="photo">No photo on file</div>'}
      <div><div class="name">${esc(r.name)}</div><div class="meta">${r.role ? `${esc(r.role)}<br>` : ''}${r.employee_no ? `Staff no. ${esc(r.employee_no)}` : ''}</div></div></div>
    <div class="row"><div class="k">SIA</div><div class="v">${sia}</div></div>
    <div class="row"><div class="k">DBS</div><div class="v">${dbs}</div></div>`;
  document.getElementById('foot').innerHTML = `Checked ${new Date(r.checked_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}. Make sure the photo matches the person in front of you.${company.phone ? `<br>Questions? Call ${esc(company.name)} on <a href="tel:${esc(company.phone)}">${esc(company.phone)}</a>.` : ''}`;
})();
</script>
</body>
</html>
