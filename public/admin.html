<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — admin</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCCS Admin">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<style>
  body { display: flex; height: 100vh; overflow: hidden; padding-left: 228px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .page-body { flex: 1; overflow: auto; padding: 24px 28px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .page-head h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { width: auto; min-width: 200px; }
  table.log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.log-table th {
    text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim);
    font-weight: 700; padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg);
  }
  table.log-table td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  table.log-table tr:hover td { background: var(--panel-2); }
  table.log-table tr.clickable { cursor: pointer; }
  .empty-note { color: var(--ink-dim); padding: 30px; text-align: center; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tabs button {
    background: none; border: none; color: var(--ink-dim); padding: 10px 4px; margin-right: 22px;
    font-family: var(--font); font-size: 13.5px; font-weight: 600; cursor: pointer; position: relative;
  }
  .tabs button.active { color: var(--ink); }
  .tabs button.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
  .role-pill {
    font-family: var(--mono); font-weight: 600; font-size: 10.5px; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 20px; border: 1px solid var(--line); color: var(--ink-dim);
  }
  .role-pill.admin { color: #f87171; border-color: rgba(248,113,113,.4); }
  .role-pill.control { color: var(--accent); border-color: rgba(20,184,166,.4); }
  form.stack { display: flex; flex-direction: column; gap: 12px; }
  form.stack label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: -6px; }
  .foot-split { display: flex; justify-content: space-between; align-items: center; width: 100%; }
</style>
</head>
<body>

<div class="icon-rail">
  <div class="rail-brand">
    <img class="brand-wordmark" src="/assets/echelon-wordmark.png" alt="Echelon">
  </div>

  <div class="rail-section">Operations</div>
  <a href="/control.html" title="Incidents"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4l9 16H3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 17.2h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Incidents</span></a>
  <a href="/control.html" title="Terminals"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M9 19h6M12 15v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Terminals</span></a>
  <a href="/control.html" title="Map"><svg viewBox="0 0 24 24" fill="none"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6"/></svg><span>Map</span></a>
  <a href="/control.html" title="Messages"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Messages</span></a>
  <a href="/control.html" title="Callbacks"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3l3 1.5-1.2 3.2a12 12 0 007.5 7.5l3.2-1.2L20 17c0 2-1.6 3.5-3.5 3.3C10 19.7 4.3 14 3.7 7.5 3.5 5.6 5 4 7 4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Callbacks</span></a>
  <a href="/log.html" title="Log"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4h14v16l-3-2-3 2-3-2-3 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Log</span></a>

  <div class="rail-section">Fleet</div>
  <a href="/control.html" title="Talkgroups"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8a4 4 0 118 0 4 4 0 01-8 0z" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 19c0-3.3 2.7-5.5 5.5-5.5s5.5 2.2 5.5 5.5M14 8a3 3 0 100-6M18.5 13.7c2 .5 3.5 2.3 3.5 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Talkgroups</span></a>
  <a href="/control.html" title="Assignments"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/></svg><span>Assignments</span></a>

  <div class="rail-section">System</div>
  <a href="/admin.html" class="active" title="Admin"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8a4 4 0 118 0 4 4 0 01-8 0z" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 19c0-3.3 2.7-5.5 5.5-5.5s5.5 2.2 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 4.5l1 1.8 2 .4-1.4 1.5.3 2-1.9-.9-1.9.9.3-2-1.4-1.5 2-.4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Admin</span></a>
</div>

<main>
  <div class="topbar">
    <span class="link-net" id="net">link down</span>
    <span class="spacer"></span>
    <span class="clock" id="clock">--:--:--</span>
    <div class="user-block">
      <span class="avatar" id="avatar"></span>
      <span class="who">
        <span class="name" id="whoName"></span>
        <span class="role" id="whoRole"></span>
      </span>
    </div>
    <button class="btn" id="signout" style="padding:6px 12px;font-size:12px">Sign out</button>
  </div>

  <div class="page-body">
    <div class="page-head">
      <h1>Admin</h1>
      <span>
        <button class="btn primary" id="btnNewUser" style="padding:7px 14px;font-size:13px">New account</button>
        <button class="btn primary" id="btnNewRadio" style="padding:7px 14px;font-size:13px" hidden>New radio</button>
        <button class="btn primary" id="btnNewMdt" style="padding:7px 14px;font-size:13px" hidden>New MDT</button>
        <button class="btn primary" id="btnNewSite" style="padding:7px 14px;font-size:13px" hidden>New site</button>
      </span>
    </div>
    <div class="tabs">
      <button class="active" id="tabAccounts">Accounts</button>
      <button id="tabRadios">Radios</button>
      <button id="tabMdts">MDTs</button>
      <button id="tabSites">Sites</button>
    </div>

    <div id="viewAccounts">
      <div class="toolbar">
        <input id="uSearch" placeholder="Search username, name, email…">
        <select id="uRole">
          <option value="">All roles</option>
          <option value="SYSTEM_ADMIN">System admin</option>
          <option value="DISPATCHER">Dispatcher</option>
          <option value="SUPERVISOR">Supervisor</option>
          <option value="RADIO_USER">Radio user</option>
          <option value="MDT_USER">MDT user</option>
        </select>
      </div>
      <div id="uTableWrap"></div>
    </div>

    <div id="viewRadios" class="hide">
      <div class="toolbar">
        <input id="rSearch" placeholder="Search ISSI, alias, callsign…">
      </div>
      <div id="rTableWrap"></div>
    </div>

    <div id="viewMdts" class="hide">
      <div class="toolbar">
        <input id="mSearch" placeholder="Search MDT code, callsign…">
      </div>
      <div id="mTableWrap"></div>
    </div>

    <div id="viewSites" class="hide">
      <div class="toolbar">
        <input id="sSearch" placeholder="Search site name, address…">
      </div>
      <div id="sTableWrap"></div>
    </div>
  </div>
</main>

<div id="modalHost"></div>

<script src="/app.js"></script>
<script>
const { api, el, els, esc } = CCCS;
if (!CCCS.requireAuth(['SYSTEM_ADMIN'])) throw new Error('auth');
const me = CCCS.getSession().user;

el('#whoName').textContent = me.display_name;
el('#whoRole').textContent = me.role.replace('_', ' ');
el('#avatar').textContent = me.display_name.split(/\s+/).map((s) => s[0]).slice(0, 2).join('').toUpperCase();
el('#signout').onclick = () => { CCCS.clearSession(); location.href = '/index.html'; };
setInterval(() => (el('#clock').textContent = CCCS.hhmmss()), 250);

function modal(title, html, onMount) {
  el('#modalHost').innerHTML = `<div class="modal-back"><div class="modal"><h2>${esc(title)}</h2><div class="content">${html}</div><div class="foot"></div></div></div>`;
  onMount && onMount();
}
const closeModal = () => (el('#modalHost').innerHTML = '');
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

const ROLE_LABEL = { SYSTEM_ADMIN: 'System admin', DISPATCHER: 'Dispatcher', SUPERVISOR: 'Supervisor', RADIO_USER: 'Radio user', MDT_USER: 'MDT user' };
const roleClass = (r) => (r === 'SYSTEM_ADMIN' ? 'admin' : ['DISPATCHER', 'SUPERVISOR'].includes(r) ? 'control' : '');

let allUsers = [], allRadios = [], allMdts = [], allCallsigns = [], allTalkgroups = [], allSites = [];
async function load() {
  el('#uTableWrap').innerHTML = '<p class="empty-note">Loading…</p>';
  [allUsers, allRadios, allMdts, allCallsigns, allTalkgroups, allSites] = await Promise.all([
    api('GET', '/api/users'), api('GET', '/api/radios'), api('GET', '/api/mdts'),
    api('GET', '/api/callsigns'), api('GET', '/api/talkgroups'), api('GET', '/api/sites'),
  ]);
  paint(); paintRadios(); paintMdts(); paintSites();
}

/* ---------- tabs ---------- */
function showTab(name) {
  el('#tabAccounts').classList.toggle('active', name === 'accounts');
  el('#tabRadios').classList.toggle('active', name === 'radios');
  el('#tabMdts').classList.toggle('active', name === 'mdts');
  el('#tabSites').classList.toggle('active', name === 'sites');
  el('#viewAccounts').classList.toggle('hide', name !== 'accounts');
  el('#viewRadios').classList.toggle('hide', name !== 'radios');
  el('#viewMdts').classList.toggle('hide', name !== 'mdts');
  el('#viewSites').classList.toggle('hide', name !== 'sites');
  el('#btnNewUser').hidden = name !== 'accounts';
  el('#btnNewRadio').hidden = name !== 'radios';
  el('#btnNewMdt').hidden = name !== 'mdts';
  el('#btnNewSite').hidden = name !== 'sites';
}
el('#tabAccounts').onclick = () => showTab('accounts');
el('#tabRadios').onclick = () => showTab('radios');
el('#tabMdts').onclick = () => showTab('mdts');
el('#tabSites').onclick = () => showTab('sites');
function linkedTerminal(u) {
  if (u.radio_id) { const r = allRadios.find((x) => x.id === u.radio_id); return r ? `Radio ${esc(r.alias || r.issi)}` : '—'; }
  if (u.mdt_id) { const m = allMdts.find((x) => x.id === u.mdt_id); return m ? `MDT ${esc(m.mdt_code)}` : '—'; }
  return '—';
}
function paint() {
  const q = el('#uSearch').value.trim().toLowerCase();
  const role = el('#uRole').value;
  let rows = allUsers.slice().sort((a, b) => a.username.localeCompare(b.username));
  if (role) rows = rows.filter((u) => u.role === role);
  if (q) rows = rows.filter((u) =>
    u.username.toLowerCase().includes(q) || (u.display_name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));
  el('#uTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th style="width:150px">Username</th><th style="width:200px">Display name</th><th style="width:150px">Role</th><th style="width:160px">Linked terminal</th><th>Email</th></tr></thead>
      <tbody>${rows.map((u) => `<tr class="clickable" data-user="${u.id}">
        <td class="mono">${esc(u.username)}</td>
        <td>${esc(u.display_name)}</td>
        <td><span class="role-pill ${roleClass(u.role)}">${esc(ROLE_LABEL[u.role] || u.role)}</span></td>
        <td class="dim">${linkedTerminal(u)}</td>
        <td class="dim">${esc(u.email || '—')}</td>
      </tr>`).join('')}</tbody>
    </table>` : '<p class="empty-note">No matching accounts.</p>';
  els('#uTableWrap [data-user]').forEach((row) => row.addEventListener('click', () => editModal(allUsers.find((u) => u.id === Number(row.dataset.user)))));
}
el('#uSearch').addEventListener('input', paint);
el('#uRole').addEventListener('change', paint);

function roleOptions(selected) {
  return Object.entries(ROLE_LABEL).map(([v, label]) => `<option value="${v}" ${v === selected ? 'selected' : ''}>${label}</option>`).join('');
}
function radioOptions(selected) {
  return '<option value="">— none —</option>' + allRadios.map((r) =>
    `<option value="${r.id}" ${r.id === selected ? 'selected' : ''}>${esc(r.alias || r.issi)} (ISSI ${esc(r.issi)})</option>`).join('');
}
function mdtOptions(selected) {
  return '<option value="">— none —</option>' + allMdts.map((m) =>
    `<option value="${m.id}" ${m.id === selected ? 'selected' : ''}>${esc(m.mdt_code)}</option>`).join('');
}

function userForm(u) {
  const isNew = !u;
  return `
    <form class="stack" id="uForm">
      <label>Username</label>
      <input id="fUsername" ${isNew ? '' : 'disabled'} value="${isNew ? '' : esc(u.username)}" autocomplete="off">
      <label>Display name</label>
      <input id="fDisplay" value="${isNew ? '' : esc(u.display_name)}" autocomplete="off">
      <label>Role</label>
      <select id="fRole">${roleOptions(isNew ? 'DISPATCHER' : u.role)}</select>
      <label>Email (optional — used for Microsoft SSO matching)</label>
      <input id="fEmail" type="email" value="${isNew ? '' : esc(u.email || '')}" autocomplete="off">
      <label>Linked radio (for a Radio user account)</label>
      <select id="fRadio">${radioOptions(isNew ? null : u.radio_id)}</select>
      <label>Linked MDT (for an MDT user account)</label>
      <select id="fMdt">${mdtOptions(isNew ? null : u.mdt_id)}</select>
      <label>${isNew ? 'Password' : 'New password (leave blank to keep current)'}</label>
      <input id="fPassword" type="password" autocomplete="new-password" placeholder="${isNew ? 'min. 8 characters' : ''}">
      <p class="dim" id="fError" style="min-height:16px;margin:0"></p>
    </form>`;
}

function editModal(u) {
  modal(u ? `Edit — ${u.username}` : 'New account', userForm(u), () => {
    const foot = document.querySelector('#modalHost .foot');
    const isSelf = u && u.id === me.id;
    foot.innerHTML = `
      <div class="foot-split">
        <span>${u && !isSelf ? '<button class="btn danger" id="fDelete">Delete account</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="fCancel">Cancel</button>
          <button class="btn primary" id="fSave">${u ? 'Save changes' : 'Create account'}</button>
        </span>
      </div>`;
    el('#fCancel').onclick = closeModal;
    if (el('#fDelete')) el('#fDelete').onclick = async () => {
      if (!confirm(`Delete the account "${u.username}"? This cannot be undone.`)) return;
      try { await api('DELETE', `/api/users/${u.id}`); closeModal(); load(); }
      catch (e) { el('#fError').textContent = e.message; }
    };
    el('#fSave').onclick = async () => {
      const body = {
        display_name: el('#fDisplay').value.trim(),
        role: el('#fRole').value,
        email: el('#fEmail').value.trim() || null,
        radio_id: el('#fRadio').value ? Number(el('#fRadio').value) : null,
        mdt_id: el('#fMdt').value ? Number(el('#fMdt').value) : null,
      };
      const password = el('#fPassword').value;
      try {
        if (u) {
          if (password) body.password = password;
          await api('PATCH', `/api/users/${u.id}`, body);
        } else {
          body.username = el('#fUsername').value.trim();
          body.password = password;
          if (!body.username) throw new Error('username is required');
          await api('POST', '/api/users', body);
        }
        closeModal(); load();
      } catch (e) { el('#fError').textContent = e.message; }
    };
  });
}
el('#btnNewUser').onclick = () => editModal(null);

/* ---------- radios ---------- */
function paintRadios() {
  const q = el('#rSearch').value.trim().toLowerCase();
  let rows = allRadios.slice().sort((a, b) => a.issi.localeCompare(b.issi));
  if (q) rows = rows.filter((r) =>
    r.issi.includes(q) || (r.alias || '').toLowerCase().includes(q) || (r.callsign || '').toLowerCase().includes(q));
  el('#rTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th style="width:130px">ISSI</th><th>Alias</th><th style="width:110px">Type</th><th style="width:120px">Callsign</th><th style="width:130px">Talkgroup</th><th style="width:100px">Status</th><th style="width:70px"></th></tr></thead>
      <tbody>${rows.map((r) => `<tr class="clickable" data-radio="${r.id}">
        <td class="mono">${esc(r.issi)}</td>
        <td>${esc(r.alias || '—')}</td>
        <td class="dim">${esc(r.radio_type)}</td>
        <td class="dim">${esc(r.callsign || '—')}</td>
        <td class="dim">${esc(r.talkgroup || '—')}</td>
        <td class="dim">${esc(r.status)}</td>
        <td><button class="btn danger" data-delradio="${r.id}" style="padding:4px 10px;font-size:11px">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table>` : '<p class="empty-note">No radios yet.</p>';
  els('#rTableWrap [data-radio]').forEach((row) => row.addEventListener('click', (e) => {
    if (e.target.closest('[data-delradio]')) return;
    radioModal(allRadios.find((r) => r.id === Number(row.dataset.radio)));
  }));
  els('#rTableWrap [data-delradio]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); deleteRadio(Number(b.dataset.delradio)); }));
}
el('#rSearch').addEventListener('input', paintRadios);

async function deleteRadio(id) {
  const r = allRadios.find((x) => x.id === id);
  if (!r || !confirm(`Delete radio ${r.alias || r.issi} (ISSI ${r.issi})? This cannot be undone.`)) return;
  try { await api('DELETE', `/api/radios/${id}`); closeModal(); await load(); showTab('radios'); }
  catch (e) { alert(e.message); }
}

function radioForm(r) {
  const isNew = !r;
  return `
    <form class="stack" id="rForm">
      ${isNew ? '' : `<label>ISSI</label><input value="${esc(r.issi)}" disabled>`}
      <label>Alias</label>
      <input id="nrAlias" autocomplete="off" value="${isNew ? '' : esc(r.alias || '')}">
      <label>Radio type</label>
      <select id="nrType">
        <option value="HANDHELD" ${!isNew && r.radio_type === 'HANDHELD' ? 'selected' : ''}>Handheld</option>
        <option value="VEHICLE" ${!isNew && r.radio_type === 'VEHICLE' ? 'selected' : ''}>Vehicle</option>
        <option value="FIXED" ${!isNew && r.radio_type === 'FIXED' ? 'selected' : ''}>Fixed</option>
      </select>
      <label>Callsign (optional)</label>
      <select id="nrCallsign"><option value="">— none —</option>${allCallsigns.map((c) => `<option value="${esc(c.name)}" ${!isNew && r.callsign === c.name ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <label>Talkgroup (optional)</label>
      <select id="nrTalkgroup"><option value="">— none —</option>${allTalkgroups.map((t) => `<option value="${esc(t.name)}" ${!isNew && r.talkgroup === t.name ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      <p class="dim" id="rError" style="min-height:16px;margin:0"></p>
    </form>`;
}
function radioModal(r) {
  modal(r ? `Edit — ${r.issi}` : 'New radio', radioForm(r), () => {
    const foot = document.querySelector('#modalHost .foot');
    foot.innerHTML = `
      <div class="foot-split">
        <span>${r ? '<button class="btn danger" id="rDelete">Delete radio</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="rCancel">Cancel</button>
          <button class="btn primary" id="rSave">${r ? 'Save changes' : 'Create radio'}</button>
        </span>
      </div>`;
    el('#rCancel').onclick = closeModal;
    if (el('#rDelete')) el('#rDelete').onclick = () => deleteRadio(r.id);
    el('#rSave').onclick = async () => {
      const body = {
        alias: el('#nrAlias').value.trim() || undefined,
        radio_type: el('#nrType').value, callsign: el('#nrCallsign').value || null,
        talkgroup: el('#nrTalkgroup').value || null,
      };
      try {
        if (r) await api('PATCH', `/api/radios/${r.id}`, body);
        else await api('POST', '/api/radios', body);
        closeModal(); await load(); showTab('radios');
      } catch (e) { el('#rError').textContent = e.message; }
    };
  });
}
el('#btnNewRadio').onclick = () => radioModal(null);

/* ---------- MDTs ---------- */
function paintMdts() {
  const q = el('#mSearch').value.trim().toLowerCase();
  let rows = allMdts.slice().sort((a, b) => a.mdt_code.localeCompare(b.mdt_code));
  if (q) rows = rows.filter((m) => m.mdt_code.toLowerCase().includes(q) || (m.callsign || '').toLowerCase().includes(q));
  el('#mTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th style="width:130px">MDT code</th><th>Serial</th><th style="width:120px">Callsign</th><th style="width:100px">Status</th><th style="width:70px"></th></tr></thead>
      <tbody>${rows.map((m) => `<tr class="clickable" data-mdt="${m.id}">
        <td class="mono">${esc(m.mdt_code)}</td>
        <td class="dim">${esc(m.serial || '—')}</td>
        <td class="dim">${esc(m.callsign || '—')}</td>
        <td class="dim">${esc(m.status)}</td>
        <td><button class="btn danger" data-delmdt="${m.id}" style="padding:4px 10px;font-size:11px">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table>` : '<p class="empty-note">No MDTs yet.</p>';
  els('#mTableWrap [data-mdt]').forEach((row) => row.addEventListener('click', (e) => {
    if (e.target.closest('[data-delmdt]')) return;
    mdtModal(allMdts.find((m) => m.id === Number(row.dataset.mdt)));
  }));
  els('#mTableWrap [data-delmdt]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); deleteMdt(Number(b.dataset.delmdt)); }));
}
el('#mSearch').addEventListener('input', paintMdts);

async function deleteMdt(id) {
  const m = allMdts.find((x) => x.id === id);
  if (!m || !confirm(`Delete MDT ${m.mdt_code}? This cannot be undone.`)) return;
  try { await api('DELETE', `/api/mdts/${id}`); closeModal(); await load(); showTab('mdts'); }
  catch (e) { alert(e.message); }
}

function mdtForm(m) {
  const isNew = !m;
  return `
    <form class="stack" id="mForm">
      <label>MDT code</label>
      <input id="nmCode" autocomplete="off" value="${isNew ? '' : esc(m.mdt_code)}">
      <label>Serial (optional)</label>
      <input id="nmSerial" autocomplete="off" value="${isNew ? '' : esc(m.serial || '')}">
      <label>Callsign (optional)</label>
      <select id="nmCallsign"><option value="">— none —</option>${allCallsigns.map((c) => `<option value="${esc(c.name)}" ${!isNew && m.callsign === c.name ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <p class="dim" id="mError" style="min-height:16px;margin:0"></p>
    </form>`;
}
function mdtModal(m) {
  modal(m ? `Edit — ${m.mdt_code}` : 'New MDT', mdtForm(m), () => {
    const foot = document.querySelector('#modalHost .foot');
    foot.innerHTML = `
      <div class="foot-split">
        <span>${m ? '<button class="btn danger" id="mDelete">Delete MDT</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="mCancel">Cancel</button>
          <button class="btn primary" id="mSave">${m ? 'Save changes' : 'Create MDT'}</button>
        </span>
      </div>`;
    el('#mCancel').onclick = closeModal;
    if (el('#mDelete')) el('#mDelete').onclick = () => deleteMdt(m.id);
    el('#mSave').onclick = async () => {
      const body = {
        mdt_code: el('#nmCode').value.trim(), serial: el('#nmSerial').value.trim() || undefined,
        callsign: el('#nmCallsign').value || null,
      };
      try {
        if (m) await api('PATCH', `/api/mdts/${m.id}`, body);
        else await api('POST', '/api/mdts', body);
        closeModal(); await load(); showTab('mdts');
      } catch (e) { el('#mError').textContent = e.message; }
    };
  });
}
el('#btnNewMdt').onclick = () => mdtModal(null);

/* ---------- sites ---------- */
function paintSites() {
  const q = el('#sSearch').value.trim().toLowerCase();
  let rows = allSites.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (q) rows = rows.filter((s) => s.name.toLowerCase().includes(q) || (s.address || '').toLowerCase().includes(q));
  el('#sTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th>Name</th><th>Address</th><th style="width:160px">Contact email</th><th style="width:110px">Checklist</th><th style="width:70px"></th></tr></thead>
      <tbody>${rows.map((s) => `<tr class="clickable" data-site="${s.id}">
        <td>${esc(s.name)}</td>
        <td class="dim">${esc(s.address || '—')}</td>
        <td class="dim">${esc(s.contact_email || '—')}</td>
        <td class="dim">${s.checklist && s.checklist.length ? `${s.checklist.length} item${s.checklist.length === 1 ? '' : 's'}` : 'default template'}</td>
        <td><button class="btn danger" data-delsite="${s.id}" style="padding:4px 10px;font-size:11px">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table>` : '<p class="empty-note">No sites yet.</p>';
  els('#sTableWrap [data-site]').forEach((row) => row.addEventListener('click', (e) => {
    if (e.target.closest('[data-delsite]')) return;
    siteModal(allSites.find((s) => s.id === Number(row.dataset.site)));
  }));
  els('#sTableWrap [data-delsite]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); deleteSite(Number(b.dataset.delsite)); }));
}
el('#sSearch').addEventListener('input', paintSites);

async function deleteSite(id) {
  const s = allSites.find((x) => x.id === id);
  if (!s || !confirm(`Delete site ${s.name}? This cannot be undone.`)) return;
  try { await api('DELETE', `/api/sites/${id}`); closeModal(); await load(); showTab('sites'); }
  catch (e) { alert(e.message); }
}

/** Checklist rows are edited as a plain list of title/instructions pairs —
 * kept in a local array and re-rendered on every add/remove rather than
 * reading the DOM back apart, since drag-free add/remove is all this needs. */
function checklistEditor(items) {
  let rows = items.map((it) => ({ id: it.id, title: it.title, instructions: it.instructions || '' }));
  function render() {
    const host = el('#siteChecklistRows');
    if (!host) return;
    host.innerHTML = rows.length ? rows.map((r, i) => `
      <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;padding:10px;border:1px solid var(--line);border-radius:8px">
        <div style="flex:1">
          <input data-ct-title="${i}" placeholder="Task title" value="${esc(r.title)}" style="margin-bottom:6px">
          <textarea data-ct-instr="${i}" placeholder="Instructions" rows="2" style="width:100%;box-sizing:border-box;resize:vertical;font-family:var(--font);font-size:13px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">${esc(r.instructions)}</textarea>
        </div>
        <button type="button" class="btn danger" data-ct-remove="${i}" style="padding:6px 10px;font-size:11px">Remove</button>
      </div>`).join('') : '<p class="dim" style="font-size:13px">No custom tasks — this site uses the default checklist template until you add one.</p>';
    els('#siteChecklistRows [data-ct-title]').forEach((inp) => inp.addEventListener('input', () => { rows[Number(inp.dataset.ctTitle)].title = inp.value; }));
    els('#siteChecklistRows [data-ct-instr]').forEach((inp) => inp.addEventListener('input', () => { rows[Number(inp.dataset.ctInstr)].instructions = inp.value; }));
    els('#siteChecklistRows [data-ct-remove]').forEach((b) => (b.onclick = () => { rows.splice(Number(b.dataset.ctRemove), 1); render(); }));
  }
  render();
  return {
    get: () => rows.filter((r) => r.title.trim()).map((r) => ({ id: r.id, title: r.title.trim(), instructions: r.instructions.trim() })),
    add: () => { rows.push({ title: '', instructions: '' }); render(); },
  };
}

function siteForm(s) {
  const isNew = !s;
  return `
    <form class="stack" id="sForm">
      <label>Name</label>
      <input id="nsName" autocomplete="off" value="${isNew ? '' : esc(s.name)}">
      <label>Address</label>
      <input id="nsAddress" autocomplete="off" value="${isNew ? '' : esc(s.address || '')}">
      <label>Keyholder</label>
      <input id="nsKeyholder" autocomplete="off" value="${isNew ? '' : esc(s.keyholder || '')}">
      <label>Contact email (resolution reports are sent here)</label>
      <input id="nsEmail" type="email" autocomplete="off" value="${isNew ? '' : esc(s.contact_email || '')}">
      <label>On-scene checklist</label>
      <div id="siteChecklistRows"></div>
      <button type="button" class="btn" id="sAddTask" style="align-self:flex-start;padding:6px 12px;font-size:12px">+ Add task</button>
      <p class="dim" id="sError" style="min-height:16px;margin:0"></p>
    </form>`;
}
function siteModal(s) {
  modal(s ? `Edit — ${s.name}` : 'New site', siteForm(s), () => {
    const editor = checklistEditor(s ? (s.checklist || []) : []);
    el('#sAddTask').onclick = () => editor.add();
    const foot = document.querySelector('#modalHost .foot');
    foot.innerHTML = `
      <div class="foot-split">
        <span>${s ? '<button class="btn danger" id="sDelete">Delete site</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="sCancel">Cancel</button>
          <button class="btn primary" id="sSave">${s ? 'Save changes' : 'Create site'}</button>
        </span>
      </div>`;
    el('#sCancel').onclick = closeModal;
    if (el('#sDelete')) el('#sDelete').onclick = () => deleteSite(s.id);
    el('#sSave').onclick = async () => {
      const name = el('#nsName').value.trim();
      if (!name) { el('#sError').textContent = 'name is required'; return; }
      const body = {
        name, address: el('#nsAddress').value.trim(), keyholder: el('#nsKeyholder').value.trim(),
        contact_email: el('#nsEmail').value.trim(), checklist: editor.get(),
      };
      try {
        if (s) await api('PATCH', `/api/sites/${s.id}`, body);
        else { const created = await api('POST', '/api/sites', body); if (body.checklist.length) await api('PATCH', `/api/sites/${created.id}`, { checklist: body.checklist }); }
        closeModal(); await load(); showTab('sites');
      } catch (e) { el('#sError').textContent = e.message; }
    };
  });
}
el('#btnNewSite').onclick = () => siteModal(null);

CCCS.bus((up) => {
  const n = el('#net');
  if (n) { n.textContent = up ? 'link up' : 'link down'; n.classList.toggle('up', up); }
});

load();
</script>
</body>
</html>
