<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — admin</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCCS Admin">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<style>
  body { display: flex; height: 100vh; overflow: hidden; padding-left: 228px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .page-body { flex: 1; overflow: auto; padding: 24px 28px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .page-head h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { width: auto; min-width: 200px; }
  table.log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.log-table th {
    text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim);
    font-weight: 700; padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg);
  }
  table.log-table td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  table.log-table tr:hover td { background: var(--panel-2); }
  table.log-table tr.clickable { cursor: pointer; }
  .empty-note { color: var(--ink-dim); padding: 30px; text-align: center; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tabs button {
    background: none; border: none; color: var(--ink-dim); padding: 10px 4px; margin-right: 22px;
    font-family: var(--font); font-size: 13.5px; font-weight: 600; cursor: pointer; position: relative;
  }
  .tabs button.active { color: var(--ink); }
  .tabs button.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
  .role-pill {
    font-family: var(--mono); font-weight: 600; font-size: 10.5px; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 20px; border: 1px solid var(--line); color: var(--ink-dim);
  }
  .role-pill.admin { color: #f87171; border-color: rgba(248,113,113,.4); }
  .role-pill.control { color: var(--accent); border-color: rgba(20,184,166,.4); }
  form.stack { display: flex; flex-direction: column; gap: 12px; }
  form.stack label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: -6px; }
  .foot-split { display: flex; justify-content: space-between; align-items: center; width: 100%; }
</style>
</head>
<body>

<div class="icon-rail">
  <div class="rail-brand">
    <img class="brand-wordmark" src="/assets/echelon-wordmark.png" alt="Echelon">
  </div>

  <div class="rail-section">Operations</div>
  <a href="/dashboard.html" title="Dashboard"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="10" width="8" height="11" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg><span>Dashboard</span></a>
  <a href="/control.html" title="Incidents"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4l9 16H3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 17.2h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Incidents</span></a>
  <a href="/control.html" title="Terminals"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M9 19h6M12 15v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Terminals</span></a>
  <a href="/control.html" title="Map"><svg viewBox="0 0 24 24" fill="none"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6"/></svg><span>Map</span></a>
  <a href="/control.html" title="Messages"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Messages</span></a>
  <a href="/control.html" title="Callbacks"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3l3 1.5-1.2 3.2a12 12 0 007.5 7.5l3.2-1.2L20 17c0 2-1.6 3.5-3.5 3.3C10 19.7 4.3 14 3.7 7.5 3.5 5.6 5 4 7 4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Callbacks</span></a>
  <a href="/log.html" title="Log"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4h14v16l-3-2-3 2-3-2-3 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Log</span></a>

  <div class="rail-section">Fleet</div>
  <a href="/control.html" title="Assignments"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/></svg><span>Assignments</span></a>

  <div class="rail-section">HR</div>
  <a href="/rota.html" title="Rota"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Rota</span></a>

  <div class="rail-section">System</div>
  <a href="/admin.html" class="active" title="Admin"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8a4 4 0 118 0 4 4 0 01-8 0z" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 19c0-3.3 2.7-5.5 5.5-5.5s5.5 2.2 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 4.5l1 1.8 2 .4-1.4 1.5.3 2-1.9-.9-1.9.9.3-2-1.4-1.5 2-.4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Admin</span></a>
  <a href="/settings.html" title="My settings"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8a4 4 0 118 0 4 4 0 01-8 0z" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 19c0-3.3 2.7-5.5 5.5-5.5s5.5 2.2 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>My settings</span></a>
</div>

<main>
  <div class="topbar">
    <span class="link-net" id="net">link down</span>
    <span class="spacer"></span>
    <span class="clock" id="clock">--:--:--</span>
    <div class="user-block">
      <span class="avatar" id="avatar"></span>
      <span class="who">
        <span class="name" id="whoName"></span>
        <span class="role" id="whoRole"></span>
      </span>
    </div>
    <button class="btn" id="signout" style="padding:6px 12px;font-size:12px">Sign out</button>
  </div>

  <div class="page-body">
    <div class="page-head">
      <h1>Admin</h1>
      <span>
        <button class="btn primary" id="btnNewUser" style="padding:7px 14px;font-size:13px">New account</button>
        <button class="btn primary" id="btnNewPersonnel" style="padding:7px 14px;font-size:13px" hidden>New personnel</button>
        <button class="btn primary" id="btnNewMdt" style="padding:7px 14px;font-size:13px" hidden>New MDT</button>
        <button class="btn primary" id="btnNewSite" style="padding:7px 14px;font-size:13px" hidden>New site</button>
        <button class="btn primary" id="btnNewBeat" style="padding:7px 14px;font-size:13px" hidden>New beat</button>
        <button class="btn primary" id="btnNewSchedule" style="padding:7px 14px;font-size:13px" hidden>New patrol schedule</button>
        <button class="btn primary" id="btnNewVehicle" style="padding:7px 14px;font-size:13px" hidden>New vehicle</button>
        <button class="btn primary" id="btnNewAsset" style="padding:7px 14px;font-size:13px" hidden>New asset</button>
      </span>
    </div>
    <div class="tabs">
      <button class="active" id="tabAccounts">Accounts</button>
      <button id="tabPersonnel">Personnel</button>
      <button id="tabMdts">MDTs</button>
      <button id="tabVehicles">Vehicles</button>
      <button id="tabAssets">Assets</button>
      <button id="tabSites">Sites</button>
      <button id="tabBeats">Beats</button>
      <button id="tabPatrols">Patrol schedules</button>
    </div>

    <div id="viewAccounts">
      <div class="toolbar">
        <input id="uSearch" placeholder="Search username, name, email…">
        <select id="uRole">
          <option value="">All roles</option>
          <option value="SYSTEM_ADMIN">System admin</option>
          <option value="DISPATCHER">Dispatcher</option>
          <option value="SUPERVISOR">Supervisor</option>
          <option value="FIELD_USER">Field user</option>
          <option value="MDT_USER">MDT user</option>
        </select>
      </div>
      <div id="uTableWrap"></div>
    </div>

    <div id="viewPersonnel" class="hide">
      <div class="toolbar">
        <input id="pnSearch" placeholder="Search name, employee no…">
        <select id="pnStatus">
          <option value="">All statuses</option>
          <option value="ACTIVE">Active</option>
          <option value="LEAVE">On leave</option>
          <option value="TERMINATED">Terminated</option>
        </select>
      </div>
      <div id="pnTableWrap"></div>
    </div>

    <div id="viewMdts" class="hide">
      <div class="toolbar">
        <input id="mSearch" placeholder="Search MDT code, callsign…">
      </div>
      <div id="mTableWrap"></div>
    </div>

    <div id="viewVehicles" class="hide">
      <div class="toolbar">
        <input id="vSearch" placeholder="Search registration, make, model…">
      </div>
      <div id="vTableWrap"></div>
    </div>

    <div id="viewAssets" class="hide">
      <div class="toolbar">
        <input id="asSearch" placeholder="Search tag, description, serial…">
        <select id="asCategory">
          <option value="">All categories</option>
          <option value="EQUIPMENT">Equipment</option>
          <option value="UNIFORM">Uniform</option>
          <option value="KEY">Key</option>
          <option value="DEVICE">Device</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div id="asTableWrap"></div>
    </div>

    <div id="viewSites" class="hide">
      <div class="toolbar">
        <input id="sSearch" placeholder="Search site name, address…">
      </div>
      <div id="sTableWrap"></div>
    </div>

    <div id="viewBeats" class="hide">
      <div class="toolbar">
        <input id="beSearch" placeholder="Search beat name, site…">
      </div>
      <div id="beTableWrap"></div>
    </div>

    <div id="viewPatrols" class="hide">
      <div class="toolbar">
        <input id="pSearch" placeholder="Search label, site…">
      </div>
      <div id="pTableWrap"></div>
    </div>
  </div>
</main>

<div id="modalHost"></div>

<script src="/app.js"></script>
<script>
const { api, el, els, esc } = CCCS;
if (!CCCS.requireAuth(['SYSTEM_ADMIN'])) throw new Error('auth');
const me = CCCS.getSession().user;

el('#whoName').textContent = me.display_name;
el('#whoRole').textContent = me.role.replace('_', ' ');
el('#avatar').textContent = me.display_name.split(/\s+/).map((s) => s[0]).slice(0, 2).join('').toUpperCase();
el('#signout').onclick = () => { CCCS.clearSession(); location.href = '/index.html'; };
setInterval(() => (el('#clock').textContent = CCCS.hhmmss()), 250);

function modal(title, html, onMount) {
  el('#modalHost').innerHTML = `<div class="modal-back"><div class="modal"><h2>${esc(title)}</h2><div class="content">${html}</div><div class="foot"></div></div></div>`;
  onMount && onMount();
}
const closeModal = () => (el('#modalHost').innerHTML = '');
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

const ROLE_LABEL = { SYSTEM_ADMIN: 'System admin', DISPATCHER: 'Dispatcher', SUPERVISOR: 'Supervisor', FIELD_USER: 'Field user', MDT_USER: 'MDT user' };
const roleClass = (r) => (r === 'SYSTEM_ADMIN' ? 'admin' : ['DISPATCHER', 'SUPERVISOR'].includes(r) ? 'control' : '');

let allUsers = [], allPersonnel = [], allMdts = [], allCallsigns = [], allSites = [], allSchedules = [], allVehicles = [], allAssets = [], allBeats = [];
async function load() {
  el('#uTableWrap').innerHTML = '<p class="empty-note">Loading…</p>';
  [allUsers, allPersonnel, allMdts, allCallsigns, allSites, allSchedules, allVehicles, allAssets, allBeats] = await Promise.all([
    api('GET', '/api/users'), api('GET', '/api/personnel'), api('GET', '/api/mdts'),
    api('GET', '/api/callsigns'), api('GET', '/api/sites'), api('GET', '/api/patrol-schedules'),
    api('GET', '/api/vehicles'), api('GET', '/api/assets'), api('GET', '/api/beats'),
  ]);
  paint(); paintPersonnel(); paintMdts(); paintVehicles(); paintAssets(); paintSites(); paintBeats(); paintSchedules();
}

/* ---------- tabs ---------- */
function showTab(name) {
  el('#tabAccounts').classList.toggle('active', name === 'accounts');
  el('#tabPersonnel').classList.toggle('active', name === 'personnel');
  el('#tabMdts').classList.toggle('active', name === 'mdts');
  el('#tabVehicles').classList.toggle('active', name === 'vehicles');
  el('#tabAssets').classList.toggle('active', name === 'assets');
  el('#tabSites').classList.toggle('active', name === 'sites');
  el('#tabBeats').classList.toggle('active', name === 'beats');
  el('#tabPatrols').classList.toggle('active', name === 'patrols');
  el('#viewAccounts').classList.toggle('hide', name !== 'accounts');
  el('#viewPersonnel').classList.toggle('hide', name !== 'personnel');
  el('#viewMdts').classList.toggle('hide', name !== 'mdts');
  el('#viewVehicles').classList.toggle('hide', name !== 'vehicles');
  el('#viewAssets').classList.toggle('hide', name !== 'assets');
  el('#viewSites').classList.toggle('hide', name !== 'sites');
  el('#viewBeats').classList.toggle('hide', name !== 'beats');
  el('#viewPatrols').classList.toggle('hide', name !== 'patrols');
  el('#btnNewUser').hidden = name !== 'accounts';
  el('#btnNewPersonnel').hidden = name !== 'personnel';
  el('#btnNewMdt').hidden = name !== 'mdts';
  el('#btnNewVehicle').hidden = name !== 'vehicles';
  el('#btnNewAsset').hidden = name !== 'assets';
  el('#btnNewSite').hidden = name !== 'sites';
  el('#btnNewBeat').hidden = name !== 'beats';
  el('#btnNewSchedule').hidden = name !== 'patrols';
}
el('#tabAccounts').onclick = () => showTab('accounts');
el('#tabPersonnel').onclick = () => showTab('personnel');
el('#tabMdts').onclick = () => showTab('mdts');
el('#tabVehicles').onclick = () => showTab('vehicles');
el('#tabAssets').onclick = () => showTab('assets');
el('#tabSites').onclick = () => showTab('sites');
el('#tabBeats').onclick = () => showTab('beats');
el('#tabPatrols').onclick = () => showTab('patrols');
function linkedTerminal(u) {
  if (u.personnel_id) { const p = allPersonnel.find((x) => x.id === u.personnel_id); return p ? `Officer ${esc(p.name)}` : '—'; }
  if (u.mdt_id) { const m = allMdts.find((x) => x.id === u.mdt_id); return m ? `MDT ${esc(m.mdt_code)}` : '—'; }
  return '—';
}
function paint() {
  const q = el('#uSearch').value.trim().toLowerCase();
  const role = el('#uRole').value;
  let rows = allUsers.slice().sort((a, b) => a.username.localeCompare(b.username));
  if (role) rows = rows.filter((u) => u.role === role);
  if (q) rows = rows.filter((u) =>
    u.username.toLowerCase().includes(q) || (u.display_name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));
  el('#uTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th style="width:150px">Username</th><th style="width:200px">Display name</th><th style="width:150px">Role</th><th style="width:160px">Linked terminal</th><th>Email</th></tr></thead>
      <tbody>${rows.map((u) => `<tr class="clickable" data-user="${u.id}">
        <td class="mono">${esc(u.username)}</td>
        <td>${esc(u.display_name)}</td>
        <td><span class="role-pill ${roleClass(u.role)}">${esc(ROLE_LABEL[u.role] || u.role)}</span></td>
        <td class="dim">${linkedTerminal(u)}</td>
        <td class="dim">${esc(u.email || '—')}</td>
      </tr>`).join('')}</tbody>
    </table>` : '<p class="empty-note">No matching accounts.</p>';
  els('#uTableWrap [data-user]').forEach((row) => row.addEventListener('click', () => editModal(allUsers.find((u) => u.id === Number(row.dataset.user)))));
}
el('#uSearch').addEventListener('input', paint);
el('#uRole').addEventListener('change', paint);

function roleOptions(selected) {
  return Object.entries(ROLE_LABEL).map(([v, label]) => `<option value="${v}" ${v === selected ? 'selected' : ''}>${label}</option>`).join('');
}
function mdtOptions(selected) {
  return '<option value="">— none —</option>' + allMdts.map((m) =>
    `<option value="${m.id}" ${m.id === selected ? 'selected' : ''}>${esc(m.mdt_code)}</option>`).join('');
}
function personnelOptions(selected) {
  return '<option value="">— none —</option>' + allPersonnel
    .filter((p) => !p.has_login || p.id === selected)
    .map((p) => `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
}

function userForm(u) {
  const isNew = !u;
  return `
    <form class="stack" id="uForm">
      <label>Username</label>
      <input id="fUsername" ${isNew ? '' : 'disabled'} value="${isNew ? '' : esc(u.username)}" autocomplete="off">
      <label>Display name</label>
      <input id="fDisplay" value="${isNew ? '' : esc(u.display_name)}" autocomplete="off">
      <label>Role</label>
      <select id="fRole">${roleOptions(isNew ? 'DISPATCHER' : u.role)}</select>
      <label>Email (optional — used for Microsoft SSO matching)</label>
      <input id="fEmail" type="email" value="${isNew ? '' : esc(u.email || '')}" autocomplete="off">
      <label>Linked personnel (for a field user account)</label>
      <select id="fPersonnel">${personnelOptions(isNew ? null : u.personnel_id)}</select>
      <label>Linked MDT (for an MDT user account)</label>
      <select id="fMdt">${mdtOptions(isNew ? null : u.mdt_id)}</select>
      <label>${isNew ? 'Password' : 'New password (leave blank to keep current)'}</label>
      <input id="fPassword" type="password" autocomplete="new-password" placeholder="${isNew ? 'min. 8 characters' : ''}">
      <p class="dim" id="fError" style="min-height:16px;margin:0"></p>
    </form>`;
}

function editModal(u) {
  modal(u ? `Edit — ${u.username}` : 'New account', userForm(u), () => {
    const foot = document.querySelector('#modalHost .foot');
    const isSelf = u && u.id === me.id;
    foot.innerHTML = `
      <div class="foot-split">
        <span>${u && !isSelf ? '<button class="btn danger" id="fDelete">Delete account</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="fCancel">Cancel</button>
          <button class="btn primary" id="fSave">${u ? 'Save changes' : 'Create account'}</button>
        </span>
      </div>`;
    el('#fCancel').onclick = closeModal;
    if (el('#fDelete')) el('#fDelete').onclick = async () => {
      if (!confirm(`Delete the account "${u.username}"? This cannot be undone.`)) return;
      try { await api('DELETE', `/api/users/${u.id}`); closeModal(); load(); }
      catch (e) { el('#fError').textContent = e.message; }
    };
    el('#fSave').onclick = async () => {
      const body = {
        display_name: el('#fDisplay').value.trim(),
        role: el('#fRole').value,
        email: el('#fEmail').value.trim() || null,
        personnel_id: el('#fPersonnel').value ? Number(el('#fPersonnel').value) : null,
        mdt_id: el('#fMdt').value ? Number(el('#fMdt').value) : null,
      };
      const password = el('#fPassword').value;
      try {
        if (u) {
          if (password) body.password = password;
          await api('PATCH', `/api/users/${u.id}`, body);
        } else {
          body.username = el('#fUsername').value.trim();
          body.password = password;
          if (!body.username) throw new Error('username is required');
          await api('POST', '/api/users', body);
        }
        closeModal(); load();
      } catch (e) { el('#fError').textContent = e.message; }
    };
  });
}
el('#btnNewUser').onclick = () => editModal(null);

/* ---------- personnel ---------- */
const EMPLOYMENT_LABEL = { ACTIVE: 'Active', LEAVE: 'On leave', TERMINATED: 'Terminated' };
function paintPersonnel() {
  const q = el('#pnSearch').value.trim().toLowerCase();
  const status = el('#pnStatus').value;
  let rows = allPersonnel.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (status) rows = rows.filter((p) => p.employment_status === status);
  if (q) rows = rows.filter((p) => p.name.toLowerCase().includes(q) || (p.employee_no || '').toLowerCase().includes(q));
  el('#pnTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th>Name</th><th style="width:100px">Rank</th><th style="width:100px">Callsign</th><th style="width:110px">Status</th><th style="width:70px">Login</th><th style="width:70px"></th></tr></thead>
      <tbody>${rows.map((p) => `<tr class="clickable" data-personnel="${p.id}">
        <td>${esc(p.name)}</td>
        <td class="dim">${esc(p.rank || '—')}</td>
        <td class="dim">${esc(p.callsign || '—')}</td>
        <td class="dim">${esc(EMPLOYMENT_LABEL[p.employment_status] || p.employment_status)}</td>

               <select id="asCheckoutTo">${assignedPersonnelOptions(null)}</select>
               <button type="button" class="btn" id="asCheckout">Check out</button>
             </div>`;
        if (el('#asReturn')) el('#asReturn').onclick = async () => { await api('POST', `/api/assets/${a.id}/return`, {}); await refreshCheckouts(); };
        if (el('#asCheckout')) el('#asCheckout').onclick = async () => {
          const personnel_id = el('#asCheckoutTo').value ? Number(el('#asCheckoutTo').value) : null;
          if (!personnel_id) return;
          await api('POST', `/api/assets/${a.id}/checkout`, { personnel_id });
          await refreshCheckouts();
        };
      };
      refreshCheckouts();
    }
    const foot = document.querySelector('#modalHost .foot');
    foot.innerHTML = `
      <div class="foot-split">
        <span>${a ? '<button class="btn danger" id="asDelete">Delete asset</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="asCancel">Cancel</button>
          <button class="btn primary" id="asSave">${a ? 'Save changes' : 'Create asset'}</button>
        </span>
      </div>`;
    el('#asCancel').onclick = closeModal;
    if (el('#asDelete')) el('#asDelete').onclick = () => deleteAsset(a.id);
    el('#asSave').onclick = async () => {
      const description = el('#naDesc').value.trim();
      if (!description) { el('#asError').textContent = 'description is required'; return; }
      const body = {
        description, category: el('#naCategory').value, tag: el('#naTag').value.trim() || null, serial_no: el('#naSerial').value.trim(),
        status: el('#naStatus').value, assigned_to: el('#naAssigned').value ? Number(el('#naAssigned').value) : null,
        site_id: el('#naSite').value ? Number(el('#naSite').value) : null, purchase_date: el('#naPurchase').value || null,
        notes: el('#naNotes').value.trim(),
      };
      try {
        if (a) await api('PATCH', `/api/assets/${a.id}`, body);
        else await api('POST', '/api/assets', body);
        closeModal(); await load(); showTab('assets');
      } catch (e) { el('#asError').textContent = e.message; }
    };
  });
}
el('#btnNewAsset').onclick = () => assetModal(null);

/* ---------- sites ---------- */
function paintSites() {
  const q = el('#sSearch').value.trim().toLowerCase();
  let rows = allSites.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (q) rows = rows.filter((s) => s.name.toLowerCase().includes(q) || (s.address || '').toLowerCase().includes(q));
  el('#sTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th>Name</th><th>Address</th><th style="width:160px">Contact email</th><th style="width:110px">Checklist</th><th style="width:70px"></th></tr></thead>
      <tbody>${rows.map((s) => `<tr class="clickable" data-site="${s.id}">
        <td>${esc(s.name)}</td>
        <td class="dim">${esc(s.address || '—')}</td>
        <td class="dim">${esc(s.contact_email || '—')}</td>
        <td class="dim">${s.checklist && s.checklist.length ? `${s.checklist.length} item${s.checklist.length === 1 ? '' : 's'}` : 'default template'}</td>

el('#sSearch').addEventListener('input', paintSites);

async function deleteSite(id) {
  const s = allSites.find((x) => x.id === id);
  if (!s || !confirm(`Delete site ${s.name}? This cannot be undone.`)) return;
  try { await api('DELETE', `/api/sites/${id}`); closeModal(); await load(); showTab('sites'); }
  catch (e) { alert(e.message); }
}

/** Checklist rows are edited as a plain list of title/instructions pairs —
 * kept in a local array and re-rendered on every add/remove rather than
 * reading the DOM back apart, since drag-free add/remove is all this needs. */
function checklistEditor(items, hostId, emptyText) {
  hostId = hostId || 'siteChecklistRows';
  emptyText = emptyText || 'No custom tasks — this site uses the default checklist template until you add one.';
  let rows = items.map((it) => ({ id: it.id, title: it.title, instructions: it.instructions || '' }));
  function render() {
    const host = document.getElementById(hostId);
    if (!host) return;
    host.innerHTML = rows.length ? rows.map((r, i) => `
      <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;padding:10px;border:1px solid var(--line);border-radius:8px">
        <div style="flex:1">
          <input data-ct-title="${i}" placeholder="Task title" value="${esc(r.title)}" style="margin-bottom:6px">
          <textarea data-ct-instr="${i}" placeholder="Instructions" rows="2" style="width:100%;box-sizing:border-box;resize:vertical;font-family:var(--font);font-size:13px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">${esc(r.instructions)}</textarea>
        </div>
        <button type="button" class="btn danger" data-ct-remove="${i}" style="padding:6px 10px;font-size:11px">Remove</button>
      </div>`).join('') : `<p class="dim" style="font-size:13px">${esc(emptyText)}</p>`;
    els(`#${hostId} [data-ct-title]`).forEach((inp) => inp.addEventListener('input', () => { rows[Number(inp.dataset.ctTitle)].title = inp.value; }));
    els(`#${hostId} [data-ct-instr]`).forEach((inp) => inp.addEventListener('input', () => { rows[Number(inp.dataset.ctInstr)].instructions = inp.value; }));
    els(`#${hostId} [data-ct-remove]`).forEach((b) => (b.onclick = () => { rows.splice(Number(b.dataset.ctRemove), 1); render(); }));
  }
  render();
  return {
    get: () => rows.filter((r) => r.title.trim()).map((r) => ({ id: r.id, title: r.title.trim(), instructions: r.instructions.trim() })),
    add: () => { rows.push({ title: '', instructions: '' }); render(); },
  };
}

function siteForm(s) {
  const isNew = !s;
  return `
    <form class="stack" id="sForm">
      <label>Name</label>
      <input id="nsName" autocomplete="off" value="${isNew ? '' : esc(s.name)}">
      <label>Address</label>
      <input id="nsAddress" autocomplete="off" value="${isNew ? '' : esc(s.address || '')}">
      <label>Keyholder</label>
      <input id="nsKeyholder" autocomplete="off" value="${isNew ? '' : esc(s.keyholder || '')}">
      <label>Contact email (resolution reports are sent here)</label>
      <input id="nsEmail" type="email" autocomplete="off" value="${isNew ? '' : esc(s.contact_email || '')}">
      <label>On-scene checklist</label>
      <div id="siteChecklistRows"></div>
      <button type="button" class="btn" id="sAddTask" style="align-self:flex-start;padding:6px 12px;font-size:12px">+ Add task</button>
      ${s ? `
      <label>Passdown — shift-handover notes</label>
      <div id="sPassdownLog" class="dim">Loading…</div>
      <div style="display:flex;gap:8px">
        <input id="sPassdownNote" autocomplete="off" placeholder="Note for the next person on site" style="flex:1">
        <button type="button" class="btn" id="sPassdownAdd">Add</button>
      </div>` : ''}
      <p class="dim" id="sError" style="min-height:16px;margin:0"></p>
    </form>`;
}
function siteModal(s) {
  modal(s ? `Edit — ${s.name}` : 'New site', siteForm(s), () => {
    const editor = checklistEditor(s ? (s.checklist || []) : []);
    el('#sAddTask').onclick = () => editor.add();
    if (s) {
      const paintPassdown = (logs) => {
        el('#sPassdownLog').innerHTML = logs.length
          ? `<div class="log" style="max-height:160px;overflow:auto">${logs.map((l) => `<div><span class="t">${esc(new Date(l.created_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</span>${esc(l.author_name)}: ${esc(l.body)}</div>`).join('')}</div>`
          : '<p class="dim">No handover notes yet.</p>';
      };
      api('GET', `/api/passdown-logs?site_id=${s.id}`).then(paintPassdown).catch(() => (el('#sPassdownLog').textContent = 'Failed to load.'));
      el('#sPassdownAdd').onclick = async () => {
        const body = el('#sPassdownNote').value.trim();
        if (!body) return;
        const logs = await api('POST', '/api/passdown-logs', { site_id: s.id, body }).then(() => api('GET', `/api/passdown-logs?site_id=${s.id}`));
        el('#sPassdownNote').value = '';
        paintPassdown(logs);
      };
    }
    const foot = document.querySelector('#modalHost .foot');
    foot.innerHTML = `
      <div class="foot-split">
        <span>${s ? '<button class="btn danger" id="sDelete">Delete site</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="sCancel">Cancel</button>
          <button class="btn primary" id="sSave">${s ? 'Save changes' : 'Create site'}</button>
        </span>
      </div>`;
    el('#sCancel').onclick = closeModal;
    if (el('#sDelete')) el('#sDelete').onclick = () => deleteSite(s.id);
    el('#sSave').onclick = async () => {
      const name = el('#nsName').value.trim();
      if (!name) { el('#sError').textContent = 'name is required'; return; }
      const body = {
        name, address: el('#nsAddress').value.trim(), keyholder: el('#nsKeyholder').value.trim(),
        contact_email: el('#nsEmail').value.trim(), checklist: editor.get(),
      };
      try {
        if (s) await api('PATCH', `/api/sites/${s.id}`, body);
        else { const created = await api('POST', '/api/sites', body); if (body.checklist.length) await api('PATCH', `/api/sites/${created.id}`, { checklist: body.checklist }); }
        closeModal(); await load(); showTab('sites');
      } catch (e) { el('#sError').textContent = e.message; }
    };
  });
}
el('#btnNewSite').onclick = () => siteModal(null);

/* ---------- beats ---------- */
function paintBeats() {
  const q = el('#beSearch').value.trim().toLowerCase();
  let rows = allBeats.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (q) rows = rows.filter((b) => b.name.toLowerCase().includes(q) || (b.site_name || '').toLowerCase().includes(q));
  el('#beTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th>Name</th><th>Site</th><th style="width:110px">Waypoints</th><th style="width:90px">Active</th><th style="width:70px"></th></tr></thead>
      <tbody>${rows.map((b) => `<tr class="clickable" data-beat="${b.id}">
        <td>${esc(b.name)}</td>
        <td class="dim">${esc(b.site_name || '—')}</td>
        <td class="dim">${(b.waypoints || []).length}</td>
        <td class="dim">${b.active ? 'Yes' : 'Paused'}</td>
        <td><button class="btn danger" data-delbeat="${b.id}" style="padding:4px 10px;font-size:11px">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table>` : '<p class="empty-note">No beats yet.</p>';
  els('#beTableWrap [data-beat]').forEach((row) => row.addEventListener('click', (e) => {
    if (e.target.closest('[data-delbeat]')) return;
    beatModal(allBeats.find((b) => b.id === Number(row.dataset.beat)));
  }));
  els('#beTableWrap [data-delbeat]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); deleteBeat(Number(b.dataset.delbeat)); }));
}
el('#beSearch').addEventListener('input', paintBeats);

async function deleteBeat(id) {
  const b = allBeats.find((x) => x.id === id);
  if (!b || !confirm(`Delete beat "${b.name}"? This cannot be undone.`)) return;
  try { await api('DELETE', `/api/beats/${id}`); closeModal(); await load(); showTab('beats'); }
  catch (e) { alert(e.message); }
}

function beatForm(b) {
  const isNew = !b;
  return `
    <form class="stack" id="beForm">
      <label>Name</label>
      <input id="nbeName" autocomplete="off" value="${isNew ? '' : esc(b.name)}" placeholder="Perimeter, Car park sweep…">
      <label>Site</label>
      <select id="nbeSite">${allSites.map((x) => `<option value="${x.id}" ${!isNew && b.site_id === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <label>Description</label>
      <textarea id="nbeDesc" rows="2">${isNew ? '' : esc(b.description || '')}</textarea>
      <label>Waypoints</label>
      <div id="beatWaypointRows"></div>
      <button type="button" class="btn" id="beAddWaypoint" style="align-self:flex-start;padding:6px 12px;font-size:12px">+ Add waypoint</button>
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:500;letter-spacing:0">
        <input type="checkbox" id="nbeActive" ${isNew || b.active ? 'checked' : ''}> Active
      </label>
      <p class="dim" id="beError" style="min-height:16px;margin:0"></p>
    </form>`;
}
function beatModal(b) {
  modal(b ? `Edit — ${b.name}` : 'New beat', beatForm(b), () => {
    const editor = checklistEditor(b ? (b.waypoints || []) : [], 'beatWaypointRows', 'No waypoints yet — a beat works fine as a plain named route without them.');
    el('#beAddWaypoint').onclick = () => editor.add();
    const foot = document.querySelector('#modalHost .foot');
    foot.innerHTML = `
      <div class="foot-split">
        <span>${b ? '<button class="btn danger" id="beDelete">Delete beat</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="beCancel">Cancel</button>
          <button class="btn primary" id="beSave">${b ? 'Save changes' : 'Create beat'}</button>
        </span>
      </div>`;
    el('#beCancel').onclick = closeModal;
    if (el('#beDelete')) el('#beDelete').onclick = () => deleteBeat(b.id);
    el('#beSave').onclick = async () => {
      const name = el('#nbeName').value.trim();
      if (!name) { el('#beError').textContent = 'name is required'; return; }
      const body = { name, description: el('#nbeDesc').value.trim(), active: el('#nbeActive').checked };
      try {
        if (b) await api('PATCH', `/api/beats/${b.id}`, { ...body, waypoints: editor.get() });
        else {
          body.site_id = Number(el('#nbeSite').value);
          const created = await api('POST', '/api/beats', body);
          const waypoints = editor.get();
          if (waypoints.length) await api('PATCH', `/api/beats/${created.id}`, { waypoints });
        }
        closeModal(); await load(); showTab('beats');
      } catch (e) { el('#beError').textContent = e.message; }
    };
  });
}
el('#btnNewBeat').onclick = () => beatModal(null);

/* ---------- patrol schedules ---------- */
const DAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function cadenceLabel(s) {
  if (s.interval_hours) return `Every ${s.interval_hours}h`;
  if (s.days_of_week && s.time_of_day) return `${s.days_of_week.map((d) => DAY_LABELS[d]).join('/')} at ${s.time_of_day}`;
  return '—';
}
function paintSchedules() {
  const q = el('#pSearch').value.trim().toLowerCase();
  let rows = allSchedules.slice().sort((a, b) => a.label.localeCompare(b.label));
  if (q) rows = rows.filter((s) => s.label.toLowerCase().includes(q) || (s.site_name || '').toLowerCase().includes(q));
  el('#pTableWrap').innerHTML = rows.length ? `
    <table class="log-table">
      <thead><tr><th>Label</th><th>Site</th><th>Beat</th><th style="width:160px">Cadence</th><th style="width:90px">Active</th><th style="width:70px"></th></tr></thead>
      <tbody>${rows.map((s) => `<tr class="clickable" data-schedule="${s.id}">
        <td>${esc(s.label)}</td>
        <td class="dim">${esc(s.site_name || '—')}</td>
        <td class="dim">${esc(s.beat_name || '—')}</td>
        <td class="dim mono">${esc(cadenceLabel(s))}</td>
        <td class="dim">${s.active ? 'Yes' : 'Paused'}</td>
        <td><button class="btn danger" data-delschedule="${s.id}" style="padding:4px 10px;font-size:11px">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table>` : '<p class="empty-note">No patrol schedules yet.</p>';
  els('#pTableWrap [data-schedule]').forEach((row) => row.addEventListener('click', (e) => {
    if (e.target.closest('[data-delschedule]')) return;
    scheduleModal(allSchedules.find((s) => s.id === Number(row.dataset.schedule)));
  }));
  els('#pTableWrap [data-delschedule]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); deleteSchedule(Number(b.dataset.delschedule)); }));
}
el('#pSearch').addEventListener('input', paintSchedules);

async function deleteSchedule(id) {
  const s = allSchedules.find((x) => x.id === id);
  if (!s || !confirm(`Delete patrol schedule "${s.label}"? This cannot be undone.`)) return;
  try { await api('DELETE', `/api/patrol-schedules/${id}`); closeModal(); await load(); showTab('patrols'); }
  catch (e) { alert(e.message); }
}

function scheduleForm(s) {
  const isNew = !s;
  const cadence = isNew ? 'interval' : (s.interval_hours ? 'interval' : 'weekly');
  return `
    <form class="stack" id="pForm">
      <label>Label</label>
      <input id="npLabel" autocomplete="off" value="${isNew ? '' : esc(s.label)}">
      <label>Site</label>
      <select id="npSite">${allSites.map((x) => `<option value="${x.id}" ${!isNew && s.site_id === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <label>Beat (optional)</label>
      <select id="npBeat"></select>
      <label>Cadence</label>
      <select id="npCadence">
        <option value="interval" ${cadence === 'interval' ? 'selected' : ''}>Every N hours</option>
        <option value="weekly" ${cadence === 'weekly' ? 'selected' : ''}>Specific days and time</option>
      </select>
      <div id="npIntervalRow" style="${cadence === 'interval' ? '' : 'display:none'}">
        <label>Interval (hours)</label>
        <input id="npInterval" type="number" min="1" value="${!isNew && s.interval_hours ? s.interval_hours : '4'}">
      </div>
      <div id="npWeeklyRow" style="${cadence === 'weekly' ? '' : 'display:none'}">
        <label>Days</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${DAY_LABELS.map((d, i) => `<label style="display:flex;align-items:center;gap:4px;text-transform:none;font-size:12.5px;font-weight:500;letter-spacing:0"><input type="checkbox" data-npday="${i}" ${!isNew && s.days_of_week && s.days_of_week.includes(i) ? 'checked' : ''}> ${d}</label>`).join('')}
        </div>
        <label>Time of day</label>
        <input id="npTime" type="time" value="${!isNew && s.time_of_day ? s.time_of_day : '22:00'}">
      </div>
      <label>Expected duration (minutes)</label>
      <input id="npDuration" type="number" min="5" value="${!isNew && s.duration_expected_min ? s.duration_expected_min : '30'}">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:500;letter-spacing:0">
        <input type="checkbox" id="npActive" ${isNew || s.active ? 'checked' : ''}> Active
      </label>
      <p class="dim" id="pError" style="min-height:16px;margin:0"></p>
    </form>`;
}
function scheduleModal(s) {
  modal(s ? `Edit — ${s.label}` : 'New patrol schedule', scheduleForm(s), () => {
    el('#npCadence').onchange = () => {
      const interval = el('#npCadence').value === 'interval';
      el('#npIntervalRow').style.display = interval ? '' : 'none';
      el('#npWeeklyRow').style.display = interval ? 'none' : '';
    };
    const paintBeatOptions = () => {
      const siteId = Number(el('#npSite').value);
      const beats = allBeats.filter((b) => b.site_id === siteId);
      el('#npBeat').innerHTML = '<option value="">— none —</option>' + beats.map((b) => `<option value="${b.id}" ${s && s.beat_id === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
    };
    el('#npSite').onchange = paintBeatOptions;
    paintBeatOptions();
    const foot = document.querySelector('#modalHost .foot');
    foot.innerHTML = `
      <div class="foot-split">
        <span>${s ? '<button class="btn danger" id="pDelete">Delete schedule</button>' : ''}</span>
        <span class="btn-row" style="margin:0">
          <button class="btn" id="pCancel">Cancel</button>
          <button class="btn primary" id="pSave">${s ? 'Save changes' : 'Create schedule'}</button>
        </span>
      </div>`;
    el('#pCancel').onclick = closeModal;
    if (el('#pDelete')) el('#pDelete').onclick = () => deleteSchedule(s.id);
    el('#pSave').onclick = async () => {
      const label = el('#npLabel').value.trim();
      if (!label) { el('#pError').textContent = 'label is required'; return; }
      const interval = el('#npCadence').value === 'interval';
      const body = {
        label, site_id: Number(el('#npSite').value), beat_id: el('#npBeat').value ? Number(el('#npBeat').value) : null,
        duration_expected_min: Number(el('#npDuration').value) || 30,
        active: el('#npActive').checked,
        interval_hours: interval ? Number(el('#npInterval').value) || null : null,
        days_of_week: interval ? null : els('[data-npday]:checked').map((c) => Number(c.dataset.npday)),
        time_of_day: interval ? null : el('#npTime').value,
      };
      try {
        if (s) await api('PATCH', `/api/patrol-schedules/${s.id}`, body);
        else await api('POST', '/api/patrol-schedules', body);
        closeModal(); await load(); showTab('patrols');
      } catch (e) { el('#pError').textContent = e.message; }
    };
  });
}
el('#btnNewSchedule').onclick = () => scheduleModal(null);

CCCS.bus((up) => {
  const n = el('#net');
  if (n) { n.textContent = up ? 'link up' : 'link down'; n.classList.toggle('up', up); }
});

load();
</script>
