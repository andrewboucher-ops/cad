<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — rota</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCCS Rota">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<style>
  body { display: flex; height: 100vh; overflow: hidden; padding-left: 228px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .page-body { flex: 1; overflow: auto; padding: 24px 28px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .week-nav { display: flex; align-items: center; gap: 10px; }
  .week-nav .range { font-family: var(--mono); font-size: 13px; color: var(--ink-dim); min-width: 190px; text-align: center; }

  .rota-grid { display: grid; grid-template-columns: 180px repeat(7, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rota-grid > div { background: var(--panel); padding: 8px; min-height: 64px; }
  .rota-grid .hdr { background: var(--panel-2); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-dim); padding: 10px 8px; position: sticky; top: 0; z-index: 1; }
  .rota-grid .hdr.today { color: var(--accent); }
  .rota-grid .person-name { background: var(--panel-2); font-weight: 600; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .rota-grid .person-name .sub { font-size: 11px; color: var(--ink-dim); font-weight: 400; }
  .rota-cell { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .rota-cell:hover { background: var(--panel-2); }
  .shift-chip {
    font-size: 11px; padding: 4px 6px; border-radius: 5px; background: var(--panel-3);
    border-left: 3px solid var(--accent); line-height: 1.35;
  }
  .shift-chip .times { font-family: var(--mono); font-weight: 700; }
  .shift-chip.status-CLOCKED_IN { border-color: var(--available); }
  .shift-chip.status-CLOCKED_OUT { border-color: var(--ink-dim); opacity: .7; }
  .shift-chip.status-NO_SHOW { border-color: var(--emergency); }
  .shift-chip.status-CANCELLED { border-color: var(--ink-dim); opacity: .5; text-decoration: line-through; }
  .shift-chip.leave-conflict { border-color: var(--priority); }
  .shift-chip .leave-flag { color: var(--priority); font-weight: 700; }
  .shift-chip.draft { opacity: .6; border-style: dashed; }
  .coverage-badge { font-weight: 700; padding: 0 4px; border-radius: 3px; margin-left: 4px; }
  .coverage-badge.gap { color: var(--emergency); background: rgba(239,68,68,.12); }
  .coverage-badge.over { color: var(--priority); background: rgba(249,115,22,.12); }
  .add-hint { font-size: 10.5px; color: var(--ink-dim); opacity: 0; transition: opacity .1s; }
  .rota-cell:hover .add-hint { opacity: 1; }
  .visit-chip {
    font-size: 10.5px; padding: 3px 6px; border-radius: 5px; background: var(--panel-3);
    border-left: 3px dotted var(--ink-dim); line-height: 1.3; opacity: .85; cursor: default;
  }
  .visit-chip .times { font-family: var(--mono); font-weight: 700; }
  .visit-chip.dbl-booked { border-left-color: var(--emergency); }
  .visit-chip .dbl-flag { color: var(--emergency); font-weight: 700; }
  form.stack { display: flex; flex-direction: column; gap: 12px; }
  form.stack label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: -6px; }
  .foot-split { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .page-head .btn, .rota-bar .btn { padding: 7px 14px; font-size: 13px; }
  .rota-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: -6px 0 12px; }
  .rota-bar .spacer { flex: 1; }
  .rota-bar input { width: 260px; max-width: 100%; padding: 6px 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: var(--panel); padding: 7px 14px; font: inherit; font-size: 13px; color: var(--ink-dim); cursor: pointer; }
  .seg button.on { background: var(--accent-dim); color: #fff; }
  /* Days never shrink below a readable width; the grid scrolls sideways
     instead, with the names column pinned. */
  #gridWrap { overflow-x: auto; border-radius: 8px; }
  .rota-grid { grid-template-columns: 170px repeat(7, minmax(158px, 1fr)) !important; min-width: max-content; }
  .rota-grid .person-name, .rota-grid .hdr:first-child { position: sticky; left: 0; z-index: 2; }
  .rota-grid .hdr { z-index: 3; }
  .shift-chip { font-size: 12px; padding: 5px 7px; }
  .shift-chip .times { white-space: nowrap; }
  .day-list h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); margin: 18px 0 6px; }
  .day-list h3.today { color: var(--accent); }
  .day-list table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .day-list td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .day-list tr { cursor: pointer; } .day-list tr:hover td { background: var(--panel-2); }
  .day-list .t { font-family: var(--mono); font-weight: 700; white-space: nowrap; width: 120px; }
</style>
</head>
<body>

<div class="icon-rail"></div>

<main>
  <div class="topbar">
    <span class="link-net" id="net">link down</span>
    <span class="spacer"></span>
    <span class="clock" id="clock">--:--:--</span>
    <div class="user-block">
      <span class="avatar" id="avatar"></span>
      <span class="who">
        <span class="name" id="whoName"></span>
        <span class="role" id="whoRole"></span>
      </span>
    </div>
    <button class="btn" id="signout" style="padding:6px 12px;font-size:12px">Sign out</button>
  </div>

  <div class="page-body">
    <div class="page-head">
      <h1>Rota</h1>
      <div class="week-nav">
        <button class="btn" id="prevWeek">‹ Prev</button>
        <span class="range" id="weekRange"></span>
        <button class="btn" id="thisWeek">This week</button>
        <button class="btn" id="nextWeek">Next ›</button>
      </div>
      <button class="btn primary" id="btnNewShift">New shift</button>
    </div>
    <div class="rota-bar">
      <div class="seg" id="viewSeg"><button data-v="staff" class="on">By staff</button><button data-v="site">By site</button><button data-v="list">List by day</button></div>
      <select id="groupBy" class="hide"><option value="staff">Group by staff</option><option value="site">Group by site</option><option value="list">List by day</option></select>
      <input id="rotaSearch" type="search" placeholder="Search name, site, postcode, time…">
      <span class="spacer"></span>
      <button class="btn" id="btnPublishDrafts">Publish drafts</button>
      <button class="btn" id="btnDuplicateWeek">Duplicate week forward</button>
      <button class="btn" id="btnCalSync">Calendar sync</button>
    </div>
    <p class="dim" id="coverageSummary" style="margin:0 0 10px;font-size:12.5px"></p>
    <div id="gridWrap"></div>
  </div>
</main>

<div id="modalHost"></div>

<script src="/app.js"></script>
<script src="/nav.js"></script>
<script>
const { api, el, els, esc } = CCCS;
if (!CCCS.requireAuth(['DISPATCHER', 'SUPERVISOR', 'SYSTEM_ADMIN'])) throw new Error('auth');
const me = CCCS.getSession().user;

el('#whoName').textContent = me.display_name;
el('#whoRole').textContent = me.role.replace('_', ' ');
el('#avatar').textContent = me.display_name.split(/\s+/).map((s) => s[0]).slice(0, 2).join('').toUpperCase();
el('#signout').onclick = () => { CCCS.clearSession(); location.href = '/index.html'; };
setInterval(() => (el('#clock').textContent = CCCS.hhmmss()), 250);

function modal(title, html, onMount) {
  el('#modalHost').innerHTML = `<div class="modal-back"><div class="modal"><h2>${esc(title)}</h2><div class="content">${html}</div><div class="foot"></div></div></div>`;
  onMount && onMount();
}
const closeModal = () => (el('#modalHost').innerHTML = '');
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // Monday start, as UK rotas run
  return x;
}
let weekStart = startOfWeek(new Date());
let allPersonnel = [], allSites = [], allShifts = [], allShiftTypes = [], allVehicles = [], allAssets = [], allSiteVisits = [];
/** A shift chip shows one person's own involvement — their assignment
 * carries the clock/attendance state now, the shift itself only carries
 * DRAFT/PUBLISHED/IN_PROGRESS/COMPLETED/CANCELLED. */
function chipStatusClass(shift, a) {
  if (shift.status === 'CANCELLED') return 'CANCELLED';
  if (a.attendance === 'NO_SHOW') return 'NO_SHOW';
  if (a.clocked_out_at) return 'CLOCKED_OUT';
  if (a.clocked_in_at) return 'CLOCKED_IN';
  return 'SCHEDULED';
}

function weekDays() {
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(weekStart); d.setDate(d.getDate() + i); return d; });
}
// Deliberately NOT toISOString().slice(0,10) — that converts to UTC first,
// which silently shifts the calendar date back a day for any timezone ahead
// of UTC (confirmed live: BST puts this off by one). Format the local
// calendar date directly instead.
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
const hm = (iso) => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
/** ISO → the value a datetime-local input wants, in local time. */
const localDT = (iso) => (iso ? new Date(Date.parse(iso) - new Date(iso).getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '');

async function load() {
  const days = weekDays();
  const from = new Date(days[0]); from.setHours(0, 0, 0, 0);
  const to = new Date(days[6]); to.setHours(23, 59, 59, 999);
  el('#weekRange').textContent = `${days[0].toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} – ${days[6].toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`;
  [allPersonnel, allSites, allShifts, allShiftTypes, allVehicles, allAssets, allSiteVisits] = await Promise.all([
    api('GET', '/api/personnel'), api('GET', '/api/sites'),
    api('GET', `/api/shifts?from=${encodeURIComponent(from.toISOString())}&to=${encodeURIComponent(to.toISOString())}`),
    api('GET', '/api/shift-types'), api('GET', '/api/vehicles'), api('GET', '/api/assets'),
    // No from/to filter exists server-side for site-visits yet — filtered
    // to this week client-side below, same as admin.html already does for
    // patrol schedules. Read-only here: scheduling a patrol is still done
    // from Patrol schedules, this is purely "don't double-book" visibility.
    api('GET', '/api/site-visits').catch(() => []),
  ]);
  paintGrid();
}
el('#rotaSearch').addEventListener('input', paintGrid);
el('#groupBy').addEventListener('change', paintGrid);

/** Everything about a shift worth finding it by, flattened into one
 * lowercase string: who's on it, where, its type, its status, and when
 * (day name, date, and both times) — so "dan", "meridian", "SW1A",
 * "patrol" and "09:00" all work from the same box, not five different
 * filters. A site with no postcode/address on record just contributes
 * nothing for those fields rather than breaking the search. */
function shiftSearchText(s) {
  const site = s.site_id ? allSites.find((x) => x.id === s.site_id) : null;
  const names = s.assignments.filter((a) => a.status !== 'REMOVED').map((a) => a.personnel_name).join(' ');
  const start = new Date(s.starts_at), end = new Date(s.ends_at);
  const when = `${start.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })} ${start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} ${end.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
  return [s.shift_type_name, site && site.name, site && site.postcode, site && site.address, names, when, s.status]
    .filter(Boolean).join(' ').toLowerCase();
}
// An empty search shows everything, every site, every type, in one grid —
// typing narrows it by a substring match across every field above, not an
// exact pick from a fixed list, so "dan" or "SW1A" or "patrol" all work.
function visibleShifts() {
  const q = el('#rotaSearch').value.trim().toLowerCase();
  return q ? allShifts.filter((s) => shiftSearchText(s).includes(q)) : allShifts;
}
/** Scheduled patrol visits, read-only here — they're created and managed
 * from Patrol schedules, not from the rota. Shown so a dispatcher staffing
 * a shift can see a person's already got a patrol run that hour, same
 * reason on_leave_conflict is shown: a thing you need to know about
 * before you double-book someone, not something this page edits. */
function visitsForPersonOnDay(personId, d) {
  return allSiteVisits.filter((v) => v.status !== 'CANCELLED' && sameDay(new Date(v.scheduled_for), d) && v.resources.some((r) => r.personnel_id === personId));
}
function visitsForSiteOnDay(siteId, d) {
  return allSiteVisits.filter((v) => v.status !== 'CANCELLED' && sameDay(new Date(v.scheduled_for), d) && v.site_id === siteId);
}
function visitOverlapsAny(v, shiftsThatDay) {
  const vStart = Date.parse(v.scheduled_for);
  const vEnd = vStart + (v.duration_expected_min || 30) * 60000;
  return shiftsThatDay.some((s) => s.status !== 'CANCELLED' && Date.parse(s.starts_at) < vEnd && vStart < Date.parse(s.ends_at));
}
function visitChipHtml(v, overlap) {
  const start = new Date(v.scheduled_for);
  const who = v.resources.map((r) => r.personnel).filter(Boolean).join(', ');
  return `<div class="visit-chip${overlap ? ' dbl-booked' : ''}" data-visit="${v.id}">
    <div class="times">${start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} patrol${overlap ? ' <span class="dbl-flag">⚠ clash</span>' : ''}</div>
    <div>${esc(v.site_name || '')}${who ? ' · ' + esc(who) : ''}${v.status !== 'SCHEDULED' ? ' · ' + esc(v.status.toLowerCase()) : ''}</div>
  </div>`;
}
function visitPopup(v) {
  modal('Patrol visit', `
    <p><strong>${esc(v.site_name || '')}</strong></p>
    <p class="dim">${esc(new Date(v.scheduled_for).toLocaleString('en-GB'))} · ${esc(v.status)}</p>
    <p>${esc(v.resources.map((r) => r.personnel).filter(Boolean).join(', ') || 'Unassigned')}</p>
    <p class="dim" style="font-size:12px">Read-only here — manage from Patrol schedules.</p>
  `, () => {
    const foot = document.querySelector('#modalHost .foot');
    foot.innerHTML = '<span></span><button class="btn" id="vpClose">Close</button>';
    el('#vpClose').onclick = closeModal;
  });
}
function paintGrid() {
  const v = el('#groupBy').value;
  els('#viewSeg [data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'site') paintGridBySite();
  else if (v === 'list') paintList();
  else paintGridByStaff();
}
els('#viewSeg [data-v]').forEach((b) => (b.onclick = () => { el('#groupBy').value = b.dataset.v; try { localStorage.setItem('cccs.rotaView', b.dataset.v); } catch {} paintGrid(); }));
try { const saved = localStorage.getItem('cccs.rotaView'); el('#groupBy').value = saved || (CCCS.isMobile() ? 'list' : 'staff'); } catch {}
/** One table per day, one row per shift: time, site, type, who, cover —
 * the easiest view to read, and the one that works on a small screen. */
function paintList() {
  const days = weekDays(), today = new Date(), shifts = visibleShifts();
  const t = (iso) => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  let html = '<div class="day-list">';
  for (const d of days) {
    const list = shifts.filter((s) => sameDay(new Date(s.starts_at), d)).sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));
    html += `<h3 class="${sameDay(d, today) ? 'today' : ''}">${DAY_NAMES[d.getDay()]} ${d.getDate()} ${d.toLocaleDateString('en-GB', { month: 'short' })} <span style="text-transform:none;letter-spacing:0;font-weight:400">· ${list.length} shift${list.length === 1 ? '' : 's'}</span></h3>`;
    html += list.length ? `<table><tbody>${list.map((s) => {
      const active = s.assignments.filter((a) => a.status !== 'REMOVED');
      const cover = s.coverage_gap > 0 ? `<span class="coverage-badge gap">${s.assigned_count}/${s.required_headcount} — needs ${s.coverage_gap}</span>` : s.over_staffed ? `<span class="coverage-badge over">${s.assigned_count}/${s.required_headcount}</span>` : `<span class="dim">${s.assigned_count}/${s.required_headcount}</span>`;
      return `<tr data-shift-row="${s.id}" style="${s.status === 'CANCELLED' ? 'opacity:.5;text-decoration:line-through' : ''}">
        <td class="t">${t(s.starts_at)}–${t(s.ends_at)}</td>
        <td><strong>${esc(s.site_name || 'No site')}</strong><div class="dim" style="font-size:12px">${esc(s.shift_type_name || '')}${s.status === 'DRAFT' ? ' · draft' : ''}</div></td>
        <td>${active.map((a) => `${esc(a.personnel_name)}${a.is_duty_supervisor ? ' <span class="dim">(duty sup.)</span>' : ''}${a.on_leave_conflict ? ' <span style="color:var(--priority)">⚠ on leave</span>' : ''}`).join('<br>') || '<span style="color:var(--emergency)">unstaffed</span>'}</td>
        <td style="text-align:right;white-space:nowrap">${cover}</td></tr>`;
    }).join('')}</tbody></table>` : '<p class="dim" style="margin:0 0 4px">Nothing rostered.</p>';
  }
  el('#gridWrap').innerHTML = html + '</div>';
  finishGridPaint(shifts, days, () => ({}));
  els('[data-shift-row]').forEach((r) => (r.onclick = () => shiftModal(allShifts.find((s) => s.id === Number(r.dataset.shiftRow)))));
}
function paintGridByStaff() {
  const days = weekDays();
  const today = new Date();
  const shifts = visibleShifts();
  const rows = allPersonnel.filter((p) => p.employment_status !== 'TERMINATED').sort((a, b) => a.name.localeCompare(b.name));
  let html = `<div class="rota-grid">`;
  html += `<div class="hdr"></div>`;
  for (const d of days) html += `<div class="hdr ${sameDay(d, today) ? 'today' : ''}">${DAY_NAMES[d.getDay()].slice(0, 3)} ${d.getDate()}</div>`;
  for (const p of rows) {
    html += `<div class="person-name">${esc(p.name)}<span class="sub">${esc(p.callsign || p.rank || '')}</span></div>`;
    for (const d of days) {
      const dayShifts = shifts.filter((s) => sameDay(new Date(s.starts_at), d) && s.assignments.some((a) => a.personnel_id === p.id));
      html += `<div class="rota-cell" data-personnel="${p.id}" data-date="${fmtDate(d)}">
        ${dayShifts.map((s) => {
          const a = s.assignments.find((x) => x.personnel_id === p.id);
          // Kept deliberately minimal — time and where, nothing else. Every
          // other detail (coverage, duty sup, draft, leave conflict, patrol
          // requirement) is a click away in the full shift modal, not
          // crammed onto the chip face.
          const badge = s.coverage_gap > 0 ? `<span class="coverage-badge gap">${s.assigned_count}/${s.required_headcount}</span>` : '';
          return `<div class="shift-chip status-${chipStatusClass(s, a)}${a.on_leave_conflict ? ' leave-conflict' : ''}${s.status === 'DRAFT' ? ' draft' : ''}" data-shift="${s.id}" title="${a.on_leave_conflict ? 'This person has approved leave covering this day' : ''}">
          <div class="times">${new Date(s.starts_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}–${new Date(s.ends_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}${badge}</div>
          <div>${esc(s.site_name || s.shift_type_name || '')}</div>
        </div>`;
        }).join('')}
        ${visitsForPersonOnDay(p.id, d).map((v) => visitChipHtml(v, visitOverlapsAny(v, dayShifts))).join('')}
        <span class="add-hint">+ add shift</span>
      </div>`;
    }
  }
  html += `</div>`;
  el('#gridWrap').innerHTML = rows.length ? html : '<p class="dim">No active personnel to schedule.</p>';
  finishGridPaint(shifts, days, (cell) => ({ personnelId: Number(cell.dataset.personnel), date: cell.dataset.date }));
}
/** The site is a property of the shift, not of a person — a person's
 * rows can't be "grouped by site" (they work different sites on
 * different days), so this is a genuinely different axis: one row per
 * site, each cell listing that site's shift(s) that day and who's on
 * them, rather than one row per person with their own shifts. A site
 * with no shifts this week still gets a row — the whole point is seeing
 * gaps, same reasoning the staff view already uses for an unrostered
 * person. */
function paintGridBySite() {
  const days = weekDays();
  const today = new Date();
  const shifts = visibleShifts();
  const siteRows = allSites.slice().sort((a, b) => a.name.localeCompare(b.name)).map((s) => ({ id: s.id, name: s.name }));
  const hasUnsited = shifts.some((s) => !s.site_id && days.some((d) => sameDay(new Date(s.starts_at), d)));
  const rows = hasUnsited ? [...siteRows, { id: null, name: 'No site' }] : siteRows;
  let html = `<div class="rota-grid">`;
  html += `<div class="hdr"></div>`;
  for (const d of days) html += `<div class="hdr ${sameDay(d, today) ? 'today' : ''}">${DAY_NAMES[d.getDay()].slice(0, 3)} ${d.getDate()}</div>`;
  for (const site of rows) {
    html += `<div class="person-name">${esc(site.name)}</div>`;
    for (const d of days) {
      const dayShifts = shifts.filter((s) => sameDay(new Date(s.starts_at), d) && s.site_id === site.id);
      html += `<div class="rota-cell" data-site="${site.id ?? ''}" data-date="${fmtDate(d)}">
        ${dayShifts.map((s) => {
          const active = s.assignments.filter((a) => a.status !== 'REMOVED');
          const names = active.map((a) => a.personnel_name).join(', ') || 'unstaffed';
          const onLeave = active.some((a) => a.on_leave_conflict);
          // Minimal, same as the staff view — time and who, nothing else
          // on the chip face; type, duty sup, draft, patrol requirement
          // all live in the modal behind a click.
          const badge = s.coverage_gap > 0 ? `<span class="coverage-badge gap">${s.assigned_count}/${s.required_headcount}</span>` : '';
          return `<div class="shift-chip${s.status === 'CANCELLED' ? ' status-CANCELLED' : ''}${onLeave ? ' leave-conflict' : ''}${s.status === 'DRAFT' ? ' draft' : ''}" data-shift="${s.id}" title="${onLeave ? 'Someone on this shift has approved leave covering this day' : ''}">
          <div class="times">${new Date(s.starts_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}–${new Date(s.ends_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}${badge}</div>
          <div>${esc(names)}</div>
        </div>`;
        }).join('')}
        ${site.id != null ? visitsForSiteOnDay(site.id, d).map((v) => visitChipHtml(v, visitOverlapsAny(v, dayShifts))).join('') : ''}
        <span class="add-hint">+ add shift</span>
      </div>`;
    }
  }
  html += `</div>`;
  el('#gridWrap').innerHTML = rows.length ? html : '<p class="dim">No sites to schedule.</p>';
  finishGridPaint(shifts, days, (cell) => ({ siteId: cell.dataset.site ? Number(cell.dataset.site) : null, personnelId: allPersonnel[0] && allPersonnel[0].id, date: cell.dataset.date }));
}
/** Shared tail for both grid views: the coverage/draft summary line and
 * the click handlers, which only differ in what an empty cell's "add
 * shift" default should pre-fill. */
function finishGridPaint(shifts, days, defaultsForCell) {
  const inWeek = shifts.filter((s) => days.some((d) => sameDay(new Date(s.starts_at), d)) && s.status !== 'CANCELLED');
  const understaffed = inWeek.filter((s) => s.coverage_gap > 0).length;
  const draftCount = inWeek.filter((s) => s.status === 'DRAFT').length;
  const bits = [];
  if (understaffed) bits.push(`${understaffed} shift${understaffed === 1 ? '' : 's'} need${understaffed === 1 ? 's' : ''} staff`);
  if (draftCount) bits.push(`${draftCount} draft${draftCount === 1 ? '' : 's'} not yet published`);
  el('#coverageSummary').textContent = bits.join(' · ');

  els('.shift-chip').forEach((chip) => chip.addEventListener('click', (e) => {
    e.stopPropagation();
    shiftModal(allShifts.find((s) => s.id === Number(chip.dataset.shift)));
  }));
  els('.visit-chip').forEach((chip) => chip.addEventListener('click', (e) => {
    e.stopPropagation();
    visitPopup(allSiteVisits.find((v) => v.id === Number(chip.dataset.visit)));
  }));
  els('.rota-cell').forEach((cell) => cell.addEventListener('click', () => {
    shiftModal(null, defaultsForCell(cell));
  }));
}

el('#prevWeek').onclick = () => { weekStart.setDate(weekStart.getDate() - 7); load(); };
el('#nextWeek').onclick = () => { weekStart.setDate(weekStart.getDate() + 7); load(); };
el('#thisWeek').onclick = () => { weekStart = startOfWeek(new Date()); load(); };

function shiftForm(s, defaults) {

  // silently discard anything the dispatcher had typed into the top
  // fields (start/end time especially) and not yet saved. reopen() now
  // snapshots those fields before rebuilding and passes them back in as
  // `pr`; every field below prefers that snapshot over the server value.
  const pr = d.preserved || {};
  const startDefault = isNew ? `${d.date}T09:00` : (pr.starts_at || new Date(s.starts_at).toISOString().slice(0, 16));
  const endDefault = isNew ? `${d.date}T17:00` : (pr.ends_at || new Date(s.ends_at).toISOString().slice(0, 16));

  const headcountVal = !isNew && pr.required_headcount != null ? pr.required_headcount : (isNew ? 1 : s.required_headcount);
  const notesVal = !isNew && pr.notes != null ? pr.notes : (isNew ? '' : (s.notes || ''));
  const statusSel = !isNew && pr.status != null ? pr.status : (!isNew ? s.status : null);
  const patrolVal = !isNew && pr.patrol_interval_min != null ? pr.patrol_interval_min : (isNew ? '' : ((s.detail && s.detail.patrol_interval_min) || ''));
  return `
    <form class="stack" id="shForm">
      ${isNew ? `<label>Personnel</label>
      <select id="shPersonnel">${allPersonnel.map((p) => `<option value="${p.id}" ${d.personnelId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : ''}
      <label>Shift type</label>
      <select id="shType">${allShiftTypes.map((t) => `<option value="${t.id}" ${Number(typeIdSel) === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
        ${!isNew && !allShiftTypes.some((t) => t.id === s.shift_type_id) ? `<option value="${s.shift_type_id}" ${Number(typeIdSel) === s.shift_type_id ? 'selected' : ''}>${esc(s.shift_type_name)} (retired)</option>` : ''}</select>
      <label>Site (optional)</label>
      <select id="shSite"><option value="">— none —</option>${allSites.map((x) => `<option value="${x.id}" ${Number(siteIdSel) === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <label>Starts</label>
      <input id="shStart" type="datetime-local" value="${startDefault}">
      <label>Ends</label>
      <input id="shEnd" type="datetime-local" value="${endDefault}">
      <label>Required headcount</label>
      <input id="shHeadcount" type="number" min="1" value="${headcountVal}">
      <label>Patrol requirement (optional)</label>
      <input id="shPatrolMinutes" type="number" min="1" placeholder="e.g. 60 — a checkpoint patrol every hour" value="${esc(patrolVal)}">
      <label>Notes</label>
      <textarea id="shNotes" rows="2">${esc(notesVal)}</textarea>
      ${isNew
        ? `<label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input type="checkbox" id="shDraft"> Create as draft — not shown to staff until published</label>`
        : `<label>Status</label>
      <select id="shStatus">${['DRAFT', 'PUBLISHED', 'IN_PROGRESS', 'COMPLETED', 'CANCELLED'].map((v) => `<option value="${v}" ${statusSel === v ? 'selected' : ''}>${v.replace('_', ' ')}</option>`).join('')}</select>`}
      <p class="dim" id="shError" style="min-height:16px;margin:0"></p>
    </form>`;
}
/** Everyone on the shift — each row acts immediately (not a "Save" field),
 * since adding/removing a person or toggling duty supervisor is its own
 * API call (POST/PATCH a shift_assignment), separate from the shift-level
 * fields shiftForm edits. Kept as its own section so a shift with several

function assignmentsSection(s) {
  const active = s.assignments.filter((a) => a.status !== 'REMOVED');
  const onShiftIds = active.map((a) => a.personnel_id);

  return `

            <span class="dim" style="font-size:11px">${esc(a.status)}${a.clocked_in_at ? ` · ${hm(a.clocked_in_at)}–${a.clocked_out_at ? hm(a.clocked_out_at) : 'now'}` : ''}${a.auto_clocked_out ? ' · auto' : ''}</span>

              <div><label>Clocked out</label><input type="datetime-local" data-t-out value="${localDT(a.clocked_out_at)}"></div>
              <div style="grid-column:1/-1"><label>Reason for the change</label><input data-t-why placeholder="e.g. phone was locked — officer left site at 22:00, confirmed by supervisor"></div>
            </div>
            ${(a.time_edits || []).length ? `<div class="dim" style="margin-top:6px">${a.time_edits.map((e) => `${esc(e.by)}: ${esc(e.reason)}`).join('<br>')}</div>` : ''}
            <button type="button" class="btn primary" data-t-save="${a.id}" style="margin-top:6px;padding:4px 10px;font-size:12px">Save times</button>
          </div>` : ''}`).join('') || '<p class="dim" style="font-size:13px">Nobody assigned yet.</p>'}
      </div>
      ${available.length ? `<div style="display:flex;gap:8px;margin-top:10px">
        <select id="shAddPersonnel" style="flex:1">${available.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        <button type="button" class="btn" id="shAddPerson" style="padding:6px 12px;font-size:12px">Add</button>

      <label style="margin-top:14px">Applications for this shift</label>

    </div>`;
}
/** A vehicle or a non-stock-tracked asset is a physical thing — allocated

          <div style="display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px">
            <span style="flex:1">${esc(v.vehicle_registration)}${v.driver_name ? ' · driver ' + esc(v.driver_name) : ''}</span>

      </div>

        <select id="shVehicleDriver" style="min-width:140px"><option value="">— no driver —</option>${allPersonnel.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        <button type="button" class="btn" id="shAddVehicleBtn" style="padding:6px 12px;font-size:12px">Allocate</button>

      <label style="margin-top:14px">Equipment</label>

      </div>

        <select id="shAddAsset" style="flex:1;min-width:140px">${allAssets.map((a) => `<option value="${a.id}">${esc(a.description)}${a.is_stock_tracked ? ` (${a.stock_level} in stock)` : ''}</option>`).join('')}</select>
        <input id="shAssetQty" type="number" min="1" value="1" style="width:70px">

}
/** Where the shift actually is and what a staff member needs to know to

function siteInfoSection(s) {

async function loadSiteInfo(s) {
  if (!s.site_id || !el('#shSiteInfo')) return;
  try {
    const site = allSites.find((x) => x.id === s.site_id);

    const docLinks = docs.length
      ? docs.map((d) => `<div><a href="/api/documents/${d.id}/file?token=${encodeURIComponent(CCCS.getSession().token)}" target="_blank">${esc(label[d.type] || d.type)}${d.title ? ' — ' + esc(d.title) : ''}</a></div>`).join('')
      : '<div class="dim">No maps, instructions or inductions on file for this site yet.</div>';
    el('#shSiteInfo').innerHTML = `<div>${esc(site && site.address || '')}</div>${docLinks}`;
  } catch (e) { if (el('#shSiteInfo')) el('#shSiteInfo').textContent = 'Failed to load site information.'; }
}

        await reopen();
      } catch (e) { el('#shError').textContent = e.message; }
    };
    els('[data-returnasset]').forEach((b) => (b.onclick = async () => {
      try { await api('PATCH', `/api/shift-asset-allocations/${b.dataset.returnasset}`, {}); await reopen(); }
      catch (e) { el('#shError').textContent = e.message; }
    }));
    el('#shSave').onclick = async () => {
      const patrolMinutes = el('#shPatrolMinutes').value ? Number(el('#shPatrolMinutes').value) : null;
      const body = {
        shift_type_id: Number(el('#shType').value),
        site_id: el('#shSite').value ? Number(el('#shSite').value) : null,
        starts_at: new Date(el('#shStart').value).toISOString(),
        ends_at: new Date(el('#shEnd').value).toISOString(),
        required_headcount: Number(el('#shHeadcount').value) || 1,
        notes: el('#shNotes').value.trim(),
        detail: { ...(s && s.detail), patrol_interval_min: patrolMinutes },
      };
      try {
        if (s) {
          if (el('#shStatus')) body.status = el('#shStatus').value;
          await api('PATCH', `/api/shifts/${s.id}`, body);
        } else {
          body.personnel = Number(el('#shPersonnel').value);
          if (el('#shDraft') && el('#shDraft').checked) body.status = 'DRAFT';
          await api('POST', '/api/shifts', body);
        }
        closeModal(); await load();
      } catch (e) { el('#shError').textContent = e.message; }
    };
  });
}
el('#btnNewShift').onclick = () => shiftModal(null, { personnelId: allPersonnel[0] && allPersonnel[0].id, date: fmtDate(new Date()) });

el('#btnPublishDrafts').onclick = async () => {
  const days = weekDays();
  const drafts = visibleShifts().filter((s) => s.status === 'DRAFT' && days.some((d) => sameDay(new Date(s.starts_at), d)));
  if (!drafts.length) { alert('No drafts in the current view.'); return; }
  if (!confirm(`Publish ${drafts.length} draft shift${drafts.length === 1 ? '' : 's'}?`)) return;
  for (const s of drafts) await api('PATCH', `/api/shifts/${s.id}`, { status: 'PUBLISHED' });
  await load();
};

/** Copies every (non-cancelled) shift in the current view N weeks ahead,
 * including its active assignees — the same core team usually covers a
 * recurring week, so re-staffing from scratch would be the common case to
 * avoid, not the default to design for. Lands as DRAFT, not published: a
 * bulk copy is exactly the moment someone's left, a date needs nudging, or
 * a site has changed, so it is reviewed via "Publish drafts" rather than
 * notifying everyone immediately. */
el('#btnDuplicateWeek').onclick = async () => {
  const weeksStr = prompt('Duplicate the shifts in view how many weeks forward?', '1');
  const weeks = Number(weeksStr);
  if (!weeksStr || !Number.isFinite(weeks) || weeks < 1) return;
  const days = weekDays();
  const source = visibleShifts().filter((s) => s.status !== 'CANCELLED' && days.some((d) => sameDay(new Date(s.starts_at), d)));
  if (!source.length) { alert('No shifts in the current view to duplicate.'); return; }
  if (!confirm(`Duplicate ${source.length} shift${source.length === 1 ? '' : 's'} ${weeks} week${weeks === 1 ? '' : 's'} forward, as drafts?`)) return;
  const shiftMs = weeks * 7 * 86400000;
  for (const s of source) {
    const created = await api('POST', '/api/shifts', {
      site_id: s.site_id, shift_type_id: s.shift_type_id,
      starts_at: new Date(Date.parse(s.starts_at) + shiftMs).toISOString(),
      ends_at: new Date(Date.parse(s.ends_at) + shiftMs).toISOString(),
      break_minutes: s.break_minutes, required_headcount: s.required_headcount,
      pay_rate: s.pay_rate, bill_rate: s.bill_rate, uniform_ppe: s.uniform_ppe, briefing: s.briefing,
      detail: s.detail, notes: s.notes, status: 'DRAFT',
    });
    for (const a of s.assignments.filter((x) => ['ASSIGNED', 'CONFIRMED'].includes(x.status))) {
      await api('POST', `/api/shifts/${created.id}/assignments`, { personnel: a.personnel_id, role_on_shift: a.role_on_shift, is_duty_supervisor: a.is_duty_supervisor });
    }
  }
  await load();
};

el('#btnCalSync').onclick = () => CCCS.calendarSync();

CCCS.bus((up) => {
  const n = el('#net');
  if (n) { n.textContent = up ? 'link up' : 'link down'; n.classList.toggle('up', up); }
});

load();
</script>
</body>
