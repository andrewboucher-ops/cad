<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — quotes &amp; contracts</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<style>
  .lines td { padding: 4px; }
  .lines input, .lines select { width: 100%; font-size: 13px; padding: 6px 7px; }
  .est { font-size: 13px; margin: 8px 0 0; }
  .note { font-size: 12.5px; }
  @media (max-width: 640px) { .lines thead { display: none; } .lines tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border-bottom: 1px solid var(--line); padding: 6px 0; } .lines td:first-child { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="k-top">
  <h1>Quotes &amp; contracts</h1>
  <span class="dim" id="updated"></span>
  <button class="btn primary" id="bQuote">New quote</button>
  <button class="btn" id="bContract">New contract</button>
  <button class="btn" id="bTerms">Contract terms</button>
  <a class="btn" href="/invoices.html">Invoices</a>
</div>
<div class="k-body">
  <div class="tiles" id="tiles"></div>
  <div class="bar">
    <span id="chips"></span>
    <select id="fSite"></select>
    <input id="q" placeholder="Search reference or title">
  </div>
  <div id="main"><p class="dim">Loading…</p></div>
</div>

<script src="/app.js"></script>
<script src="/nav.js"></script>
<script src="/kit-ui.js"></script>
<script>
'use strict';
const { api, el, els, esc } = CCCS;
if (!CCCS.requireAuth(['SYSTEM_ADMIN'])) throw new Error('auth');
const { modal, close, foot, wire, v, money, date, when, options } = KIT;
const token = () => encodeURIComponent(CCCS.getSession().token);
const STATUS = {
  DRAFT: ['Draft', 'off'], SENT: ['Waiting for client', 'warn'], ACCEPTED: ['Accepted', 'ok'], DECLINED: ['Declined', 'bad'],
  EXPIRED: ['Expired', 'off'], WITHDRAWN: ['Withdrawn', 'off'], SIGNED: ['Signed — live', 'ok'], ENDED: ['Ended', 'off'],
};
const KINDS = [['HOURLY', 'Per hour'], ['FIXED_PERIOD', 'Fixed each invoice'], ['ONE_OFF', 'One-off']];
const params = new URLSearchParams(location.search);
let rows = [], sites = [], clients = [], shiftTypes = [], filter = 'open';

async function load() {
  try {
    [rows, sites, clients, shiftTypes] = await Promise.all([api('GET', '/api/agreements'), api('GET', '/api/sites'), api('GET', '/api/clients'), api('GET', '/api/shift-types').catch(() => [])]);
  } catch (e) { el('#main').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const keep = el('#fSite').value || params.get('site_id') || '';
  el('#fSite').innerHTML = options(sites.map((s) => [s.id, s.name]), keep, 'All sites');
  el('#updated').textContent = `updated ${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
  paint();
  if (params.get('new')) { const k = params.get('new') === 'CONTRACT' ? 'CONTRACT' : 'QUOTE'; params.delete('new'); history.replaceState(null, '', `?${params}`); editor(null, Number(params.get('site_id')) || null, k); }
  if (params.get('id')) { const a = rows.find((x) => x.id === Number(params.get('id'))); params.delete('id'); if (a) view(a); }
}
const clientOf = (siteId) => clients.find((c) => (c.site_ids || []).includes(Number(siteId)));
function paint() {
  const t = (n, l, cls, f) => `<button class="tile ${cls}" data-f="${f}"><div class="n">${n}</div><div class="l">${l}</div></button>`;
  const waiting = rows.filter((a) => a.status === 'SENT');
  el('#tiles').innerHTML = [
    t(rows.filter((a) => a.status === 'DRAFT').length, 'Drafts', '', 'draft'),
    t(waiting.length, 'Waiting for client', waiting.length ? 'warn' : '', 'waiting'),
    t(rows.filter((a) => a.kind === 'QUOTE' && a.status === 'ACCEPTED').length, 'Quotes accepted', 'good', 'accepted'),
    t(rows.filter((a) => a.status === 'SIGNED').length, 'Live contracts', 'good', 'live'),
  ].join('');
  const F = {
    open: ['Open', (a) => ['DRAFT', 'SENT', 'ACCEPTED', 'SIGNED'].includes(a.status)], draft: ['Drafts', (a) => a.status === 'DRAFT'], waiting: ['Waiting', (a) => a.status === 'SENT'],
    accepted: ['Accepted quotes', (a) => a.kind === 'QUOTE' && a.status === 'ACCEPTED'], live: ['Live contracts', (a) => a.status === 'SIGNED'], all: ['All', () => true],
  };
  el('#chips').innerHTML = Object.entries(F).map(([k, [l]]) => `<button class="chip ${k === filter ? 'on' : ''}" data-f="${k}">${l}</button>`).join(' ');
  els('[data-f]').forEach((b) => (b.onclick = () => { filter = b.dataset.f; paint(); }));
  const site = Number(el('#fSite').value) || null, q = el('#q').value.trim().toLowerCase();
  const list = rows.filter(F[filter][1]).filter((a) => (!site || a.site_id === site) && (!q || `${a.reference} ${a.title}`.toLowerCase().includes(q)));
  el('#main').innerHTML = list.length ? `<div style="overflow-x:auto"><table class="k">
    <thead><tr><th>Reference</th><th>Site</th><th>Title</th><th class="num">Est. per period</th><th>Dates</th><th>Status</th></tr></thead>
    <tbody>${list.map((a) => {
      const [sl, sc] = STATUS[a.status] || [a.status, 'off'];
      return `<tr data-open="${a.id}" style="cursor:pointer">
        <td class="mono" style="white-space:nowrap"><strong>${esc(a.reference)}</strong><div class="dim" style="font-size:11px">${a.kind === 'QUOTE' ? 'Quote' : 'Contract'}</div></td>
        <td>${esc(a.site_name || '—')}</td><td>${esc(a.title)}</td>
        <td class="num">${money(a.estimate.per_period)}<div class="dim" style="font-size:11px">${a.invoice_period === 'WEEKLY' ? 'a week' : 'a month'} + VAT</div></td>
        <td class="dim" style="white-space:nowrap;font-size:12.5px">${a.kind === 'QUOTE' ? `valid to ${esc(date(a.valid_until))}` : `${esc(date(a.start_date))} → ${a.end_date ? esc(date(a.end_date)) : 'ongoing'}`}</td>
        <td><span class="pill ${sc}">${sl}</span></td></tr>`;
    }).join('')}</tbody></table></div>`
    : `<p class="dim">${rows.length ? 'Nothing matches.' : 'No quotes or contracts yet. Press <strong>New quote</strong> to price up a site; when the client accepts it, turn it into a contract for them to sign.'}</p>`;
  els('[data-open]').forEach((r) => (r.onclick = () => view(rows.find((a) => a.id === Number(r.dataset.open)))));
}
el('#q').addEventListener('input', paint);
el('#fSite').addEventListener('change', paint);

/* ---------- editor ---------- */
function lineRow(l = {}) {
  return `<tr data-line>
    <td style="min-width:200px"><input data-k="description" value="${esc(l.description || '')}" placeholder="e.g. Static guarding"></td>
    <td><select data-k="kind">${options(KINDS, l.kind || 'HOURLY')}</select></td>
    <td style="width:95px"><input data-k="rate" type="number" min="0" step="0.01" value="${l.rate ?? ''}" placeholder="£"></td>
    <td style="width:85px"><input data-k="est_quantity" type="number" min="0" step="0.5" value="${l.est_quantity ?? ''}" placeholder="hrs"></td>
    <td><select data-k="shift_type_id">${options(shiftTypes.map((t) => [t.id, t.name]), l.shift_type_id, 'All shifts')}</select></td>
    <td><button type="button" class="btn" data-del style="padding:4px 9px">✕</button></td></tr>`;
}
function editor(a, siteId, kind) {
  a = a || { kind, site_id: siteId, lines: [{ kind: 'HOURLY' }], billing_basis: 'HOURS_WORKED', invoice_period: 'MONTHLY', vat_rate: 20, payment_terms_days: 30 };
  const isQ = a.kind === 'QUOTE';
  const c = clientOf(a.site_id);
  modal(`${a.id ? 'Edit' : 'New'} ${isQ ? 'quote' : 'contract'}${a.reference ? ` — ${a.reference}` : ''}`, `<div class="k-form">
    <div><label>Site</label><select id="eSite" ${a.id ? 'disabled' : ''}>${options(sites.map((s) => [s.id, s.name]), a.site_id, '— choose site —')}</select></div>
    <div><label>Client</label><div id="eClient" class="note" style="padding-top:8px">${c ? esc(c.name) : '<span class="err">not linked to a client yet</span>'}</div></div>
    <div class="full"><label>Title</label><input id="eTitle" value="${esc(a.title || '')}" placeholder="${isQ ? 'Quotation' : 'Contract'} — site name"></div>
    ${isQ ? `<div><label>Valid until</label><input id="eValid" type="date" value="${esc(a.valid_until || new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10))}"></div><div></div>`
      : `<div><label>Starts</label><input id="eStart" type="date" value="${esc(a.start_date || new Date().toISOString().slice(0, 10))}"></div>
         <div><label>Ends (blank = ongoing)</label><input id="eEnd" type="date" value="${esc(a.end_date || '')}"></div>`}
    <div class="k-section">Charges</div>
    <div class="full" style="overflow-x:auto"><table class="k lines"><thead><tr><th>Description</th><th>Charged</th><th>Rate £</th><th>Est. hrs</th><th>Shift type</th><th></th></tr></thead>
      <tbody id="eLines">${a.lines.map(lineRow).join('')}</tbody></table>
      <button type="button" class="btn" id="eAdd" style="margin-top:6px">Add line</button>
      <p class="est" id="eEst"></p>
      <p class="dim note">"Per hour" lines are invoiced on the hours at this site (only the chosen shift type, if one is picked). "Est. hrs" is per ${'invoice period'} and is only an estimate for the client.</p></div>
    <div class="k-section">Billing</div>
    <div><label>Hours charged on</label><select id="eBasis">${options([['HOURS_WORKED', 'Hours worked (clocked in/out)'], ['ROSTERED', 'Hours rostered']], a.billing_basis)}</select></div>
    <div><label>Invoiced</label><select id="ePeriod">${options([['MONTHLY', 'Monthly'], ['WEEKLY', 'Weekly']], a.invoice_period)}</select></div>
    <div><label>VAT %</label><input id="eVat" type="number" min="0" max="100" step="0.5" value="${a.vat_rate}"></div>
    <div><label>Payment terms (days)</label><input id="eTerms" type="number" min="0" max="180" value="${a.payment_terms_days}"></div>
    <div class="full"><label>Notes shown to the client</label><textarea id="eNotes" rows="2">${esc(a.notes || '')}</textarea></div>
    <div class="full"><label>Internal notes (never shown to the client)</label><textarea id="eInt" rows="2">${esc(a.internal_notes || '')}</textarea></div>
  </div>${foot(a.id ? 'Save draft' : 'Save as draft', '<button type="button" class="btn primary" id="eSend">Save &amp; send to client</button>')}`, (root) => {
    const recalc = () => {
      let p = 0, o = 0;
      root.querySelectorAll('[data-line]').forEach((tr) => {
        const g = (k) => tr.querySelector(`[data-k="${k}"]`).value, rate = Number(g('rate')) || 0;
        tr.querySelector('[data-k="est_quantity"]').disabled = tr.querySelector('[data-k="shift_type_id"]').disabled = g('kind') !== 'HOURLY';
        if (g('kind') === 'HOURLY') p += rate * (Number(g('est_quantity')) || 0); else if (g('kind') === 'FIXED_PERIOD') p += rate; else o += rate;
      });
      root.querySelector('#eEst').innerHTML = `Estimated <strong>${money(p)}</strong> per ${root.querySelector('#ePeriod').value === 'WEEKLY' ? 'week' : 'month'} + VAT${o ? `, plus one-off ${money(o)}` : ''}.`;
    };
    const bind = () => { root.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => { b.closest('tr').remove(); recalc(); })); recalc(); };
    root.addEventListener('input', recalc); root.addEventListener('change', recalc);
    root.querySelector('#eAdd').onclick = () => { root.querySelector('#eLines').insertAdjacentHTML('beforeend', lineRow({ kind: 'HOURLY' })); bind(); };
    root.querySelector('#eSite').onchange = () => { const cl = clientOf(root.querySelector('#eSite').value); root.querySelector('#eClient').innerHTML = cl ? esc(cl.name) : '<span class="err">not linked to a client yet</span>'; };
    bind();
    const save = async () => {
      const lines = [...root.querySelectorAll('[data-line]')].map((tr) => {
        const g = (k) => tr.querySelector(`[data-k="${k}"]`).value.trim();
        return { description: g('description'), kind: g('kind'), rate: g('rate') === '' ? NaN : Number(g('rate')), est_quantity: g('est_quantity'), shift_type_id: g('shift_type_id') || null };
      }).filter((l) => l.description || !Number.isNaN(l.rate));
      const body = {
        title: v(root, '#eTitle') || undefined, lines, billing_basis: v(root, '#eBasis'), invoice_period: v(root, '#ePeriod'),
        vat_rate: Number(v(root, '#eVat')), payment_terms_days: Number(v(root, '#eTerms')), notes: root.querySelector('#eNotes').value, internal_notes: root.querySelector('#eInt').value,
        ...(isQ ? { valid_until: v(root, '#eValid') } : { start_date: v(root, '#eStart'), end_date: v(root, '#eEnd') || null }),
      };
      let saved;
      if (a.id) saved = await api('PATCH', `/api/agreements/${a.id}`, body);
      else {
        if (!v(root, '#eSite')) throw new Error('choose the site');
        saved = await api('POST', '/api/agreements', { ...body, kind: a.kind, site_id: Number(v(root, '#eSite')) });
        a = saved; // a second press edits this draft rather than making another
      }
      return saved;
    };
    wire(root, async () => { const saved = await save(); close(); await load(); view(rows.find((x) => x.id === saved.id)); });
    root.querySelector('#eSend').onclick = async () => {
      const err = root.querySelector('[data-k-err]'); err.textContent = '';
      try {
        const saved = await save();
        const cl = clientOf(saved.site_id);
        if (!confirm(`Send ${saved.reference} to ${cl ? cl.name : 'the client'}? It is emailed to them with the PDF and appears in their portal. It can't be edited after.`)) { close(); await load(); view(rows.find((x) => x.id === saved.id)); return; }
        await api('POST', `/api/agreements/${saved.id}/send`);
        close(); await new Promise((r) => setTimeout(r, 800)); await load(); view(rows.find((x) => x.id === saved.id));
      } catch (e) { err.textContent = e.message; }
    };
  }, { wide: true });
}
el('#bQuote').onclick = () => editor(null, Number(el('#fSite').value) || null, 'QUOTE');
el('#bContract').onclick = () => editor(null, Number(el('#fSite').value) || null, 'CONTRACT');

/* ---------- view ---------- */
function view(a) {
  if (!a) return;
  const [sl, sc] = STATUS[a.status] || [a.status, 'off'];
  const c = clients.find((x) => x.id === a.client_id) || clientOf(a.site_id);
  const act = (id, label, cls = '') => `<button class="btn ${cls}" data-a="${id}">${label}</button>`;
  const acts = [];
  if (a.status === 'DRAFT') acts.push(act('edit', 'Edit'), act('del', 'Delete'), act('send', `Send to client`, 'primary'));
  if (a.status === 'SENT') acts.push(act('withdraw', 'Withdraw'));
  if (['SENT', 'ACCEPTED', 'SIGNED'].includes(a.status)) acts.push(act('email', 'Email again'));
  if (a.kind === 'QUOTE' && a.status === 'ACCEPTED' && !rows.some((x) => x.from_quote_id === a.id && x.status !== 'WITHDRAWN')) acts.push(act('convert', 'Make contract from this quote', 'primary'));
  if (a.status === 'SIGNED') acts.push(act('end', 'End contract'), `<a class="btn primary" href="/invoices.html?contract_id=${a.id}">Invoices</a>`);
  if (a.pdf_url && a.status !== 'DRAFT') acts.push(`<a class="btn" target="_blank" href="${a.pdf_url}?token=${token()}">PDF</a>`);
  const made = rows.find((x) => x.from_quote_id === a.id);
  modal(`${a.kind === 'QUOTE' ? 'Quote' : 'Contract'} ${a.reference}`, `
    <p style="margin-top:0"><span class="pill ${sc}">${sl}</span> <strong>${esc(a.title)}</strong></p>
    <div class="k-form note">
      <div><label>Site</label>${esc(a.site_name || '—')}</div><div><label>Client</label>${c ? esc(c.name) : '<span class="err">no client linked to this site</span>'}</div>
      ${a.kind === 'QUOTE' ? `<div><label>Valid until</label>${esc(date(a.valid_until))}</div><div></div>` : `<div><label>Starts</label>${esc(date(a.start_date))}</div><div><label>Ends</label>${a.end_date ? esc(date(a.end_date)) : 'ongoing'}</div>`}
      <div><label>Hours charged on</label>${a.billing_basis === 'ROSTERED' ? 'hours rostered' : 'hours worked'}</div><div><label>Invoiced</label>${a.invoice_period === 'WEEKLY' ? 'weekly' : 'monthly'}, ${a.payment_terms_days} days, VAT ${a.vat_rate}%</div>
    </div>
    <table class="k" style="margin-top:10px"><thead><tr><th>Line</th><th>Charged</th><th class="num">Rate</th><th class="num">Est.</th></tr></thead><tbody>
      ${a.lines.map((l) => `<tr><td>${esc(l.description)}${l.shift_type_name ? ` <span class="dim">(${esc(l.shift_type_name)})</span>` : ''}</td><td>${(KINDS.find((k) => k[0] === l.kind) || [, l.kind])[1]}</td><td class="num">${money(l.rate)}</td><td class="num">${l.kind === 'HOURLY' && l.est_quantity != null ? `${l.est_quantity} h` : ''}</td></tr>`).join('')}
    </tbody></table>
    <p class="est">Estimated ${money(a.estimate.per_period)} per ${a.invoice_period === 'WEEKLY' ? 'week' : 'month'} + VAT${a.estimate.one_off ? `, one-off ${money(a.estimate.one_off)}` : ''}.</p>
    ${a.status === 'DECLINED' && a.decline_reason ? `<p class="note"><strong>Client's reason:</strong> ${esc(a.decline_reason)}</p>` : ''}
    ${a.status === 'SIGNED' ? `<p class="note">Signed by <strong>${esc(a.signed_name)}</strong>${a.signed_position ? `, ${esc(a.signed_position)}` : ''} on ${esc(when(a.signed_at))}.</p>` : ''}
    ${(a.emails || []).length ? `<p class="note">${a.emails.map((e) => e.ok ? `✓ ${esc({ SENT: 'Sent', ACCEPTED: 'Acceptance confirmation', SIGNED: 'Signed copy' }[e.kind] || e.kind)} emailed to ${esc(e.to)} ${esc(when(e.at))}` : `<span class="err">✕ Not emailed${e.to ? ` to ${esc(e.to)}` : ''}: ${esc(e.error || 'failed')}</span>`).join('<br>')}</p>` : ''}
    ${made ? `<p class="note">Contract <a href="#" data-goto="${made.id}">${esc(made.reference)}</a> was made from this quote.</p>` : ''}
    ${a.internal_notes ? `<p class="note dim"><strong>Internal:</strong> ${esc(a.internal_notes)}</p>` : ''}
    <details style="margin-top:8px"><summary class="dim note">History</summary><ul class="tl">${(a.history || []).slice().reverse().map((h) => `<li><span class="when">${esc(when(h.at))}</span> — ${esc(h.what)} <span class="dim">(${esc(h.by)})</span></li>`).join('')}</ul></details>
    <p class="err" id="vErr"></p>
    <div class="btn-row" style="justify-content:flex-end;flex-wrap:wrap;margin-top:8px">${acts.join('')}<button class="btn" data-a="close">Close</button></div>`, (root) => {
    const err = root.querySelector('#vErr');
    const run = async (fn) => { err.textContent = ''; try { await fn(); } catch (e) { err.textContent = e.message; } };
    root.querySelectorAll('[data-goto]').forEach((x) => (x.onclick = (e) => { e.preventDefault(); view(rows.find((r) => r.id === Number(x.dataset.goto))); }));
    root.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => run(async () => {
      const k = b.dataset.a;
      if (k === 'close') return close();
      if (k === 'edit') return editor(a);
      let out;
      if (k === 'del') { if (!confirm('Delete this draft?')) return; await api('DELETE', `/api/agreements/${a.id}`); close(); return load(); }
      if (k === 'send') { if (!confirm(`Send ${a.reference} to ${c ? c.name : 'the client'}? It appears in their portal and they are emailed. It can't be edited after.`)) return; out = await api('POST', `/api/agreements/${a.id}/send`); }
      if (k === 'withdraw') { const reason = prompt('Why is it being withdrawn? (optional)'); if (reason === null) return; out = await api('POST', `/api/agreements/${a.id}/withdraw`, { reason }); }
      if (k === 'email') { if (!confirm('Email it to the client again, with the PDF?')) return; out = await api('POST', `/api/agreements/${a.id}/email`); await new Promise((r) => setTimeout(r, 800)); }
      if (k === 'convert') out = await api('POST', `/api/agreements/${a.id}/convert`);
      if (k === 'end') { const d = prompt('Last day of the contract (YYYY-MM-DD)', new Date().toISOString().slice(0, 10)); if (!d) return; out = await api('POST', `/api/agreements/${a.id}/end`, { end_date: d }); }
      await load(); view(rows.find((x) => x.id === out.id));
    })));
  }, { wide: true });
}

el('#bTerms').onclick = async () => {
  const s = await api('GET', '/api/agreements/settings');
  modal('Contract terms', `<p class="note" style="margin-top:0">These go on every contract when it is sent. Contracts already sent keep the wording they were sent with. Company name and address come from Rentals → Terms &amp; company details. Have the wording checked before relying on it.</p>
    <textarea id="tT" rows="18" style="width:100%;font-size:13px">${esc(s.terms)}</textarea>${foot('Save', '<button type="button" class="btn" id="tReset">Use standard wording</button>')}`, (root) => {
    root.querySelector('#tReset').onclick = () => { root.querySelector('#tT').value = s.default; };
    wire(root, async () => { await api('PUT', '/api/agreements/settings', { terms: root.querySelector('#tT').value }); close(); });
  }, { wide: true });
};

load();
</script>
</body>
</html>
