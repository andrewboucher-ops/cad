<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — radio terminal</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCCS Radio">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<style>
  body { display: grid; place-items: start center; min-height: 100vh; padding: 12px; }
  .handset { width: min(380px, 100%); display: flex; flex-direction: column; gap: 10px; }

  /* ---- top bar: logo is press-and-hold for settings, matching the
     physical handset's minimal button count (no visible Settings key) ---- */
  .r-topbar {
    display: flex; align-items: center; justify-content: center; gap: 10px; position: relative;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  .r-logo {
    font-weight: 700; letter-spacing: .14em; font-size: 15px; padding: 4px 10px; border-radius: 5px;
    background: var(--panel-2); user-select: none; -webkit-user-select: none; cursor: pointer;
  }
  .r-logo:active { background: var(--panel-3); }
  .r-topbar .wifi { color: var(--available); }
  .r-topbar .battery { color: var(--ink-dim); }
  .r-topbar .side { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .r-topbar .side.left { position: absolute; left: 10px; }
  .r-topbar .side.right { position: absolute; right: 10px; }

  /* ---- the 6-button grid: User / Cads / Rpt / Text / Chan / AVL ---- */
  .r-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .r-grid button {
    padding: 14px 6px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 13px;
  }
  .r-grid button.pulsing { animation: r-breathe 2.6s ease-in-out infinite; }
  @keyframes r-breathe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(.72); } }
  @media (prefers-reduced-motion: reduce) { .r-grid button.pulsing { animation: none; } }

  .r-channel { text-align: center; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }

  /* ---- the PTT bar itself: ISSI in white above it, call sign inside it,
     blue idle / green receiving / red transmitting ---- */
  .r-issi { text-align: center; font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: #fff; }
  .r-pttbar {
    width: 100%; height: 100px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(180deg, #2f6fed, #1d4ed8); color: #fff;
    font-family: var(--mono); font-size: 28px; font-weight: 700; letter-spacing: .1em;
    touch-action: none; user-select: none; transition: background .1s ease;
  }
  .r-pttbar.rx { background: linear-gradient(180deg, #22c55e, #15803d); }
  .r-pttbar.tx { background: linear-gradient(180deg, #ef4444, #b91c1c); }
  .r-pttbar:disabled { opacity: .5; }

  .emg { width: 100%; height: 54px; font-size: 16px; letter-spacing: .14em; }
  .incoming { border: 2px solid var(--emergency); border-radius: 6px; padding: 14px; background: #2a1113; }
  .jobcard { border-left: 3px solid var(--priority); padding: 10px 12px; background: var(--panel-2); border-radius: 3px; }
  .lock-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(6, 10, 16, .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 24px; touch-action: none; user-select: none;
  }
  .lock-overlay .big { font-family: var(--mono); font-size: 26px; letter-spacing: .12em; }
  .lock-overlay .hint { color: var(--ink-dim); max-width: 300px; }
  .lock-overlay .live { color: var(--emergency); font-family: var(--mono); }
  .lock-overlay .ptt {
    height: 78px; font-size: 16px; border-radius: 8px; background: #123a2a; border: 2px solid #15803d;
    color: #bbf7d0; touch-action: none; user-select: none;
  }
  .lock-overlay .ptt.tx { background: #4c1113; border-color: #ef4444; color: #fecaca; }
  .msgline { font-family: var(--mono); font-size: 12px; border-bottom: 1px solid rgba(34,49,69,.5); padding: 3px 0; }
</style>
</head>
<body>
<div class="handset">
  <div class="r-topbar">
    <span class="side left"><svg class="wifi" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M2 8.5a16 16 0 0120 0M5.5 12.5a11 11 0 0113 0M9 16.5a5.5 5.5 0 016 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="20" r="1.4" fill="currentColor"/></svg> <span class="link-net" id="net">link down</span></span>
    <span class="r-logo" id="rlogo" title="Press and hold for settings">RADIO</span>
    <span class="side right"><button id="audioBlocked" hidden title="Audio was blocked by the browser — tap to enable it" style="background:none;border:none;color:var(--priority);font-size:15px;padding:0">🔇</button><span class="mono dim" id="pending" style="font-size:10px"></span><span class="mono" id="queued" style="font-size:10px;color:var(--busy)"></span></span>
  </div>

  <div class="r-grid">
    <button class="btn" id="bUser">User</button>
    <button class="btn" id="bCads">Cads</button>
    <button class="btn" id="bRpt">Rpt</button>
    <button class="btn" id="bText">Text</button>
    <button class="btn" id="bChan">Chan</button>
    <button class="btn" id="bAvl"><div id="bAvlStatus"></div></button>
  </div>

  <div class="r-channel" id="tg">no talkgroup</div>
  <div class="dim mono" style="font-size:12px;text-align:center" id="welfare"></div>
  <div class="dim mono" style="font-size:11px;text-align:center" id="covertFlag"></div>

  <div id="alertHost"></div>

  <div class="r-issi" id="issi">ISSI ----</div>
  <button class="r-pttbar" id="ptt"><span id="cs">----</span></button>

  <button class="btn danger emg" id="bEmg">EMERGENCY</button>

  <section class="panel"><header>Radio log</header><div class="body log" id="log" style="max-height:190px"></div></section>
</div>

<div id="modalHost"></div>
<div id="lockHost"></div>

<div id="satnav" class="hide" style="position:fixed;inset:0;z-index:900;background:#000;display:flex;flex-direction:column">
  <div id="satnavMap" style="flex:1;min-height:0"></div>
  <div style="background:#0d1218;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;border-top:2px solid #1d4ed8">
    <span id="satnavIcon" style="font-size:30px;line-height:1">⬆️</span>
    <div style="flex:1;min-width:0">
      <div id="satnavDistance" style="font-size:22px;font-weight:700">—</div>
      <div id="satnavText" class="dim" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Getting your position…</div>
    </div>
    <button class="btn" id="satnavMute" title="Mute voice prompts">🔊</button>
    <button class="btn danger" id="satnavExit">Exit</button>
  </div>
  <div id="satnavSummary" class="dim mono" style="text-align:center;background:#0d1218;color:#9ca3af;font-size:12px;padding:0 0 8px"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="/app.js"></script>
<script>
const { api, el, esc } = CCCS;
if (!CCCS.requireAuth(['RADIO_USER', 'DISPATCHER', 'SUPERVISOR', 'SYSTEM_ADMIN'])) throw new Error('auth');
const me = CCCS.getSession().user;

const qIssi = new URLSearchParams(location.search).get('issi');
let radio = null, currentCall = null, currentJob = null, txing = false;
const log = (line) => {
  const d = document.createElement('div');
  d.innerHTML = `<span class="t">${CCCS.hhmmss()}</span>${esc(line)}`;
  el('#log').prepend(d);
};

const AVL_COLOUR = {
  AVAILABLE: 'linear-gradient(180deg,#22c55e,#15803d)', BUSY: 'linear-gradient(180deg,#eab308,#a16207)',
  MEAL_BREAK: 'linear-gradient(180deg,#eab308,#a16207)', ACKNOWLEDGED: 'linear-gradient(180deg,#3b82f6,#1d4ed8)',
  ON_TASK: 'linear-gradient(180deg,#3b82f6,#1d4ed8)', EN_ROUTE: 'linear-gradient(180deg,#3b82f6,#1d4ed8)',
  ON_SCENE: 'linear-gradient(180deg,#3b82f6,#1d4ed8)', OUT_OF_SERVICE: '', OFFLINE: '',
};
function paint() {
  if (!radio) return;
  el('#issi').textContent = `ISSI ${radio.issi}`;
  el('#cs').textContent = radio.callsign || radio.issi;
  el('#tg').textContent = radio.talkgroup || 'no talkgroup';
  el('#ptt').disabled = !radio.talkgroup;
  const avl = el('#bAvl');
  avl.style.background = AVL_COLOUR[radio.status] || '';
  avl.classList.toggle('pulsing', !['OFFLINE', 'OUT_OF_SERVICE'].includes(radio.status));
  // The button used to always read the static label "AVL" with the status
  // as a subtitle underneath; now that a real status is always shown, the
  // fixed "AVL" text is redundant — just show the status itself.
  el('#bAvlStatus').textContent = radio.emergency ? 'EMERGENCY' : (radio.status || '').replace('_', ' ');
  ensureLocationTracking();
}

function modal(title, html, onMount) {
  el('#modalHost').innerHTML = `<div class="modal-back"><div class="modal"><h2>${esc(title)}</h2><div class="content">${html}</div><div class="foot"><button class="btn" id="mClose">Close</button></div></div></div>`;
  el('#mClose').onclick = closeModal; onMount && onMount();
}
const closeModal = () => (el('#modalHost').innerHTML = '');

/* ---- actions ---- */
el('#bAvl').onclick = () => modal('Change status', `
  <label for="sSel">Operational status</label>
  <select id="sSel">${['AVAILABLE', 'BUSY', 'ON_TASK', 'EN_ROUTE', 'ON_SCENE', 'MEAL_BREAK', 'OUT_OF_SERVICE'].map((s) => `<option ${radio.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
  <div style="height:12px"></div><button class="btn primary" id="sGo">Set status</button>`, () => {
  el('#sGo').onclick = async () => {
    const r = await CCCS.send('POST', `/api/radios/${radio.issi}/status`, { status: el('#sSel').value }, 'status change');
    if (r.queued) { radio.status = el('#sSel').value; paint(); log(`STATUS ${radio.status} QUEUED — WILL SEND WHEN LINK RETURNS`); }
    closeModal();
  };
});

/* User: identity is fixed per handset (ISSI is hard-set), so this is a
 * "more" hub for the less-frequent functions rather than a real user
 * switcher — private call, position, welfare, lock, dial, settings. */
el('#bUser').onclick = () => modal('More', `
  <p class="dim" style="margin:0 0 10px">${esc(radio.callsign || radio.issi)} · ISSI ${esc(radio.issi)}</p>
  <div class="btn-row" style="flex-direction:column;align-items:stretch;gap:8px">
    <button class="btn" id="muPrivate">Private call</button>
    <button class="btn" id="muDial">Dial an outside number</button>
    <button class="btn" id="muPos">Position</button>
    <button class="btn" id="muWelfare">Welfare timer</button>
    <button class="btn" id="muCallReq">Request call</button>
    <button class="btn" id="muPriReq">Priority call</button>
    <button class="btn" id="muLock">Lock keypad</button>
    <button class="btn" id="muStatusCode">Status code</button>
    <button class="btn" id="muCovert">Covert mode</button>
    <button class="btn" id="muSettings">Settings</button>
  </div>`, () => {
  el('#muPrivate').onclick = () => { closeModal(); openPrivateCall(); };
  el('#muDial').onclick = () => { closeModal(); openDial(); };
  el('#muPos').onclick = () => { closeModal(); openPosition(); };
  el('#muWelfare').onclick = () => { closeModal(); openWelfare(); };
  el('#muCallReq').onclick = () => { closeModal(); requestCall(false, 'menu'); };
  el('#muPriReq').onclick = () => { closeModal(); if (confirm('Send a PRIORITY call request to control?')) requestCall(true, 'menu'); };
  el('#muLock').onclick = () => { closeModal(); setLocked(true); };
  el('#muStatusCode').onclick = () => { closeModal(); statusCodeMenu(); };
  el('#muCovert').onclick = () => { closeModal(); setCovert(!covert); };
  el('#muSettings').onclick = () => { closeModal(); openSettings(); };
});

function openPrivateCall() {
  api('GET', '/api/radios').then((radios) => modal('Private call', `
    <label for="pIssi">Dial ISSI</label>
    <input id="pIssi" class="mono" value="" placeholder="234100002" inputmode="numeric">
    <label for="pPick">Or pick a radio</label>
    <select id="pPick">${radios.filter((r) => r.issi !== radio.issi).map((r) => `<option value="${r.issi}">${esc(r.callsign || r.issi)} — ${r.issi} (${r.connected ? 'on air' : 'offline'})</option>`).join('')}</select>
    <div style="height:12px"></div><button class="btn primary" id="pGo">Call</button><p class="err" id="pErr"></p>`, () => {
    el('#pGo').onclick = async () => {
      const to = el('#pIssi').value.trim() || el('#pPick').value;
      try { currentCall = await api('POST', '/api/calls/private', { to }); closeModal(); showOutgoing(currentCall); }
      catch (e) { el('#pErr').textContent = e.message === 'destination radio offline' ? 'That radio is not on air.' : e.message; }
    };
  }));
}

function showOutgoing(call) {
  const names = call.participants.filter((p) => p.role === 'CALLEE').map((p) => p.callsign || p.issi).join(', ');
  el('#alertHost').innerHTML = `<div class="incoming"><strong>CALLING</strong><div class="mono" style="font-size:18px">${esc(names)}</div><div class="mono dim" id="callState">RINGING</div><div class="btn-row" style="margin-top:10px"><button class="btn danger" id="cEnd">End call</button></div></div>`;
  el('#cEnd').onclick = async () => { await api('POST', `/api/calls/${call.id}/end`); };
  log(`CALLING ${names}`);
}

function showIncoming(call) {
  currentCall = call;
  const from = call.from_label || (call.participants.find((p) => p.role === 'CALLER') || {}).callsign || 'CONTROL';
  const fromIssi = (call.participants.find((p) => p.role === 'CALLER') || {}).issi || '—';
  el('#alertHost').innerHTML = `
    <div class="incoming">
      <strong>INCOMING ${call.kind} CALL</strong>
      <div class="mono" style="font-size:20px">${esc(from)}</div>
      <div class="mono dim">from ISSI ${esc(fromIssi)}</div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn ok" id="cAns">Answer</button>
        <button class="btn danger" id="cDec">Decline</button>
      </div>
    </div>`;
  el('#cAns').onclick = async () => {
    await audio.getMic().catch((e) => log('MIC DENIED: ' + e.message));
    await api('POST', `/api/calls/${call.id}/accept`);
  };
  el('#cDec').onclick = async () => { await api('POST', `/api/calls/${call.id}/reject`); };
  log(`INCOMING CALL from ${from}`);
}

function openWelfare() {
  modal('Welfare timer', `
  <p class="dim">Set a timer before you go in. Check in before it runs out, or control is alerted with your last known position.</p>
  <label for="wMin">Check in within</label>
  <select id="wMin">
    <option value="300">5 minutes</option><option value="600" selected>10 minutes</option>
    <option value="900">15 minutes</option><option value="1800">30 minutes</option><option value="3600">1 hour</option>
  </select>
  <label for="wNote">What you are doing</label>
  <input id="wNote" placeholder="Internal check, Meridian Business Park">
  <div class="btn-row" style="margin-top:12px">
    <button class="btn ok" id="wStart">Start timer</button>
    <button class="btn" id="wCheck">Check in now</button>
    <button class="btn danger" id="wStop">Cancel timer</button>
  </div>
  <p class="err" id="wErr"></p>`, () => {
  const guard = (fn) => async () => { try { await fn(); closeModal(); } catch (e) { el('#wErr').textContent = e.message; } };
  el('#wStart').onclick = guard(async () => {
    radio = await api('POST', `/api/radios/${radio.issi}/welfare`, { interval_s: Number(el('#wMin').value), note: el('#wNote').value });
    log(`WELFARE TIMER SET ${Math.round(radio.welfare_interval_s / 60)} MIN`);
  });
  el('#wCheck').onclick = guard(async () => {
    const out = await CCCS.send('POST', `/api/radios/${radio.issi}/welfare/check`, {}, 'welfare check-in');
    if (out && out.queued) log('CHECK-IN HELD — NO LINK, WILL RETRY');
    else { radio = out; log('CHECKED IN'); }
  });
  el('#wStop').onclick = guard(async () => { radio = await api('DELETE', `/api/radios/${radio.issi}/welfare`, {}); log('WELFARE TIMER CANCELLED'); });
  });
}

setInterval(() => {
  if (!radio || !radio.welfare_due_at) { el('#welfare').textContent = ''; return; }
  const left = Math.round((Date.parse(radio.welfare_due_at) - Date.now()) / 1000);
  el('#welfare').textContent = left > 0
    ? `Check in within ${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`
    : 'WELFARE OVERDUE';
  el('#welfare').className = 'mono ' + (left > 60 ? 'dim' : 'txt-EMERGENCY');
}, 1000);

async function raiseEmergency(source) {
  const r = await CCCS.send('POST', '/api/emergency', {}, 'emergency');
  log(r.queued ? `EMERGENCY QUEUED — NO LINK (${source})` : `EMERGENCY ACTIVATED (${source})`);
  el('#bEmg').classList.add('tx');
  setTimeout(() => el('#bEmg').classList.remove('tx'), 3000);
}
function statusCodeMenu() {
  modal('Send status code', `
    <p class="dim">Two digits, no talking, no channel time.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${statusCodes.map((c) => `<button class="btn" data-code="${c.code}" style="text-align:left"><span class="mono">${c.code}</span> ${esc(c.label)}</button>`).join('')}
    </div>`, () => {
    CCCS.els('[data-code]').forEach((b) => (b.onclick = async () => {
      const out = await CCCS.send('POST', `/api/radios/${radio.issi}/status`, { code: b.dataset.code }, `status ${b.dataset.code}`);
      log(out && out.queued ? `STATUS ${b.dataset.code} HELD — NO LINK` : `STATUS ${b.dataset.code} SENT`);
      closeModal();
    }));
  });
}
async function setCovert(on) {
  covert = on;
  document.body.style.filter = on ? 'brightness(0.22)' : '';
  el('#covertFlag').textContent = on ? 'COVERT' : '';
  await CCCS.send('POST', `/api/radios/${radio.issi}/covert`, { on }, `covert ${on ? 'on' : 'off'}`);
  log(on ? 'COVERT MODE ON — SCREEN DIMMED, TONES OFF' : 'COVERT MODE OFF');
}
function openPosition() {
  modal('Position', `
  <dl class="kv" style="display:grid;grid-template-columns:100px 1fr;gap:4px 10px">
    <dt class="dim">Latitude</dt><dd class="mono">${radio.lat?.toFixed(5)}</dd>
    <dt class="dim">Longitude</dt><dd class="mono">${radio.lon?.toFixed(5)}</dd>
    <dt class="dim">Speed</dt><dd class="mono">${radio.speed} mph</dd>
    <dt class="dim">Heading</dt><dd class="mono">${radio.heading}°</dd>
    <dt class="dim">Battery</dt><dd class="mono">${radio.battery}%</dd>
  </dl>`);
}
/* Background GPS while a job is live, separate from the sat nav view — the
 * server derives EN_ROUTE/ON_SCENE from these reports (checkAutoJobProgress
 * in server.js), so it needs them whether or not the officer has the nav
 * screen open. Starts/stops itself based on currentJob; safe to call this
 * from anywhere currentJob might have changed since it's a no-op otherwise. */
let radioLocWatchId = null;
function ensureLocationTracking() {
  const shouldTrack = currentJob && !['ON_SCENE', 'TRANSPORTING', 'COMPLETED', 'CANCELLED'].includes(currentJob.status) && navigator.geolocation;
  if (shouldTrack && radioLocWatchId == null) {
    radioLocWatchId = navigator.geolocation.watchPosition(
      (pos) => { api('POST', `/api/radios/${radio.issi}/location`, { lat: pos.coords.latitude, lon: pos.coords.longitude, speed: pos.coords.speed || 0 }).catch(() => {}); },
      () => {}, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
  } else if (!shouldTrack && radioLocWatchId != null) {
    navigator.geolocation.clearWatch(radioLocWatchId);
    radioLocWatchId = null;
  }
}
async function sendPosition() {
  const push = async (lat, lon) => {
    const out = await CCCS.send('POST', `/api/radios/${radio.issi}/position-report`,
      lat === undefined ? {} : { lat, lon }, 'position report');
    log(out && out.queued ? 'POSITION REPORT HELD — NO LINK' : 'POSITION REPORT SENT');
  };
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => push(pos.coords.latitude, pos.coords.longitude),
      () => push(),
      { enableHighAccuracy: true, timeout: 5000 }
    );
  } else await push();
}
async function requestCall(priority, source) {
  const r = await CCCS.send('POST', '/api/calls/request', { priority }, priority ? 'priority call request' : 'call request');
  log(r && r.queued
    ? `${priority ? 'PRIORITY ' : ''}CALL REQUEST HELD — NO LINK`
    : `${priority ? 'PRIORITY ' : ''}CALL REQUEST SENT TO CONTROL${source ? ' (' + source + ')' : ''}`);
  el('#covertFlag').textContent = priority ? 'PRIORITY CALL REQUESTED' : 'CALL REQUESTED';
  setTimeout(() => { if (/CALL REQUEST/.test(el('#covertFlag').textContent)) el('#covertFlag').textContent = ''; }, 6000);
  beepTwice();
}

el('#bEmg').onclick = async () => {
  if (!confirm('Send an emergency alert to control?')) return;
  raiseEmergency('screen');
};

/* ---- press-and-hold logo (or, when bound, hardware key "0") opens settings —
   matches the physical device's minimal visible button count. ---- */
function bindLongPress(target, ms, fn) {
  let t = null;
  const start = (e) => { if (e.cancelable) e.preventDefault(); t = setTimeout(fn, ms); };
  const cancel = () => { if (t) { clearTimeout(t); t = null; } };
  target.addEventListener('mousedown', start); target.addEventListener('touchstart', start, { passive: false });
  target.addEventListener('mouseup', cancel); target.addEventListener('mouseleave', cancel); target.addEventListener('touchend', cancel);

/* Once a physical SOS key is bound, the on-screen EMERGENCY button is
 * redundant screen real-estate and a mis-tap risk — hide it. Re-shown the
 * moment the binding is cleared. */
function paintEmgVisibility() {
  el('#bEmg').hidden = Boolean(keys.bindings.sos);
}
async function pushBindings() {
  paintEmgVisibility();
  const b = keys.bindings;
  try {
    await api('PUT', '/api/me/settings', {
      ptt_token: b.ptt, sos_token: b.sos, sos_hold_ms: b.sosHoldMs,
      call_token: b.call, priority_token: b.priority, lock_token: b.lock,
      redial_token: b.redial, talkgroup_token: b.talkgroup, status_token: b.status,
      covert_token: b.covert, position_token: b.position,
      action_hold_ms: b.holdMs, speed_dial: b.speedDial || {},
    });
  }
  catch (e) { log('COULD NOT SAVE BINDINGS: ' + e.message); }
}
async function pullBindings() {
  try {
    const s = await api('GET', '/api/me/settings');
    if (s.ptt_token) keys.set('ptt', s.ptt_token);
    if (s.sos_token) keys.set('sos', s.sos_token);
    if (s.sos_hold_ms) keys.setHold(s.sos_hold_ms);
    if (s.call_token !== undefined) keys.set('call', s.call_token);
    if (s.priority_token !== undefined) keys.set('priority', s.priority_token);
    if (s.lock_token !== undefined) keys.set('lock', s.lock_token);
    if (s.action_hold_ms) keys.setActionHold(s.action_hold_ms);
    for (const [field, action] of [['redial_token', 'redial'], ['talkgroup_token', 'talkgroup'],
                                   ['status_token', 'status'], ['covert_token', 'covert'], ['position_token', 'position']]) {
      if (s[field] !== undefined) keys.set(action, s[field]);
    }
    if (s.speed_dial) for (const [ch, entry] of Object.entries(s.speed_dial)) keys.setSpeedDial(ch, entry);
  } catch { /* offline: the device's own bindings stand */ }
  paintEmgVisibility();
}

api('GET', '/api/status-codes').then((c) => (statusCodes = c)).catch(() => {});

async function redial() {
  if (!lastParty) return log('NO LAST CALL TO RETURN');
  try {
    if (lastParty.type === 'phone') {
      currentCall = await api('POST', '/api/calls/pstn', { digits: lastParty.target });
      showPstn(currentCall);
    } else {
      currentCall = await api('POST', '/api/calls/private', { to: lastParty.target });
      showOutgoing(currentCall);
    }
    log(`RETURNING CALL TO ${lastParty.label || lastParty.target}`);
  } catch (e) { log('REDIAL FAILED: ' + e.message); }
}

async function speedDial(ch) {
  const entry = keys.speedDial[ch];
  if (!entry) return;
  try {
    if (entry.type === 'phone') {
      currentCall = await api('POST', '/api/calls/pstn', { digits: entry.target });
      showPstn(currentCall);
    } else {
      currentCall = await api('POST', '/api/calls/private', { to: entry.target });
      showOutgoing(currentCall);
    }
    lastParty = { ...entry };
    log(`SPEED DIAL ${ch} → ${entry.label}`);
  } catch (e) { log(`SPEED DIAL ${ch} FAILED: ${e.message}`); }
}

function setLocked(next) {
  locked = next;
  if (!locked) { el('#lockHost').innerHTML = ''; log('KEYPAD UNLOCKED'); return; }
  const unlockLabel = keys.hasHardwareKeys ? `Hold ${keys.label(keys.bindings.lock)} to unlock` : 'Hold the button below to unlock';
  el('#lockHost').innerHTML = `
    <div class="lock-overlay" id="lockOverlay" role="dialog" aria-label="Keypad locked">

      <div class="hint">${esc(unlockLabel)}. Talk and SOS still work, and incoming calls will still come through.</div>
      <div class="live" id="lockLive"></div>
      ${keys.hasHardwareKeys ? '' : '<button class="btn" id="lockBtn" style="padding:18px 28px">Hold to unlock</button>'}
      <div style="display:flex;gap:10px;width:min(340px,100%);margin-top:6px">
        <button class="ptt" id="lockPtt" style="flex:2;height:78px;font-size:16px">PUSH TO TALK</button>
        <button class="btn danger" id="lockSos" style="flex:1;height:78px">SOS</button>
      </div>
    </div>`;
  log('KEYPAD LOCKED');
  const lp = el('#lockPtt');
  if (lp) {
    lp.addEventListener('mousedown', pttDown); lp.addEventListener('touchstart', pttDown);
    lp.addEventListener('mouseup', pttUp); lp.addEventListener('touchend', pttUp);
  }

    const stop = () => { if (t) { clearTimeout(t); t = null; } if (el('#lockLive')) el('#lockLive').textContent = ''; };

/* Full-screen turn-by-turn — a real sat nav, not an overview map: continuous
 * GPS tracking (not one static fix), a maneuver banner with icon/distance/
 * voice prompts at 500/200/50m, and reroute-on-divergence. Falls back to a
 * plain overview (no live tracking) if the job has no destination fix. */
let satnavMap = null, satnavWatchId = null, satnavAnnouncer = null, satnavLastReroute = 0;
function startSatNav(job) {
  if (job.lat == null) { modal('Navigate', '<p class="dim">This job has no location to navigate to.</p>'); return; }
  el('#satnav').classList.remove('hide');
  if (!satnavMap) satnavMap = CCCS.makeMap(el('#satnavMap'), { zoom: 17 });
  satnavMap.invalidateSize();
  satnavAnnouncer = satnavAnnouncer || CCCS.navAnnouncer();
  el('#satnavMute').onclick = () => {
    satnavAnnouncer.setMuted(!satnavAnnouncer.muted);
    el('#satnavMute').textContent = satnavAnnouncer.muted ? '🔇' : '🔊';
  };
  el('#satnavExit').onclick = stopSatNav;
  el('#satnavText').textContent = 'Getting your position…';
  el('#satnavDistance').textContent = '—';
  el('#satnavSummary').textContent = '';

  let routed = false, lastFix = null;
  function paintBanner() {
    if (!lastFix) return;
    const [lat, lon] = lastFix;
    const m = satnavMap.maneuverFor(lat, lon);
    if (!m) return;
    satnavAnnouncer.check(m);
    el('#satnavIcon').textContent = CCCS.navIcon(m.instruction);
    el('#satnavText').textContent = m.arrived ? 'Arrived' : (m.instruction.text || 'Continue');
    el('#satnavDistance').textContent = m.arrived ? 'Arrived' : (m.distance >= 1000 ? `${(m.distance / 1000).toFixed(1)} km` : `${m.distance} m`);
    if (m.etaSeconds != null) {
      const mi = (m.remaining / 1609.34).toFixed(1);
      el('#satnavSummary').textContent = `${mi} mi remaining · ETA ${Math.max(1, Math.round(m.etaSeconds / 60))} min`;
    }
    if (m.offRoute && Date.now() - satnavLastReroute > 15000) {
      satnavLastReroute = Date.now();
      satnavMap.setRoute([lat, lon], [job.lat, job.lon], paintBanner);
      log('OFF ROUTE — RECALCULATING');
    }
  }
  const onFix = (lat, lon) => {
    lastFix = [lat, lon];
    const units = [{ lat, lon, status: 'ON_TASK', callsign: radio.callsign || radio.issi, issi: radio.issi }];
    satnavMap.render(units, [job]);
    satnavMap.centerOn(lat, lon, 17);
    if (!routed) {
      routed = true;
      // maneuverFor needs the routed coordinates/instructions, which only
      // exist once this async callback fires — calling it synchronously
      // right after setRoute would just see last tick's (or no) route.
      satnavMap.setRoute([lat, lon], [job.lat, job.lon], paintBanner);
    }
    paintBanner();
  };

  if (navigator.geolocation) {
    satnavWatchId = navigator.geolocation.watchPosition(
      (pos) => onFix(pos.coords.latitude, pos.coords.longitude),
      (err) => { el('#satnavText').textContent = `No GPS fix (${err.message}) — showing last known position`; if (radio.lat != null) onFix(radio.lat, radio.lon); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });
  } else if (radio.lat != null) onFix(radio.lat, radio.lon);
}
function stopSatNav() {
  if (satnavWatchId != null) { navigator.geolocation.clearWatch(satnavWatchId); satnavWatchId = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  el('#satnav').classList.add('hide');
}
function showNavMap(job) { startSatNav(job); }

/* Rpt: play back whatever was last heard on this talkgroup. */
el('#bRpt').onclick = () => {
  if (!audio.playLastRecording()) log('NOTHING TO REPEAT YET');
};

el('#bChan').onclick = async () => {
  const tgs = await api('GET', '/api/talkgroups');
  modal('Talkgroup', `
    <label for="tSel">Affiliate to</label>
    <select id="tSel">${tgs.map((t) => `<option value="${t.id}" ${t.name === radio.talkgroup ? 'selected' : ''}>${esc(t.name)} (${t.members.length})</option>`).join('')}</select>
    <div style="height:12px"></div><button class="btn primary" id="tGo">Join talkgroup</button>`, () => {
    el('#tGo').onclick = async () => {
      await api('POST', `/api/talkgroups/${el('#tSel').value}/members`, { radio: radio.issi });
      radio = await api('GET', `/api/radios/${radio.issi}`); paint(); closeModal();
    };
  });
};

el('#bText').onclick = async () => {
  const msgs = await api('GET', '/api/messages');
  modal('Messages', `
    <div class="log" style="max-height:200px;overflow:auto">${msgs.slice(-30).reverse().map((m) => `<div class="msgline"><span class="t">${CCCS.hhmmss(new Date(m.sent_at))}</span>${esc(m.from_label)} → ${esc(m.to_label)}: ${esc(m.body)} <span class="dim">${m.state}</span></div>`).join('') || '<div class="dim">No messages.</div>'}</div>
    <label for="txt">Message to control</label>
    <textarea id="txt" rows="2"></textarea>
    <div style="height:10px"></div><button class="btn primary" id="send">Send to control</button>`, () => {
    el('#send').onclick = async () => {
      const r = await CCCS.send('POST', '/api/messages', { to_control: true, body: el('#txt').value }, 'message to control');
      if (r.queued) log('MESSAGE QUEUED — WILL SEND WHEN LINK RETURNS');
      closeModal();
    };
  });
};

function openDial() {
  modal('Dial an outside number', `
  <p class="dim">Dial ${'9'} then the number to call a telephone through the PBX. Radio numbers are dialled from <em>Private call</em>.</p>
  <input id="dNum" class="mono" style="font-size:22px;letter-spacing:.08em" value="9" inputmode="tel">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px">
    ${['1','2','3','4','5','6','7','8','9','*','0','#'].map((k) => `<button class="btn" data-k="${k}" style="font-size:20px;padding:12px">${k}</button>`).join('')}
  </div>
  <div class="btn-row" style="margin-top:10px">
    <button class="btn ok" id="dGo" style="flex:1">Call</button>
    <button class="btn" id="dDel">Delete</button>
  </div>
  <p class="err" id="dErr"></p>`, () => {
  CCCS.els('[data-k]').forEach((b) => (b.onclick = () => (el('#dNum').value += b.dataset.k)));
  el('#dDel').onclick = () => (el('#dNum').value = el('#dNum').value.slice(0, -1));
  el('#dGo').onclick = async () => {
    try {
      currentCall = await api('POST', '/api/calls/pstn', { digits: el('#dNum').value });
      closeModal();
      showPstn(currentCall);
    } catch (e) { el('#dErr').textContent = e.message; }
  };
  });
}

function showPstn(call) {
  el('#alertHost').innerHTML = `<div class="incoming" style="border-color:var(--on-task);background:#11202e">
    <strong>OUTSIDE CALL</strong>
    <div class="mono" style="font-size:20px">${esc(call.dialled_number || '')}</div>
    <div class="mono dim" id="callState">DIALLING</div>
    <div class="btn-row" style="margin-top:10px"><button class="btn danger" id="pEnd">End call</button></div></div>`;
  el('#pEnd').onclick = () => api('POST', `/api/calls/${call.id}/end`, {});
  log(`DIALLING ${call.dialled_number}`);
}

/* ---- PTT ---- */
function pttDown(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (txing || !radio.talkgroup) return;
  txing = true;
  bus.send('radio.ptt_start', { talkgroup: radio.talkgroup, as_radio: radio.issi });
}
function pttUp() {
  if (!txing) return;
  txing = false;
  audio.stopPublishing();
  bus.send('radio.ptt_release', { talkgroup: radio.talkgroup, as_radio: radio.issi });
}
el('#ptt').addEventListener('mousedown', pttDown);
el('#ptt').addEventListener('touchstart', pttDown);
window.addEventListener('mouseup', pttUp);
window.addEventListener('touchend', pttUp);

/* ---- realtime ---- */
let bus;
bus = CCCS.bus((up) => {
  el('#net').textContent = up ? 'link up' : 'link down';
  el('#net').classList.toggle('up', up);
  if (up) {
    bus.send('radio.attach', { issi: qIssi || undefined, radio_id: me.radio_id || undefined });
    CCCS.outbox.flush();
  }
});

const audio = CCCS.audio(bus);
audio.onPeerAudio = (addr, state) => {
  const b = el('#audioBlocked');
  if (!b) return;
  if (state === 'blocked') b.hidden = false;
  else if (state === true) b.hidden = true;
};
el('#audioBlocked').onclick = () => { if (audio.resumeAudio()) el('#audioBlocked').hidden = true; };
let actx;
function beepTwice() {
  if (covert) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach((t) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 1200; g.gain.value = 0.06;
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.12);
    });
  } catch {}
}
let pstnCfg = { prefix: '9', driver: 'simulated', media: false };
api('GET', '/api/config').then((c) => (pstnCfg = c.pstn)).catch(() => {});

bus.on('ptt.granted', async ({ listeners }) => {
  try { await audio.publishTo(listeners); }
  catch (e) { log('MIC DENIED: ' + e.message); }
})
.on('radio.attached', async (r) => {
  radio = r; paint();
  log(`REGISTERED ISSI ${r.issi} AS ${r.callsign || r.issi}`);
  const jobs = await api('GET', '/api/jobs');
  currentJob = jobs.find((j) => j.resources.some((x) => x.radio === r.issi) && !['COMPLETED', 'CANCELLED'].includes(j.status)) || null;
  ensureLocationTracking();
})
.on('radio.status_changed', (r) => { if (radio && r.issi === radio.issi) { radio = r; paint(); } })
.on('radio.location_changed', (r) => { if (radio && r.issi === radio.issi) radio = r; })
.on('call.incoming', (c) => { if (c.participants.some((p) => p.radio_id === radio.id && p.role === 'CALLEE')) showIncoming(c); })
.on('call.accepted', (c) => {
  const n = el('#callState');
  if (n) n.textContent = c.kind === 'PSTN' ? (pstnCfg.media ? 'CONNECTED' : 'CONNECTED — no media on the simulated gateway') : 'CONNECTED';
  const other = (c.participants || []).find((p) => p.radio_id !== radio.id && p.issi);
  if (c.kind !== 'PSTN' && other && c.from_radio_id === radio.id) audio.call(`radio:${other.issi}`).catch((e) => log('MIC DENIED: ' + e.message)); if (currentCall && currentCall.id === c.id) { el('#alertHost').innerHTML = `<div class="incoming" style="border-color:var(--available)"><strong>CALL ACTIVE</strong><div class="btn-row" style="margin-top:10px"><button class="btn danger" id="cEnd2">End call</button></div></div>`; el('#cEnd2').onclick = () => api('POST', `/api/calls/${c.id}/end`); } log(`CALL #${c.id} CONNECTED`); })
.on('call.rejected', (c) => { log(`CALL #${c.id} DECLINED by ${c.rejected_by}`); })
.on('call.incoming', (c) => {
  const caller = (c.participants || []).find((p) => p.role === 'CALLER');
  if (caller && caller.issi) lastParty = { type: 'radio', target: caller.issi, label: caller.callsign || caller.issi };
  else if (c.kind === 'PSTN' && c.dialled_number) lastParty = { type: 'phone', target: `9${c.dialled_number}`, label: c.from_label };
})
.on('call.ended', (c) => { audio.hangUp(); el('#alertHost').innerHTML = ''; currentCall = null; log(`CALL #${c.id} ENDED (${c.end_reason})`); })
.on('job.assigned_to_you', (j) => {
  if (!j.resources.some((r) => r.radio === radio.issi)) return;
  currentJob = j;
  ensureLocationTracking();
  el('#alertHost').innerHTML = `<div class="incoming" style="border-color:var(--priority);background:#2a1c11"><strong>NEW JOB</strong><div class="mono" style="font-size:18px">${esc(j.reference)} · ${esc(j.priority)}</div><div>${esc(j.location)}</div><div class="btn-row" style="margin-top:10px"><button class="btn ok" id="jaAcc">Accept</button><button class="btn" id="jaView">View</button></div></div>`;
  el('#jaAcc').onclick = async () => {
    const r = await CCCS.send('POST', `/api/jobs/${j.id}/ack`, {}, `acknowledge ${j.reference}`);
    el('#alertHost').innerHTML = '';
    log(r.queued ? `ACKNOWLEDGEMENT OF ${j.reference} QUEUED` : `ACKNOWLEDGED ${j.reference}`);
    offerNavigate(j);
  };
  el('#jaView').onclick = () => showJob(j);
  log(`NEW JOB ${j.reference} ${j.priority} — ${j.location}`);
})
.on('job.status_changed', (j) => {
  if (!currentJob || j.id !== currentJob.id) return;
  currentJob = j.resources.some((r) => r.radio === radio.issi) ? j : null;
  ensureLocationTracking();
})
.on('job.stood_down', (j) => {
  if (currentJob && j.id === currentJob.id) { currentJob = null; el('#alertHost').innerHTML = ''; log(`STOOD DOWN FROM JOB ${j.reference}`); ensureLocationTracking(); }
})
.on('radio.ptt_started', (p) => {
  if (!radio || p.talkgroup !== radio.talkgroup) return;
  const mine = p.issi === radio.issi;
  el('#ptt').classList.toggle('tx', mine);
  el('#ptt').classList.toggle('rx', !mine);
  if (!mine) audio.beginRecording();
  log(`${mine ? 'TX' : 'RX ' + p.callsign} on ${p.talkgroup}`);
})
.on('radio.ptt_released', (p) => {
  if (!radio || p.talkgroup !== radio.talkgroup) return;
  el('#ptt').classList.remove('tx', 'rx');
  audio.endRecording();
})
.on('ptt.denied', (p) => { txing = false; log(`PTT DENIED — ${p.holder} has the floor`); })
.on('call.request_cleared', (r) => {
  if (radio && r.issi === radio.issi) {
    log(r.state === 'ANSWERED' ? `CALL REQUEST ANSWERED BY ${r.answered_by}` : 'CALL REQUEST CANCELLED');
  }
})
.on('welfare.started', ({ radio: r }) => { if (radio && r.issi === radio.issi) radio = r; })
.on('welfare.checked_in', (r) => { if (radio && r.issi === radio.issi) radio = r; })
.on('welfare.stopped', (r) => { if (radio && r.issi === radio.issi) radio = r; })
.on('welfare.due_soon', ({ seconds_left }) => { log(`WELFARE CHECK-IN DUE IN ${seconds_left}s`); beepTwice(); })
.on('welfare.overdue', (e) => { if (radio && e.issi === radio.issi) { radio.welfare_due_at = null; log('WELFARE OVERDUE — CONTROL ALERTED'); } })
.on('emergency.acknowledged', (e) => { if (radio && e.issi === radio.issi) log(`EMERGENCY ACKNOWLEDGED BY ${e.acknowledged_by}`); })
.on('emergency.resolved', (e) => { if (radio && e.issi === radio.issi) log('EMERGENCY RESET BY CONTROL'); })
.on('message.received', (m) => { if (radio && m.to_radio_id === radio.id) log(`MSG ${m.from_label}: ${m.body}`); })
.on('error', (e) => log(`ERROR: ${e.message}`));
</script>
</body>
</html>
