<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — officer</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCCS Officer">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<style>
  body { display: flex; justify-content: center; min-height: 100vh; padding: 0 0 24px; }
  .wrap { width: min(480px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 0 12px; }

  .o-topbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px; position: sticky; top: 0; z-index: 5;
    background: var(--bg, #0a0e14);
  }
  .o-topbar img { height: 20px; }
  .o-topbar .mid { flex: 1; text-align: right; font-size: 11px; }
  .o-topbar .clock { font-family: var(--mono); font-size: 13px; }

  .emg-btn {
    width: 100%; height: 64px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #ef4444, #b91c1c); color: #fff;
    font-weight: 800; letter-spacing: .12em; font-size: 17px;
  }
  .emg-btn.tx { filter: brightness(1.3); }

  .field { margin-bottom: 10px; }
  .field span { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
  .field div { font-size: 14.5px; color: var(--ink); }

  .checklist-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-soft);
  }
  .checklist-item:last-child { border-bottom: none; }
  .checklist-item input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent, #22c55e); }
  .checklist-item .ci-body { flex: 1; min-width: 0; }
  .checklist-item .ci-title { font-weight: 600; }
  .checklist-item.done .ci-title { text-decoration: line-through; color: var(--ink-dim); }
  .checklist-item .ci-instr { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .checklist-item textarea { width: 100%; margin-top: 6px; font-size: 13px; }
  .ci-photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .ci-photos img { width: 52px; height: 52px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); }

  .welfare-strip {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .welfare-strip .count { font-family: var(--mono); font-weight: 700; font-size: 15px; }
  .welfare-strip.overdue { border-color: var(--emergency); background: rgba(239,68,68,.1); }
</style>
</head>
<body>
<div class="wrap">
  <div class="o-topbar">
    <img src="/assets/echelon-wordmark.png" alt="Echelon">
    <div class="mid">
      <div class="clock" id="clock">--:--:--</div>
      <span class="link-net" id="net">link down</span>
    </div>
  </div>

  <div id="alertHost"></div>

  <button class="emg-btn" id="bEmg">EMERGENCY</button>

  <div class="welfare-strip hide" id="welfareStrip">
    <span style="flex:1">Welfare check</span>
    <span class="count" id="welfareCount"></span>
    <button class="btn" id="welfareCheckIn" style="padding:4px 10px;font-size:12px">Check in</button>
  </div>

  <section class="panel">
    <header>My details</header>
    <div class="body" id="whoBody" style="padding:12px"></div>
  </section>

  <section class="panel">
    <header>My shift</header>
    <div class="body" id="shiftBody" style="padding:12px">
      <p class="dim">No shift scheduled.</p>
    </div>
  </section>

  <section class="panel">
    <header>Current job</header>
    <div class="body" id="jobBody" style="padding:12px">
      <p class="dim">No job assigned. Dispatched jobs appear here immediately.</p>
    </div>
  </section>

  <section class="panel">
    <header>Current patrol visit</header>
    <div class="body" id="visitBody" style="padding:12px">
      <p class="dim">No patrol visit assigned.</p>
    </div>
  </section>

  <section class="panel hide" id="passdownPanel">
    <header>Passdown — <span id="passdownSite"></span></header>
    <div class="body" style="padding:12px">
      <textarea id="passdownNote" rows="2" placeholder="Note for the next person on site"></textarea>
      <div class="btn-row" style="margin-top:8px"><button class="btn primary" id="passdownSend">Add note</button></div>
      <div id="passdownLog" style="margin-top:10px"></div>
    </div>
  </section>

  <section class="panel">
    <header>Message control</header>
    <div class="body" style="padding:12px">
      <textarea id="note" rows="2" placeholder="Message to control"></textarea>
      <div class="btn-row" style="margin-top:8px"><button class="btn primary" id="send">Send</button></div>
      <div class="log" id="txtLog" style="max-height:140px;overflow:auto;margin-top:10px"></div>
    </div>
  </section>

  <button class="btn" id="signOut" style="align-self:center">Sign out</button>
</div>

<div id="modalHost"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" class="hide">

<script src="/app.js"></script>
<script>
const { api, el, esc } = CCCS;
if (!CCCS.requireAuth(['FIELD_USER', 'DISPATCHER', 'SUPERVISOR', 'SYSTEM_ADMIN'])) throw new Error('auth');
const me = CCCS.getSession().user;
setInterval(() => (el('#clock').textContent = CCCS.hhmmss()), 250);

el('#signOut').onclick = () => { CCCS.clearSession(); location.href = '/index.html'; };

let person = null, job = null, visit = null, pendingPhotoItemId = null, pendingPhotoKind = 'job';

function modal(title, html, onMount) {
  el('#modalHost').innerHTML = `<div class="modal-back"><div class="modal"><h2>${esc(title)}</h2><div class="content">${html}</div><div class="foot"><button class="btn" id="mClose">Close</button></div></div></div>`;
  el('#mClose').onclick = closeModal; onMount && onMount();
}
const closeModal = () => (el('#modalHost').innerHTML = '');

function paintWho() {
  if (!person) return;
  el('#whoBody').innerHTML = `
    <div class="field"><span>Name</span><div>${esc(person.callsign || person.name)}</div></div>
    <div class="field"><span>Rank</span><div>${esc(person.rank || '—')}</div></div>
    <div class="field"><span>Vehicle</span><div>${esc(person.vehicle || '—')}</div></div>`;
  paintWelfare();
}

function paintWelfare() {
  const strip = el('#welfareStrip');
  if (!person || !person.welfare_due_at) { strip.classList.add('hide'); return; }
  const left = Math.round((Date.parse(person.welfare_due_at) - Date.now()) / 1000);
  strip.classList.remove('hide');
  strip.classList.toggle('overdue', left <= 60);
  el('#welfareCount').textContent = left > 0
    ? `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`
    : 'OVERDUE';
}
setInterval(paintWelfare, 1000);
el('#welfareStrip').addEventListener('click', (e) => {
  if (e.target.id === 'welfareCheckIn') return;
  openWelfareModal();
});
el('#welfareCheckIn').onclick = async (e) => {
  e.stopPropagation();
  person = await api('POST', `/api/personnel/${person.id}/welfare/check`, {});
  paintWelfare();
};
function openWelfareModal() {
  modal('Welfare timer', `
  <p class="dim">Set a timer before you go in. Check in before it runs out, or control is alerted with your last known position.</p>
  <label for="wMin">Check in within</label>
  <select id="wMin">
    <option value="300">5 minutes</option><option value="600" selected>10 minutes</option>
    <option value="900">15 minutes</option><option value="1800">30 minutes</option><option value="3600">1 hour</option>
  </select>
  <label for="wNote">What you are doing</label>
  <input id="wNote" placeholder="Internal check, Meridian Business Park">
  <div class="btn-row" style="margin-top:12px">
    <button class="btn ok" id="wStart">Start timer</button>
    <button class="btn danger" id="wStop">Cancel timer</button>
  </div>
  <p class="err" id="wErr"></p>`, () => {
    const guard = (fn) => async () => { try { await fn(); closeModal(); } catch (e) { el('#wErr').textContent = e.message; } };
    el('#wStart').onclick = guard(async () => {
      person = await api('POST', `/api/personnel/${person.id}/welfare`, { interval_s: Number(el('#wMin').value), note: el('#wNote').value });
      paintWelfare();
    });
    el('#wStop').onclick = guard(async () => {
      person = await api('DELETE', `/api/personnel/${person.id}/welfare`, {});
      paintWelfare();
    });
  });
}

let shifts = [];
function fmtShiftTime(iso) { return new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function currentShift() {
  const now = Date.now();
  const upcoming = shifts.filter((s) => !['CANCELLED'].includes(s.status)).sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));
  return upcoming.find((s) => s.status === 'CLOCKED_IN')
    || upcoming.find((s) => ['SCHEDULED', 'CONFIRMED'].includes(s.status) && Date.parse(s.starts_at) - 3600000 <= now && Date.parse(s.ends_at) >= now)
    || null;
}
function paintShift() {
  const current = currentShift();
  const upcoming = shifts.filter((s) => !['CANCELLED'].includes(s.status)).sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));
  const rest = upcoming.filter((s) => s !== current && Date.parse(s.ends_at) >= Date.now()).slice(0, 4);

  if (!current && !rest.length) { el('#shiftBody').innerHTML = '<p class="dim">No shift scheduled.</p>'; return; }

  let html = '';
  if (current) {
    html += `
      <div class="field"><span>${current.status === 'CLOCKED_IN' ? 'Clocked in' : 'Next shift'}</span><div>${esc(fmtShiftTime(current.starts_at))} – ${esc(fmtShiftTime(current.ends_at))}</div></div>
      <div class="field"><span>Site</span><div>${esc(current.site_name || '—')}</div></div>
      <div class="field"><span>Role</span><div>${esc(current.role_type || '—')}</div></div>
      <div class="btn-row" style="margin-top:8px">
        ${current.status !== 'CLOCKED_IN' ? `<button class="btn ok" id="shClockIn">Clock in</button>` : `<button class="btn danger" id="shClockOut">Clock out</button>`}
      </div>`;
  }
  if (rest.length) {
    html += `<label style="margin-top:${current ? '14px' : '0'}">Upcoming</label>` +
      rest.map((s) => `<div class="field"><span>${esc(fmtShiftTime(s.starts_at))}</span><div>${esc(s.site_name || s.role_type || '—')}</div></div>`).join('');
  }
  el('#shiftBody').innerHTML = html;
  if (el('#shClockIn')) el('#shClockIn').onclick = async () => { await api('POST', `/api/shifts/${current.id}/clock-in`, {}); await refreshShifts(); };
  if (el('#shClockOut')) el('#shClockOut').onclick = async () => { await api('POST', `/api/shifts/${current.id}/clock-out`, {}); await refreshShifts(); };
  refreshPassdown();
}
async function refreshShifts() {
  if (!person) return;
  const from = new Date(Date.now() - 12 * 3600000).toISOString();
  shifts = await api('GET', `/api/shifts?personnel_id=${person.id}&from=${encodeURIComponent(from)}`);
  paintShift();
}

let passdownSiteId = null, passdownLogs = [];
function currentPassdownSite() {
  if (visit && visit.site_id) return { id: visit.site_id, name: visit.site_name };
  const shift = currentShift();
  if (shift && shift.site_id) return { id: shift.site_id, name: shift.site_name };
  return null;
}
function paintPassdownLogs() {
  el('#passdownLog').innerHTML = passdownLogs.length
    ? passdownLogs.map((l) => `<div class="field"><span>${esc(l.author_name)} · ${esc(new Date(l.created_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</span><div>${esc(l.body)}</div></div>`).join('')
    : '<p class="dim">No handover notes yet.</p>';
}
async function refreshPassdown() {
  const site = currentPassdownSite();
  if (!site) { el('#passdownPanel').classList.add('hide'); passdownSiteId = null; return; }
  passdownSiteId = site.id;
  el('#passdownSite').textContent = site.name || '—';
  el('#passdownPanel').classList.remove('hide');
  try { passdownLogs = await api('GET', `/api/passdown-logs?site_id=${site.id}`); } catch { passdownLogs = []; }
  paintPassdownLogs();
}
el('#passdownSend').onclick = async () => {
  const body = el('#passdownNote').value.trim();
  if (!body || !passdownSiteId) return;
  const log = await api('POST', '/api/passdown-logs', { site_id: passdownSiteId, body });
  el('#passdownNote').value = '';
  passdownLogs.unshift(log);
  paintPassdownLogs();
};

function paintJob() {
  if (!job) {
    el('#jobBody').innerHTML = '<p class="dim">No job assigned. Dispatched jobs appear here immediately.</p>';
    return;
  }
  const mine = job.resources.find((r) => r.personnel === (person && person.name));
  const checklist = job.checklist || [];
  el('#jobBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <span class="mono" style="font-weight:700;font-size:16px">${esc(job.reference)}</span>
      <span class="pri pri-${job.priority}">${job.priority}</span>
      <span class="mono dim">${esc(job.status.replace('_', ' '))}</span>
    </div>
    <div class="field"><span>Incident</span><div>${esc(job.incident_type)}</div></div>
    <div class="field"><span>Location</span><div>${esc(job.location)}</div></div>
    <div class="field"><span>Details</span><div>${esc(job.description || '—')}</div></div>
    <div class="field"><span>Notes</span><div>${esc(job.notes || '—')}</div></div>
    <div class="btn-row" style="margin:12px 0">
      ${mine && !mine.acknowledged ? '<button class="btn ok" id="jAck">Accept job</button>' : ''}
      <button class="btn" id="jEnr">En route</button>
      <button class="btn" id="jScene">On scene</button>
      <button class="btn" id="jDone">Completed</button>
    </div>
    ${checklist.length ? `<label style="margin-top:10px">Checklist</label><div id="checklistHost"></div>` : ''}
    <div class="btn-row" style="margin-top:10px"><button class="btn" id="jAddPhoto">Add photo</button></div>`;

  if (checklist.length) {
    el('#checklistHost').innerHTML = checklist.map((item) => `
      <div class="checklist-item ${item.status === 'COMPLETE' ? 'done' : ''}" data-item="${item.id}">
        <input type="checkbox" data-check="${item.id}" ${item.status === 'COMPLETE' ? 'checked' : ''}>
        <div class="ci-body">
          <div class="ci-title">${esc(item.title)}</div>
          ${item.instructions ? `<div class="ci-instr">${esc(item.instructions)}</div>` : ''}
          <textarea rows="1" placeholder="Notes" data-note="${item.id}">${esc(item.notes || '')}</textarea>
          <div class="ci-photos">${(job.media || []).filter((m) => m.checklist_item_id === item.id).map((m) => `<img src="${m.url}" alt="">`).join('')}</div>
          <div class="btn-row" style="margin-top:6px"><button class="btn" style="padding:2px 8px;font-size:11px" data-photofor="${item.id}">Photo</button></div>
        </div>
      </div>`).join('');
    CCCS.els('[data-check]').forEach((cb) => (cb.onchange = async () => {
      job = await api('PATCH', `/api/jobs/${job.id}/checklist/${cb.dataset.check}`, { status: cb.checked ? 'COMPLETE' : 'PENDING' });
      paintJob();
    }));
    CCCS.els('[data-note]').forEach((ta) => (ta.onblur = async () => {
      job = await api('PATCH', `/api/jobs/${job.id}/checklist/${ta.dataset.note}`, { notes: ta.value });
    }));
    CCCS.els('[data-photofor]').forEach((b) => (b.onclick = () => { pendingPhotoItemId = b.dataset.photofor; pendingPhotoKind = 'job'; el('#photoInput').click(); }));
  }
  el('#jAddPhoto').onclick = () => { pendingPhotoItemId = null; pendingPhotoKind = 'job'; el('#photoInput').click(); };

  if (el('#jAck')) el('#jAck').onclick = async () => {
    const r = await CCCS.send('POST', `/api/jobs/${job.id}/ack`, {}, `acknowledge ${job.reference}`);
    if (!r.queued) { job = r; paintJob(); }
  };
  el('#jEnr').onclick = () => setJobStatus('EN_ROUTE');
  el('#jScene').onclick = () => setJobStatus('ON_SCENE');
  el('#jDone').onclick = () => setJobStatus('COMPLETED');
}
async function setJobStatus(status) {
  const r = await CCCS.send('PATCH', `/api/jobs/${job.id}`, { status }, `${job.reference} → ${status}`);
  if (!r.queued) { job = r; paintJob(); }
}

function paintVisit() {
  if (!visit) {
    el('#visitBody').innerHTML = '<p class="dim">No patrol visit assigned.</p>';
    refreshPassdown();
    return;
  }
  const mine = visit.resources.find((r) => r.personnel === (person && person.name));
  const checklist = visit.checklist || [];
  el('#visitBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <span class="mono" style="font-weight:700;font-size:16px">${esc(visit.reference)}</span>
      <span class="mono dim">${esc(visit.status.replace('_', ' '))}</span>
    </div>
    <div class="field"><span>Site</span><div>${esc(visit.site_name || '—')}</div></div>
    <div class="field"><span>Address</span><div>${esc(visit.site_address || '—')}</div></div>
    <div class="field"><span>Scheduled for</span><div>${new Date(visit.scheduled_for).toLocaleString()}</div></div>
    <div class="field"><span>Notes</span><div>${esc(visit.notes || '—')}</div></div>
    <div class="btn-row" style="margin:12px 0">
      ${mine && visit.status === 'DISPATCHED' ? '<button class="btn ok" id="vAck">Accept visit</button>' : ''}
      <button class="btn" id="vEnr">En route</button>
      <button class="btn" id="vScene">On scene</button>
      <button class="btn" id="vDone">Completed</button>
    </div>
    ${checklist.length ? `<label style="margin-top:10px">Checklist</label><div id="visitChecklistHost"></div>` : ''}
    <div class="btn-row" style="margin-top:10px"><button class="btn" id="vAddPhoto">Add photo</button></div>`;

  if (checklist.length) {
    el('#visitChecklistHost').innerHTML = checklist.map((item) => `
      <div class="checklist-item ${item.status === 'COMPLETE' ? 'done' : ''}" data-item="${item.id}">
        <input type="checkbox" data-vcheck="${item.id}" ${item.status === 'COMPLETE' ? 'checked' : ''}>
        <div class="ci-body">
          <div class="ci-title">${esc(item.title)}</div>
          ${item.instructions ? `<div class="ci-instr">${esc(item.instructions)}</div>` : ''}
          <textarea rows="1" placeholder="Notes" data-vnote="${item.id}">${esc(item.notes || '')}</textarea>
          <div class="ci-photos">${(visit.media || []).filter((m) => m.checklist_item_id === item.id).map((m) => `<img src="${m.url}" alt="">`).join('')}</div>
          <div class="btn-row" style="margin-top:6px"><button class="btn" style="padding:2px 8px;font-size:11px" data-vphotofor="${item.id}">Photo</button></div>
        </div>
      </div>`).join('');
    CCCS.els('[data-vcheck]').forEach((cb) => (cb.onchange = async () => {
      visit = await api('PATCH', `/api/site-visits/${visit.id}/checklist/${cb.dataset.vcheck}`, { status: cb.checked ? 'COMPLETE' : 'PENDING' });
      paintVisit();
    }));
    CCCS.els('[data-vnote]').forEach((ta) => (ta.onblur = async () => {
      visit = await api('PATCH', `/api/site-visits/${visit.id}/checklist/${ta.dataset.vnote}`, { notes: ta.value });
    }));
    CCCS.els('[data-vphotofor]').forEach((b) => (b.onclick = () => { pendingPhotoItemId = b.dataset.vphotofor; pendingPhotoKind = 'visit'; el('#photoInput').click(); }));
  }
  el('#vAddPhoto').onclick = () => { pendingPhotoItemId = null; pendingPhotoKind = 'visit'; el('#photoInput').click(); };

  if (el('#vAck')) el('#vAck').onclick = async () => {
    const r = await CCCS.send('POST', `/api/site-visits/${visit.id}/ack`, {}, `acknowledge visit ${visit.reference}`);
    if (!r.queued) { visit = r; paintVisit(); }
  };
  el('#vEnr').onclick = () => setVisitStatus('EN_ROUTE');
  el('#vScene').onclick = () => setVisitStatus('ON_SCENE');
  el('#vDone').onclick = () => setVisitStatus('COMPLETED');
  refreshPassdown();
}
async function setVisitStatus(status) {
  const r = await CCCS.send('PATCH', `/api/site-visits/${visit.id}`, { status }, `${visit.reference} → ${status}`);
  if (!r.queued) { visit = r; paintVisit(); }
}

el('#photoInput').onchange = async () => {
  const file = el('#photoInput').files[0];
  el('#photoInput').value = '';
  const target = pendingPhotoKind === 'visit' ? visit : job;
  if (!file || !target) return;
  const mimetype = file.type;
  const data = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  try {
    if (pendingPhotoKind === 'visit') {
      await api('POST', `/api/site-visits/${visit.id}/media`, { mimetype, data, checklist_item_id: pendingPhotoItemId || undefined });
      visit = await api('GET', '/api/site-visits').then((visits) => visits.find((v) => v.id === visit.id) || visit);
      paintVisit();
    } else {
      await api('POST', `/api/jobs/${job.id}/media`, { mimetype, data, checklist_item_id: pendingPhotoItemId || undefined });
      job = await api('GET', `/api/jobs`).then((jobs) => jobs.find((j) => j.id === job.id) || job);
      paintJob();
    }
  } catch (e) { alert(e.message); }
};

el('#send').onclick = async () => {
  const body = el('#note').value.trim();
  if (!body) return;
  const r = await CCCS.send('POST', '/api/messages', { to_control: true, body }, 'message to control');
  el('#note').value = '';
  const line = r.queued ? `QUEUED: ${body}` : `SENT: ${body}`;
  const d = document.createElement('div'); d.innerHTML = `<span class="t">${CCCS.hhmmss()}</span>${esc(line)}`; el('#txtLog').prepend(d);
};

function freshFix(timeoutMs = 2000) {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 5000 }
    );
  });
}
el('#bEmg').onclick = async () => {
  if (!confirm('Send an emergency alert to control?')) return;
  const fix = await freshFix();
  const r = await CCCS.send('POST', '/api/emergency', fix || {}, 'emergency');
  el('#bEmg').classList.add('tx');
  setTimeout(() => el('#bEmg').classList.remove('tx'), 3000);
  if (r.queued) el('#alertHost').innerHTML = '<p class="err">Emergency queued — no link, will send when it returns.</p>';
};

const bus = CCCS.bus((up) => {
  el('#net').textContent = up ? 'link up' : 'link down';
  el('#net').classList.toggle('up', up);
  if (up) CCCS.outbox.flush();
});

async function boot() {
  const all = await api('GET', '/api/personnel');
  person = all.find((p) => p.id === me.personnel_id) || null;
  paintWho();
  const jobs = await api('GET', '/api/jobs');
  job = jobs.find((j) => j.resources.some((r) => r.personnel === (person && person.name)) && !['COMPLETED', 'CANCELLED'].includes(j.status)) || null;
  paintJob();
  const visits = await api('GET', '/api/site-visits');
  visit = visits.find((v) => v.resources.some((r) => r.personnel === (person && person.name)) && !['COMPLETED', 'CANCELLED', 'MISSED'].includes(v.status)) || null;
  paintVisit();
  await refreshShifts();
}
boot();

bus.on('welfare.started', ({ personnel }) => { if (person && personnel.id === person.id) { person = personnel; paintWho(); } })
   .on('welfare.checked_in', (p) => { if (person && p.id === person.id) { person = p; paintWho(); } })
   .on('welfare.stopped', (p) => { if (person && p.id === person.id) { person = p; paintWho(); } })
   .on('welfare.due_soon', () => paintWelfare())
   .on('job.assigned_to_you', (j) => {
     if (!person || !j.resources.some((r) => r.personnel === person.name)) return;
     job = j; paintJob();
     el('#alertHost').innerHTML = `<div class="err" style="border:1px solid var(--priority);border-radius:8px;padding:10px">New job ${esc(j.reference)} — ${esc(j.location)}</div>`;
   })
   .on('job.status_changed', (j) => {
     if (!job || j.id !== job.id) return;
     const stillMine = person && j.resources.some((r) => r.personnel === person.name);
     job = stillMine ? j : null;
     paintJob();
   })
   .on('job.stood_down', (j) => {
     if (!job || j.id !== job.id) return;
     job = null; el('#alertHost').innerHTML = ''; paintJob();
   })
   .on('job.acknowledged', ({ job: j }) => { if (job && j.id === job.id) { job = j; paintJob(); } })
   .on('site_visit.dispatched', (v) => {
     if (!person || !v.resources.some((r) => r.personnel === person.name)) return;
     visit = v; paintVisit();
     el('#alertHost').innerHTML = `<div class="err" style="border:1px solid var(--priority);border-radius:8px;padding:10px">New patrol visit ${esc(v.reference)} — ${esc(v.site_name || '')}</div>`;
   })
   .on('site_visit.status_changed', (v) => {
     if (!visit || v.id !== visit.id) {
       if (person && v.resources.some((r) => r.personnel === person.name) && !['COMPLETED', 'CANCELLED', 'MISSED'].includes(v.status)) { visit = v; paintVisit(); }
       return;
     }
     const stillMine = person && v.resources.some((r) => r.personnel === person.name);
     visit = stillMine && !['COMPLETED', 'CANCELLED', 'MISSED'].includes(v.status) ? v : null;
     paintVisit();
   })
   .on('site_visit.stood_down', (v) => {
     if (!visit || v.id !== visit.id) return;
     visit = null; paintVisit();
   })
   .on('site_visit.acknowledged', ({ visit: v }) => { if (visit && v.id === visit.id) { visit = v; paintVisit(); } })
   .on('shift.created', (s) => { if (person && s.personnel_id === person.id) refreshShifts(); })
   .on('shift.updated', (s) => { if (person && s.personnel_id === person.id) refreshShifts(); })
   .on('emergency.acknowledged', () => { el('#alertHost').innerHTML = '<p class="dim">Emergency acknowledged by control.</p>'; })
   .on('emergency.resolved', () => { el('#alertHost').innerHTML = ''; })
   .on('message.received', (m) => {
     if (!person || m.to_personnel_id !== person.id) return;
     const d = document.createElement('div'); d.innerHTML = `<span class="t">${CCCS.hhmmss()}</span>${esc(m.from_label)}: ${esc(m.body)}`; el('#txtLog').prepend(d);
   })
   .on('error', () => {});
</script>
</body>
</html>
