<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCCS — stores</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<style>
  .k-top { gap: 12px; }
  .k-body { width: min(1320px, 100%); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .k-body { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); display: flex; align-items: center; gap: 8px; }
  .card h3 .count { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .mono { font-family: var(--mono); }
  .ic { width: 18px; height: 18px; flex: none; }

  /* scanner status */
  .scanner { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; max-width: 46vw; overflow: hidden; white-space: nowrap; }
  .scanner .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--available); box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: ping 2s infinite; flex: none; }
  .scanner.err .dot { background: var(--emergency); animation: none; }
  .scanner .last { color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .k-top .spacer { flex: 1; }

  /* the three steps */
  .flow { display: grid; grid-template-columns: 1fr 28px 1fr 28px 200px; align-items: stretch; margin-bottom: 16px; }
  .flow .arrow { display: flex; align-items: center; justify-content: center; color: var(--ink-dim); }
  .step { position: relative; border: 2px dashed var(--line); border-radius: 14px; padding: 14px 16px 14px; min-height: 150px; background: var(--panel); display: flex; flex-direction: column; }
  .step.waiting { border-color: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
  .step.filled { border-style: solid; border-color: var(--accent); }
  .step.ready { border-style: solid; border-color: var(--available); background: color-mix(in srgb, var(--available) 8%, var(--panel)); }
  @keyframes pulse { 50% { border-color: var(--line); } }
  .step .head { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .step .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--panel-3); color: var(--ink); letter-spacing: 0; }
  .step.filled .num, .step.waiting .num { background: var(--accent); color: #fff; }
  .step.ready .num { background: var(--available); color: #fff; }
  .step .x { margin-left: auto; border: 0; background: none; color: var(--ink-dim); font-size: 17px; cursor: pointer; padding: 0 2px; line-height: 1; }
  .step .x:hover { color: var(--ink); }
  .step .prompt { margin: auto 0; font-size: 15.5px; font-weight: 600; color: var(--ink-dim); line-height: 1.35; }
  .step .prompt small { display: block; font-weight: 400; font-size: 12.5px; margin-top: 6px; }
  .who { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; }
  .badge { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--panel-3); color: var(--accent); }
  .badge .ic { width: 22px; height: 22px; }
  .badge.person { border-radius: 50%; background: var(--accent-dim); color: #fff; font-weight: 700; font-size: 14px; }
  .who .t { min-width: 0; flex: 1; }
  .who .what { font-size: 17px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .who .sub { color: var(--ink-dim); font-size: 12.5px; margin-top: 3px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .fact { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
  .fact.good { color: var(--available); border-color: color-mix(in srgb, var(--available) 40%, var(--line)); }
  .fact.warn { color: var(--busy); border-color: color-mix(in srgb, var(--busy) 45%, var(--line)); }
  .fact.bad { color: var(--emergency); border-color: color-mix(in srgb, var(--emergency) 45%, var(--line)); }
  .lv { margin-top: 10px; display: grid; gap: 5px; }
  .lv .r { display: grid; grid-template-columns: minmax(0, 1fr) 90px 34px; gap: 8px; align-items: center; font-size: 12.5px; }
  .lv .r .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv .bar { height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
  .lv .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .lv .r .q { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .lv .more { font-size: 12px; color: var(--ink-dim); }
  .step.action { align-items: stretch; }
  .step.action .verb { margin: auto 0; text-align: center; }
  .step.action .verb .big { font-size: 22px; font-weight: 800; color: var(--ink); }
  .step.action .verb .ic { width: 34px; height: 34px; color: var(--available); margin: 0 auto 6px; display: block; }
  @media (max-width: 1180px) { .flow { grid-template-columns: 1fr 22px 1fr; row-gap: 12px; } .flow .arrow.a2 { display: none; } .step.action { grid-column: 1 / -1; min-height: 0; } }
  @media (max-width: 640px) { .flow { grid-template-columns: 1fr; } .flow .arrow { display: none; } }

  /* forms and messages */
  .hint { font-size: 15px; margin: 0 0 6px; }
  .act h2 { margin: 0 0 14px; font-size: 20px; display: flex; gap: 10px; align-items: center; }
  .act h2 .ic { width: 24px; height: 24px; color: var(--accent); }
  .act .k-form { margin-bottom: 10px; }
  .act .go { padding: 12px 24px; font-size: 16px; }
  .batches { display: grid; gap: 6px; margin: 4px 0 10px; }
  .act label.batch { font-size: 14px; font-weight: 400; letter-spacing: normal; text-transform: none; color: var(--ink); margin: 0; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .act label.batch.on { border-color: var(--accent); background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .batch .exp { font-weight: 700; font-variant-numeric: tabular-nums; }
  .batch.expired .exp { color: var(--emergency); }
  .tick { font-size: 14px; font-weight: 400; letter-spacing: normal; text-transform: none; color: var(--ink); display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .act .tick input, .act label.batch input { width: 18px; height: 18px; flex: none; margin: 0; }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--line); background: var(--panel); }
  .note .ic { width: 26px; height: 26px; flex: none; }
  .note.done { border-color: color-mix(in srgb, var(--available) 50%, var(--line)); background: color-mix(in srgb, var(--available) 9%, var(--panel)); }
  .note.done .ic { color: var(--available); }
  .note.bad { border-color: color-mix(in srgb, var(--emergency) 50%, var(--line)); background: color-mix(in srgb, var(--emergency) 8%, var(--panel)); }
  .note.bad .ic { color: var(--emergency); }
  .note strong { font-size: 15.5px; }
  .act.bad { border-left: 4px solid var(--emergency); }

  /* what you can do */
  .guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .combo { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel-2); }
  .combo .pair { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-dim); flex-wrap: wrap; }
  .combo .pair span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
  .combo .pair .ic { width: 13px; height: 13px; }
  .combo .res-t { font-weight: 700; font-size: 15px; margin-top: 8px; }
  .combo .res-d { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }

  /* search */
  .searchbox { position: relative; }
  .searchbox .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-dim); }
  .searchbox input { width: 100%; font-size: 16px; padding-left: 38px; }
  .results { display: grid; gap: 4px; margin-top: 8px; }
  .res { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); text-align: left; font: inherit; cursor: pointer; width: 100%; }
  .res:hover, .res.sel { border-color: var(--accent); background: var(--panel-2); }
  .res .ic { color: var(--accent); }
  .res .k { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); width: 64px; flex: none; }
  .res .sub { color: var(--ink-dim); font-size: 12px; margin-left: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip-x { display: inline-flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12.5px; padding: 3px 4px 3px 10px; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--line); }
  .chip-x button { border: 0; background: none; color: var(--ink-dim); cursor: pointer; font-size: 14px; padding: 0 6px; }
  kbd { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel-2); }

  /* right column */
  .today { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .today div { text-align: center; padding: 8px 2px; border-radius: 10px; background: var(--panel-2); }
  .today b { display: block; font-size: 21px; font-variant-numeric: tabular-nums; }
  .today span { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-dim); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-dim); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .tab b { font-variant-numeric: tabular-nums; }
  .tab.on { background: var(--panel-3); color: var(--ink); border-color: var(--ink-dim); }
  .tab.bad b { color: var(--emergency); } .tab.warn b { color: var(--busy); }
  .att { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; }
  .att li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .att li .r { margin-left: auto; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .att .s { color: var(--ink-dim); font-size: 12px; }
  .feed { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .feed li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .feed .fi { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--panel-2); color: var(--ink-dim); }
  .feed .fi .ic { width: 15px; height: 15px; }
  .feed .fi.in { color: var(--available); } .feed .fi.mv { color: #3b82f6; } .feed .fi.out { color: var(--busy); } .feed .fi.bad { color: var(--emergency); }
  .feed .when { color: var(--ink-dim); font-size: 11.5px; margin-top: 2px; }
  .feed .via { font-size: 9.5px; font-weight: 700; color: var(--accent); margin-left: 5px; letter-spacing: .05em; }
  .feed .day { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); padding: 10px 0 2px; border: 0; }
</style>
</head>
<body>
<div class="k-top">
  <h1>Stores</h1>
  <span class="scanner" id="scanner"><span class="dot"></span><span id="scanState">Scanner ready</span></span>
  <span class="spacer"></span>
  <a class="btn" href="/stores-labels.html">Print labels</a>
  <a class="btn" href="/stock.html" id="stockLink">Stock</a>
</div>
<div class="k-body">
  <div>
    <div class="flow">
      <div class="step" id="slot1"></div>
      <div class="arrow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="step" id="slot2"></div>
      <div class="arrow a2"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="step action" id="slot3"></div>
    </div>
    <div id="panel"></div>
    <div class="card" id="guideCard"><h3>What two scans do</h3><div class="guide" id="guide"></div></div>
    <div class="card"><h3>No barcode? Search</h3>
      <div class="searchbox"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
      <input id="search" placeholder="Item, location, asset or person — or type a code and press Enter" autocomplete="off"></div>
      <div id="results" class="results"></div>
      <p class="dim" style="font-size:12.5px;margin:10px 0 0">The scanner works anywhere on this page — no need to click first. <kbd>Enter</kbd> confirms, <kbd>Esc</kbd> starts again, <kbd>↑</kbd><kbd>↓</kbd> move through search results.</p></div>
  </div>
  <div>
    <div class="card"><h3>Today</h3><div class="today" id="today"></div></div>
    <div class="card"><h3>Needs attention</h3><div class="tabs" id="attTabs"></div><ul class="att" id="att"><li class="dim">Loading…</li></ul></div>
    <div class="card"><h3>Recent activity</h3><ul class="feed" id="feed"><li class="dim">Loading…</li></ul></div>
  </div>
</div>

<script src="/app.js"></script>
<script src="/nav.js"></script>
<script src="/kit-ui.js"></script>
<script>
'use strict';
/* The store room: scan the THING (stock barcode, drawer label, asset tag),
 * then WHERE / WHO (location QR, goods-in code, staff ID card) — or the
 * other way round. The pair decides the job; the form confirms quantity,
 * batch and expiry. Rules and ledger: routes-stores.js. */
const { api, el, esc } = CCCS;
if (!CCCS.requireAuth(['DISPATCHER', 'SUPERVISOR', 'SYSTEM_ADMIN'])) throw new Error('auth');
const { options, date, when, words } = KIT;
const isAdmin = CCCS.getSession().user.role === 'SYSTEM_ADMIN';
if (!isAdmin) el('#stockLink').remove();
const CONDITIONS = ['GOOD', 'NEW', 'FAIR', 'POOR', 'DAMAGED'];
const THINGS = ['item', 'asset'], TARGETS = ['location', 'receive', 'person'];
let thing = null, target = null, catalogue = null, busy = false, onGo = null;
// A batch-specific pack barcode waiting to be saved with the delivery it came on.
let pendingPack = null;

/* ---------------- reading codes ----------------
 * A USB / Bluetooth scanner is a keyboard that types very fast and ends
 * with Enter. Keys arriving under 50 ms apart are a scan wherever the
 * focus is: the typed characters are taken back out of whatever field had
 * focus (its value is restored) and the code is handled here. Ctrl+]
 * is the GS separator inside GS1 pack codes. The search box below finds
 * an item, location, asset or person by name when there is nothing to
 * scan, and takes a typed code with Enter. */
const manualInput = el('#search');
const manual = { focus: () => manualInput.focus() };
let buf = '', lastKey = 0, snapEl = null, snapVal = null;
document.addEventListener('keydown', (e) => {
  // When the key was pressed, not when this handler got to run: a busy
  // page must not split one fast scan into two slow bursts.
  const now = e.timeStamp || performance.now();
  const gap = now - lastKey;
  if (e.key === 'Enter') {
    const code = buf; const fast = gap < 80 && code.length >= 4;
    buf = '';
    if (!fast) return;
    e.preventDefault(); e.stopPropagation();
    // A box that asks for a barcode (the pack barcode on Receive) takes the
    // scan as its value instead of it starting a new pair.
    if (snapEl && snapEl.dataset && 'capture' in snapEl.dataset) { snapEl.value = code; snapEl.dispatchEvent(new CustomEvent('scanned', { detail: code })); return; }
    if (document.activeElement === manualInput) { manualInput.value = ''; drawResults(); }
    else if (snapEl && snapVal != null) { snapEl.value = snapVal; }
    handle(code);
    return;
  }
  if (e.key === 'Escape') { reset(); return; }
  let ch = null;
  if (e.ctrlKey && (e.key === ']' || e.code === 'BracketRight')) { ch = '\x1d'; e.preventDefault(); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) ch = e.key;
  if (ch == null) return;
  if (gap > 50) { buf = ''; const a = document.activeElement; snapEl = a && 'value' in a ? a : null; snapVal = snapEl ? snapEl.value : null; }
  buf += ch; lastKey = now;
}, true);

async function handle(raw) {
  const code = String(raw || '').trim();
  if (!code || busy) return;
  let r;
  try { r = await api('GET', `/api/stores/resolve?code=${encodeURIComponent(code)}`); }
  catch (e) { status(code, false); beep(false); return message(e.message, true); }
  status(r.kind === 'person' ? 'staff ID card' : code, r.kind !== 'unknown');
  beep(r.kind !== 'unknown');
  if (navigator.vibrate) navigator.vibrate(40);
  use(r);
}
/** Put a resolved code (scanned, typed or picked from the search) in its slot. */
function use(r) {
  if (r.kind === 'unknown') return unknown(r);
  if (THINGS.includes(r.kind)) {
    // A second thing replaces the first unless a target is already waiting.
    thing = r; pendingPack = null;
  } else if (TARGETS.includes(r.kind)) {
    target = r;
  }
  render();
}

/* ---------------- search: the backup when there is no barcode ---------------- */
let hits = [], selHit = 0;
function searchHits(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2 || !catalogue) return [];
  const has = (...xs) => xs.some((x) => x && String(x).toLowerCase().includes(q));
  const out = [];
  for (const i of catalogue.items) if (has(i.label, i.code)) out.push({ kind: 'item', id: i.id, k: 'Stock', name: i.label, sub: i.code });
  for (const l of catalogue.locations) if (has(l.name, l.code)) {
    out.push({ kind: 'location', id: l.id, k: 'Location', name: l.name, sub: l.code });
    if (l.kind === 'STORE' || l.is_main) out.push({ kind: 'receive', id: l.id, k: 'Goods in', name: l.name, sub: 'receive a delivery' });
  }
  for (const a of catalogue.assets) if (has(a.tag, a.description)) out.push({ kind: 'asset', id: a.id, k: 'Asset', name: `${a.tag ? a.tag + ' — ' : ''}${a.description}`, sub: '' });
  for (const p of catalogue.people || []) if (has(p.name, p.employee_no)) out.push({ kind: 'person', id: p.id, k: 'Person', name: p.name, sub: p.employee_no || '' });
  // Names starting with the text first.
  return out.sort((x, y) => Number(!x.name.toLowerCase().startsWith(q)) - Number(!y.name.toLowerCase().startsWith(q))).slice(0, 12);
}
function drawResults() {
  hits = searchHits(manualInput.value); selHit = 0;
  el('#results').innerHTML = hits.map((h, i) => `<button type="button" class="res ${i === selHit ? 'sel' : ''}" data-h="${i}">${icon(h.kind)}<span class="k">${esc(h.k)}</span><span>${esc(h.name)}</span><span class="sub">${esc(h.sub)}</span></button>`).join('')
    || (manualInput.value.trim().length >= 2 ? '<p class="dim" style="margin:4px 0 0;font-size:13px">Nothing by that name — press Enter to look it up as a code.</p>' : '');
  el('#results').querySelectorAll('[data-h]').forEach((b) => (b.onclick = () => pickHit(hits[Number(b.dataset.h)])));
}
async function pickHit(h) {
  if (!h || busy) return;
  try { const r = await api('GET', `/api/stores/resolve?kind=${h.kind}&id=${h.id}`); manualInput.value = ''; drawResults(); use(r); }
  catch (e) { message(e.message, true); }
}
let searchT = null;
manualInput.addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(drawResults, 150); });
manualInput.addEventListener('keydown', (e) => {
  // Results still waiting to be drawn are drawn now, so keys act on what was typed.
  if (searchT && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) { clearTimeout(searchT); searchT = null; drawResults(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!hits.length) return;
    selHit = (selHit + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
    el('#results').querySelectorAll('.res').forEach((b, i) => b.classList.toggle('sel', i === selHit));
  } else if (e.key === 'Enter') {
    // Typed slowly (a scan is caught above): a match is picked, anything else is looked up as a code.
    e.preventDefault();
    if (hits.length) pickHit(hits[selHit]);
    else { const c = manualInput.value.trim(); manualInput.value = ''; drawResults(); handle(c); }
  }
});

function reset() { thing = null; target = null; onGo = null; pendingPack = null; render(); manual.focus(); }

/* ---------------- look and feel ---------------- */
const P = {
  item: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z" stroke-linejoin="round"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  asset: '<path d="M3 12V4h8l10 10-8 8z" stroke-linejoin="round"/><circle cx="7.5" cy="7.5" r="1.5"/>',

  minus: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8" stroke-linecap="round"/>',
};
const icon = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${P[n] || P.item}</svg>`;
const initials = (name) => String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const daysTo = (d) => Math.round((Date.parse(d) - Date.parse(new Date().toISOString().slice(0, 10))) / 86400000);
/** "Exp 30 Jun 2027" coloured by how close it is. */
function expFact(d, prefix = 'Exp') {
  if (!d) return '';
  const n = daysTo(d);
  const cls = n < 0 ? 'bad' : n <= 30 ? 'warn' : 'good';
  const tail = n < 0 ? ' · expired' : n <= 30 ? ` · ${plural(n, 'day')}` : '';
  return `<span class="fact ${cls}">${prefix} ${esc(date(d))}${tail}</span>`;
}

/** The scanner pill in the header: what it last read. */
function status(text, ok) {
  el('#scanner').classList.toggle('err', !ok);
  el('#scanState').innerHTML = `${ok ? 'Read' : 'Not found'} <span class="last mono">${esc(String(text).replace(/\x1d/g, '·').slice(0, 42))}</span>`;
}
/** A short beep on each scan (low buzz when it is not recognised), so you
 * know without looking at the screen. */
let audio = null;
function beep(ok) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = ok ? 'sine' : 'square'; o.frequency.value = ok ? 1320 : 220;
    g.gain.setValueAtTime(0.08, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + (ok ? 0.09 : 0.25));
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (ok ? 0.1 : 0.26));
  } catch {}
}

/* ---------------- the three steps ---------------- */
function detail(r) {
  if (r.kind === 'item') {
    const it = r.item, max = Math.max(1, ...it.levels.map((l) => l.qty));
    const next = it.batches.map((b) => b.expiry_date).filter(Boolean).sort()[0];
    const low = it.reorder_level != null && it.total <= it.reorder_level;
    const pk = r.gs1 && (r.gs1.batch || r.gs1.expiry) ? r.gs1 : null;
    return `<div class="who"><div class="badge">${icon('item')}</div><div class="t"><div class="what">${esc(it.label)}</div><div class="sub">Stock item · <span class="mono">${esc(it.code)}</span></div></div></div>
      <div class="facts"><span class="fact ${it.total ? (low ? 'warn' : 'good') : 'bad'}">${it.total} ${esc(it.unit || 'in stock')}${it.unit ? ' in stock' : ''}</span>
        ${low ? `<span class="fact warn">At / below reorder level (${it.reorder_level})</span>` : ''}
        ${next ? expFact(next, 'Next exp') : ''}
        ${pk ? `<span class="fact good">This pack: ${esc([pk.batch && 'batch ' + pk.batch, pk.expiry && 'exp ' + date(pk.expiry)].filter(Boolean).join(', '))}</span>` : ''}</div>
      ${it.levels.length ? `<div class="lv">${it.levels.slice(0, 4).map((l) => `<div class="r"><span class="nm">${esc(l.location_name)}</span><span class="bar"><i style="width:${Math.round((l.qty / max) * 100)}%"></i></span><span class="q">${l.qty}</span></div>`).join('')}
        ${it.levels.length > 4 ? `<div class="more">+ ${plural(it.levels.length - 4, 'more location')}</div>` : ''}</div>` : ''}`;
  }
  if (r.kind === 'asset') {
    const a = r.asset, co = a.checkout;
    const st = co ? `<span class="fact ${co.overdue ? 'bad' : 'warn'}">${co.overdue ? 'Overdue' : 'Signed out'}</span>` : `<span class="fact ${a.status === 'IN_STORE' ? 'good' : 'bad'}">${esc(words(a.status))}</span>`;
    return `<div class="who"><div class="badge">${icon('asset')}</div><div class="t"><div class="what">${esc(a.tag || a.description)}</div><div class="sub">${esc(a.tag ? a.description : 'Asset')}${a.serial_no ? ` · SN ${esc(a.serial_no)}` : ''}</div></div></div>
      <div class="facts">${st}
        ${co ? `<span class="fact">With ${esc(co.personnel_name)} since ${esc(date(co.checked_out_at))}</span>${co.expected_return_at ? `<span class="fact ${co.overdue ? 'bad' : ''}">Due back ${esc(date(co.expected_return_at))}</span>` : ''}` : ''}
        ${a.location_name ? `<span class="fact">${esc(a.location_name)}</span>` : ''}
        ${a.condition ? `<span class="fact">${esc(words(a.condition))}</span>` : ''}
        ${a.next_check_due_at ? expFact(a.next_check_due_at, 'Check due') : ''}
        ${a.pat_next_due_at ? expFact(a.pat_next_due_at, 'PAT due') : ''}</div>`;
  }
  if (r.kind === 'person') {
    const p = r.person;
    return `<div class="who"><div class="badge person">${esc(initials(p.name))}</div><div class="t"><div class="what">${esc(p.name)}</div><div class="sub">${esc([p.employee_no, p.rank].filter(Boolean).join(' · ') || 'Staff')}</div></div></div>
      <div class="facts">${p.employed ? '<span class="fact good">Employed</span>' : '<span class="fact bad">Has left</span>'}
        <span class="fact ${p.assets_out.length ? 'warn' : ''}">${p.assets_out.length ? `Holds ${plural(p.assets_out.length, 'asset')}` : 'No assets signed out'}</span></div>
      ${p.assets_out.length ? `<div class="lv">${p.assets_out.slice(0, 3).map((a) => `<div class="more">${esc(a.tag || '')} ${esc(a.description)} · since ${esc(date(a.checked_out_at))}</div>`).join('')}</div>` : ''}`;
  }
  const l = r.location, recv = r.kind === 'receive';
  const c = l.contents || [], bad = c.filter((x) => x.expired).length, warn = c.filter((x) => x.expiring).length;
  return `<div class="who"><div class="badge">${icon(recv ? 'receive' : 'location')}</div><div class="t"><div class="what">${esc(l.name)}</div><div class="sub">${recv ? 'Goods in — deliveries are booked in here' : esc([words(l.kind), l.in_vehicle && 'in ' + l.in_vehicle, l.site_name].filter(Boolean).join(' · '))}</div></div></div>
    ${recv ? '' : `<div class="facts"><span class="fact">${plural(c.length, 'stock line')}</span>${(l.assets || []).length ? `<span class="fact">${plural(l.assets.length, 'asset')}</span>` : ''}
      ${bad ? `<span class="fact bad">${bad} expired</span>` : ''}${warn ? `<span class="fact warn">${warn} expiring in 30 days</span>` : ''}</div>`}
    ${!recv && c.length ? `<div class="lv">${c.slice(0, 4).map((x) => `<div class="r" style="grid-template-columns:minmax(0,1fr) auto 34px"><span class="nm">${esc(x.item)}</span><span class="more" style="${x.expired ? 'color:var(--emergency)' : x.expiring ? 'color:var(--busy)' : ''}">${x.next_expiry ? esc(date(x.next_expiry)) : ''}</span><span class="q">${x.qty}</span></div>`).join('')}
      ${c.length > 4 ? `<div class="more">+ ${plural(c.length - 4, 'more line')}</div>` : ''}</div>` : ''}`;
}
function slot(n, r, prompt, sub) {
  const s = el(`#slot${n}`);
  const label = n === 1 ? 'Item or asset' : 'Where / who';
  s.className = `step ${r ? 'filled' : ((n === 1 && !thing) || (n === 2 && thing && !target)) ? 'waiting' : ''}`;
  s.innerHTML = `<div class="head"><span class="num">${n}</span>${label}${r ? `<button class="x" data-clear="${n}" title="Clear">×</button>` : ''}</div>`
    + (r ? detail(r) : `<div class="prompt">${esc(prompt)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`);
  const x = s.querySelector('[data-clear]');
  if (x) x.onclick = () => { if (n === 1) { thing = null; pendingPack = null; } else target = null; render(); manual.focus(); };
}
/** What the pair will do — step 3. */
function verb() {
  if (!thing || !target) return null;
  const a = thing.kind === 'asset' ? thing.asset : null;
  if (thing.kind === 'item') return target.kind === 'receive' ? ['receive', 'Receive', 'into ' + target.location.name] : target.kind === 'location' ? ['move', 'Move', 'to ' + target.location.name] : ['out', 'Issue', 'to ' + target.person.name];
  if (target.kind === 'person' && a.checkout && a.checkout.personnel_id === target.person.id) return ['warn', 'Already theirs', 'scan a location to sign it in', true];
  if (target.kind === 'person') return ['out', a.checkout ? 'Hand over' : 'Sign out', 'to ' + target.person.name];
  return ['in', a.checkout ? 'Sign in' : 'Put away', 'at ' + target.location.name];
}
function stepThree() {
  const s = el('#slot3'), v = verb();
  s.className = `step action ${v && !v[3] ? 'ready' : ''}`;
  s.innerHTML = `<div class="head"><span class="num">3</span>Confirm</div>` + (v
    ? `<div class="verb">${icon(v[0])}<div class="big">${esc(v[1])}</div><div class="dim" style="font-size:12.5px;margin-top:4px">${esc(v[2])}</div>${v[3] ? '' : '<div class="dim" style="font-size:11.5px;margin-top:8px">Check below, then <kbd>Enter</kbd></div>'}</div>`
    : `<div class="prompt" style="text-align:center">${icon('scan')}<small>Two scans and the job appears here</small></div>`);
}

function render() {
  slot(1, thing, target && target.kind === 'person' ? 'Now scan the item or asset' : 'Scan an item, drawer label or asset tag', 'or search for it below');
  slot(2, target, thing ? nextPrompt(thing) : 'Then a location, goods-in code or staff ID card', thing ? '' : 'the order doesn\'t matter');
  stepThree();
  el('#guideCard').style.display = thing || target ? 'none' : '';
  if (thing && !target) return panel(thingAlone(thing));
  if (!thing) { onGo = null; return panel(''); }

}
function nextPrompt(t) {

  return t.asset.checkout ? 'Scan a location to sign it back in, or a staff card to hand it over' : 'Scan a staff ID card to sign it out, or a location to put it away';
}
function thingAlone(t) {
  if (t.kind === 'asset' && t.asset.checkout) return `<div class="btn-row" style="align-items:center;gap:12px"><button class="btn primary go" id="quickIn">${icon('in')} Sign it back in now</button><span class="dim">or scan where it is going</span></div>`;
  return '';
}
function panel(html, cls = '') {

  const q = el('#quickIn'); if (q) q.onclick = () => run(() => api('POST', '/api/stores/asset-in', { asset_id: thing.asset.id, condition: 'GOOD' }));
}
function message(text, bad) {
  el('#panel').innerHTML = `<div class="note ${bad ? 'bad' : 'done'}">${icon(bad ? 'warn' : 'check')}<div><strong>${esc(text)}</strong><div class="dim" style="margin-top:3px;font-size:13px">${bad ? 'Nothing was changed.' : 'Scan the next item.'}</div></div></div>`;
}

/** The legend shown while nothing is scanned. */
const GUIDE = [
  ['item', 'Item', 'location', 'Location', 'Move', 'Into a bag, box or vehicle — pick the batch and confirm its expiry.'],
  ['item', 'Item', 'receive', 'Goods in', 'Receive', 'A delivery into stores — batch, expiry and pack barcodes.'],
  ['item', 'Item', 'person', 'Staff card', 'Issue', 'Hand stock to a person to keep (uniform, PPE).'],
  ['asset', 'Asset', 'person', 'Staff card', 'Sign out', 'Radios, cameras, kit — hands over if someone already has it.'],
  ['asset', 'Asset', 'location', 'Location', 'Sign in', 'Back from a person, put away where you scan.'],
];
function drawGuide() {
  el('#guide').innerHTML = GUIDE.map(([i1, l1, i2, l2, t, d]) => `<div class="combo"><div class="pair"><span>${icon(i1)}${esc(l1)}</span>+<span>${icon(i2)}${esc(l2)}</span></div><div class="res-t">${esc(t)}</div><div class="res-d">${esc(d)}</div></div>`).join('');

/* ---------------- the job the pair makes ---------------- */
function form() {
  const t = thing, g = target;
  if (t.kind === 'item' && g.kind === 'receive') return receiveForm(t, g);
  if (t.kind === 'item' && g.kind === 'location') return takeForm(t, g, 'move');
  if (t.kind === 'item' && g.kind === 'person') return takeForm(t, g, 'issue');
  if (t.kind === 'asset' && g.kind === 'person') return assetOutForm(t, g);
  if (t.kind === 'asset') return assetInForm(t, g);
}
const today = () => new Date().toISOString().slice(0, 10);

function receiveForm(t, g) {
  const p = t.gs1 || {};
  panel(`<h2>${icon('receive')}Receive ${esc(t.item.label)} into ${esc(g.location.name)}</h2>
    <div class="k-form">
      <div><label>Quantity</label><input id="fQty" inputmode="numeric" value="1" autocomplete="off"></div>
      <div><label>Batch / lot number</label><input id="fBatch" value="${esc(p.batch || '')}" autocomplete="off"></div>
      <div><label>Expiry date</label><input id="fExp" type="date" value="${esc(p.expiry || '')}"></div>
      <div><label>Supplier</label><input id="fSup" autocomplete="off"></div>
      <div><label>Delivery note / PO</label><input id="fRef" autocomplete="off"></div>
      <div><label>Note</label><input id="fNote" autocomplete="off"></div>
      ${p.gtin || p.pack_code ? '' : `<div class="full"><label>Pack barcodes for this batch (optional)</label><input id="fPack" data-capture placeholder="Click here and scan — scan as many as the pack has (box, inner pack…)" autocomplete="off">
        <div class="chips" id="fPacks"></div>
        <div class="dim" style="font-size:12px;margin-top:4px">Saved with this batch and expiry: scanning any of them later picks this item <em>and</em> this batch.</div></div>`}
    </div>
    <label class="tick"><input type="checkbox" id="fNoBatch"> This item has no batch number or expiry date</label>
    ${p.pack_code ? '<p class="dim" style="font-size:12.5px">That pack barcode is already saved for this batch — batch and expiry filled in.</p>' : p.batch || p.expiry ? '<p class="dim" style="font-size:12.5px">Batch and expiry read from the pack — check them against the box.</p>' : ''}
    ${foot('Receive')}`);
  wireGo(() => api('POST', '/api/stores/receive', {
    item_id: t.item.id, location_id: g.location.id, quantity: num('#fQty'), batch_no: el('#fBatch').value.trim(), expiry_date: el('#fExp').value || null,
    no_batch: el('#fNoBatch').checked, supplier: el('#fSup').value.trim(), reference: el('#fRef').value.trim(), note: el('#fNote').value.trim(),
    pack_codes: el('#fPack') ? [...packs, el('#fPack').value.trim()].filter(Boolean) : [],
  }), '#fQty');
  // The pack barcode list: each scan (or typed code + Enter) adds one.
  const packs = pendingPack ? [pendingPack] : [];
  const drawPacks = () => {
    el('#fPacks').innerHTML = packs.map((c, i) => `<span class="chip-x">${esc(c)}<button type="button" data-rm="${i}" title="Remove">×</button></span>`).join('');
    el('#fPacks').querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { packs.splice(Number(b.dataset.rm), 1); drawPacks(); }));
  };

  if (el('#fPack')) {
    el('#fPack').addEventListener('scanned', (e) => addPack(e.detail));
    el('#fPack').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); addPack(el('#fPack').value); } });
    drawPacks();
  }

/** Move to a location, or issue to a person: both take stock out of one
 * place, from a batch the person confirms. */
function takeForm(t, g, mode) {
  const to = mode === 'move' ? g.location : null;
  const sources = t.item.levels.filter((l) => !to || l.location_id !== to.id);
  const title = mode === 'move' ? `Move ${esc(t.item.label)} to ${esc(to.name)}` : `Issue ${esc(t.item.label)} to ${esc(g.person.name)}`;
  if (!sources.length) {
    return panel(`<h2>${title}</h2><p class="err">There are none in stock${to ? ' anywhere else' : ''}. Scan the goods-in code to receive some first.</p>${foot(null)}`);
  }
  const main = catalogue && catalogue.locations.find((l) => l.is_main);
  // Where it comes from: where the pack's batch is, else the main store, else where there's most.
  // The batch the scanned pack names (GS1 code or a saved pack barcode).
  const pk = t.gs1 && (t.gs1.batch || t.gs1.expiry) ? t.gs1 : null;
  const isPack = (b) => Boolean(pk && (b.batch_no || null) === (pk.batch || null) && (!pk.expiry || b.expiry_date === pk.expiry));
  const withBatch = pk && t.item.batches.find((b) => isPack(b) && sources.some((s) => s.location_id === b.location_id));
  let from = (withBatch && withBatch.location_id) || (main && sources.some((s) => s.location_id === main.id) ? main.id : sources.slice().sort((a, b) => b.qty - a.qty)[0].location_id);
  panel(`<h2>${icon(mode === 'move' ? 'move' : 'out')}${title}</h2>
    <div class="k-form">
      <div><label>Quantity</label><input id="fQty" inputmode="numeric" value="1" autocomplete="off"></div>
      <div><label>Taking it from</label><select id="fFrom">${options(sources.map((s) => [s.location_id, `${s.location_name} (${s.qty})`]), from)}</select></div>
      <div class="full"><label>Batch / expiry</label><div class="batches" id="fBatches"></div></div>
      <div class="full"><label>Note</label><input id="fNote" autocomplete="off"></div>
    </div>
    <div id="fTicks"></div>
    ${foot(mode === 'move' ? 'Move' : 'Issue')}`);
  let pick = null;
  const drawBatches = () => {
    from = Number(el('#fFrom').value);
    const list = t.item.batches.filter((b) => b.location_id === from);
    const tracked = list.filter((b) => b.batch_no || b.expiry_date);
    if (!tracked.length) { pick = null; el('#fBatches').innerHTML = '<span class="dim">No batch or expiry recorded here.</span>'; el('#fTicks').innerHTML = ''; return; }
    if (!pick || pick.location_id !== from) pick = list.find(isPack) || list[0];
    el('#fBatches').innerHTML = list.map((b, i) => `<label class="batch ${b === pick ? 'on' : ''} ${b.expired ? 'expired' : ''}" data-i="${i}">
        <input type="radio" name="fb" ${b === pick ? 'checked' : ''}>
        <span class="exp">${b.expiry_date ? 'Exp ' + esc(date(b.expiry_date)) : 'No expiry'}</span>
        <span>${b.batch_no ? 'Batch <span class="mono">' + esc(b.batch_no) + '</span>' : 'No batch'}</span>
        <span class="dim" style="margin-left:auto">${b.qty} here</span>${b.expired ? ' <span class="pill bad">Expired</span>' : ''}</label>`).join('');
    el('#fBatches').querySelectorAll('.batch').forEach((x) => (x.onclick = () => { pick = list[Number(x.dataset.i)]; drawBatches(); }));
    // The expiry check: ticked already when the pack's own code named this batch.
    const scanned = isPack(pick);
    el('#fTicks').innerHTML = `${pick.expiry_date ? `<label class="tick"><input type="checkbox" id="fChecked" ${scanned ? 'checked' : ''}> I have checked the pack: ${pick.batch_no ? 'batch <strong>' + esc(pick.batch_no) + '</strong>, ' : ''}expiry <strong>${esc(date(pick.expiry_date))}</strong></label>` : ''}
      ${pick.expired ? '<label class="tick"><input type="checkbox" id="fExpired"> It has expired — move it anyway (e.g. to quarantine / disposal)</label>' : ''}`;
  };
  el('#fFrom').onchange = () => { pick = null; drawBatches(); };
  drawBatches();
  wireGo(() => {
    if (el('#fChecked') && !el('#fChecked').checked) throw new Error('tick to confirm you have checked the expiry on the pack');
    const body = { item_id: t.item.id, quantity: num('#fQty'), note: el('#fNote').value.trim(), allow_expired: Boolean(el('#fExpired') && el('#fExpired').checked) };
    if (pick) { body.batch_no = pick.batch_no || ''; body.expiry_date = pick.expiry_date || ''; } else body.no_batch = true;
    if (mode === 'move') return api('POST', '/api/stores/move', { ...body, from_location_id: from, to_location_id: to.id });
    return api('POST', '/api/stores/issue', { ...body, location_id: from, personnel_id: g.person.id });
  }, '#fQty');
}

function assetOutForm(t, g) {
  const a = t.asset, co = a.checkout;
  if (co && co.personnel_id === g.person.id) {
    panel(`<h2>${esc(a.tag || a.description)} is already signed out to ${esc(g.person.name)}</h2><p>Scan a location to sign it back in.</p>`);
    return;
  }
  panel(`<h2>${icon('out')}Sign ${esc(a.tag || a.description)} out to ${esc(g.person.name)}</h2>
    ${co ? `<p class="hint">It is signed out to <strong>${esc(co.personnel_name)}</strong> — this hands it over: it is signed back in from them and out to ${esc(g.person.name)}.</p>` : ''}
    ${!g.person.employed ? '<p class="err">This person has left.</p>' : ''}
    <div class="k-form">
      <div><label>Due back (optional)</label><input id="fDue" type="date"></div>
      <div><label>Condition going out</label><select id="fCond">${options(CONDITIONS.map((c) => [c, words(c)]), a.condition || 'GOOD')}</select></div>
      <div class="full"><label>Note</label><input id="fNote" placeholder="e.g. with charger" autocomplete="off"></div>
    </div>${foot(co ? 'Hand over' : 'Sign out')}`);
  wireGo(() => api('POST', '/api/stores/asset-out', { asset_id: a.id, personnel_id: g.person.id, handover: Boolean(co), expected_return_at: el('#fDue').value || null, condition: el('#fCond').value, note: el('#fNote').value.trim() }));
}

function assetInForm(t, g) {
  const a = t.asset, co = a.checkout;
  panel(`<h2>${icon('in')}${co ? `Sign ${esc(a.tag || a.description)} back in` : `Put ${esc(a.tag || a.description)} away`} — ${esc(g.location.name)}</h2>
    ${co ? `<p class="hint">From <strong>${esc(co.personnel_name)}</strong>, out since ${esc(when(co.checked_out_at))}.</p>` : ''}
    <div class="k-form">
      ${co ? `<div><label>Condition coming back</label><select id="fCond">${options(CONDITIONS.map((c) => [c, words(c)]), a.condition || 'GOOD')}</select></div>` : ''}
      <div class="${co ? '' : 'full'}"><label>Note</label><input id="fNote" autocomplete="off"></div>
    </div>${foot(co ? 'Sign in' : 'Put away')}`);
  wireGo(() => api('POST', '/api/stores/asset-in', { asset_id: a.id, location_id: g.location.id, condition: el('#fCond') ? el('#fCond').value : undefined, note: el('#fNote').value.trim() }));
}

/* ---------------- unknown codes ---------------- */
function unknown(r) {
  const g = r.gs1;
  const kinds = [['item', 'a stock item'], ['asset', 'an asset'], ['location', 'a location']].filter(([k]) => !g || k === 'item');
  const list = (k) => (k === 'item' ? catalogue.items.map((x) => [x.id, x.label]) : k === 'asset' ? catalogue.assets.map((x) => [x.id, `${x.tag ? x.tag + ' — ' : ''}${x.description}`]) : catalogue.locations.map((x) => [x.id, x.name]));
  const linkable = catalogue && catalogue.can_link;
  el('#panel').innerHTML = `<div class="card act bad"><h2>${icon('warn')}Not recognised</h2>
    <p class="mono" style="word-break:break-all">${esc(r.code.replace(/\x1d/g, '·'))}</p>
    ${g ? `<p class="dim">A product barcode: GTIN <span class="mono">${esc(g.gtin)}</span>${g.batch ? `, batch ${esc(g.batch)}` : ''}${g.expiry ? `, expiry ${esc(date(g.expiry))}` : ''}.</p>` : ''}
    ${g ? '' : `<p style="margin-top:12px"><strong>A new batch of a stock item?</strong> Choose the item to receive it — this barcode is saved with the batch.</p>
      <div class="k-form"><div class="full"><label>Item</label><select id="nItem">${options(catalogue ? catalogue.items.map((x) => [x.id, x.label]) : [], '', '— choose —')}</select></div></div>
      <div class="btn-row" style="margin-top:6px"><button class="btn primary" id="nGo">Receive it</button></div><p class="err" id="nErr"></p>`}
    ${linkable ? `<p style="margin-top:12px"><strong>Or link this code</strong> so it works from now on${g ? ' (every batch of this product)' : ''}:</p>
      <div class="k-form"><div><label>It is</label><select id="lKind">${options(kinds, 'item')}</select></div>
      <div><label>Which one</label><select id="lId"></select></div></div>
      <div class="btn-row" style="margin-top:6px"><button class="btn primary" id="lGo">Link code</button><button class="btn" id="lCancel">Cancel</button></div><p class="err" id="lErr"></p>`
      : '<p class="dim">Ask an admin to link it to an item, asset or location on this page.</p>'}</div>`;
  if (el('#nGo')) el('#nGo').onclick = async () => {
    el('#nErr').textContent = '';
    try {
      const it = catalogue.items.find((x) => x.id === Number(el('#nItem').value));
      if (!it) throw new Error('choose the item');
      thing = await api('GET', `/api/stores/resolve?code=${encodeURIComponent(it.code)}`);
      if (!target || target.kind !== 'receive') {
        const main = catalogue.locations.find((l) => l.is_main);
        target = await api('GET', `/api/stores/resolve?code=${encodeURIComponent(main.goods_in_code)}`);
      }
      pendingPack = r.code;
      render();
    } catch (e) { el('#nErr').textContent = e.message; }
  };
  if (!linkable) return;
  const fill = () => { el('#lId').innerHTML = options(list(el('#lKind').value), '', '— choose —'); };
  el('#lKind').onchange = fill; fill();
  el('#lCancel').onclick = () => render();
  el('#lGo').onclick = async () => {
    el('#lErr').textContent = '';
    try {
      if (!el('#lId').value) throw new Error('choose which one');
      await api('POST', '/api/stores/codes', { code: r.code, kind: el('#lKind').value, id: Number(el('#lId').value) });
      await loadCatalogue();
      handle(r.code);
    } catch (e) { el('#lErr').textContent = e.message; }
  };
}

/* ---------------- shared bits ---------------- */
function foot(label) {
  return `<p class="err" id="fErr" style="min-height:16px;margin:8px 0 0"></p>
    <div class="btn-row" style="gap:8px">${label ? `<button class="btn primary go" id="fGo">${esc(label)} <span class="dim" style="color:inherit;opacity:.7;font-size:12px">Enter</span></button>` : ''}<button class="btn" id="fCancel">Start again <span class="dim" style="font-size:12px">Esc</span></button></div>`;
}
function num(sel) { const n = Number(el(sel).value); if (!Number.isFinite(n) || n <= 0) throw new Error('enter a quantity'); return n; }
function wireGo(action, focusSel) {
  el('#fCancel').onclick = reset;
  const go = el('#fGo'); if (!go) return;
  onGo = () => run(action);
  go.onclick = onGo;
  el('#panel').querySelectorAll('input:not([type=checkbox]):not([type=radio]):not([data-capture])').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); onGo(); } }));
  const f = focusSel ? el(focusSel) : go;
  if (f) { f.focus(); if (f.select) f.select(); }
}
async function run(action) {
  if (busy) return;
  busy = true;
  const go = el('#fGo'); if (go) go.disabled = true;
  try {
    const r = await action();
    thing = null; target = null; onGo = null; pendingPack = null; render();
    message(r.done || 'Done');
    beep(true);
    refresh();
  } catch (e) {
    const err = el('#fErr');
    beep(false);
    if (err) err.textContent = e.message; else message(e.message, true);
  } finally { busy = false; if (go) go.disabled = false; }
}
// Enter with nothing focused confirms the open form.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !onGo || e.defaultPrevented) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA' || a.tagName === 'BUTTON')) return;
  e.preventDefault(); onGo();
});

/* ---------------- the right-hand column ---------------- */
const REASON = { RESTOCK: 'Received', TRANSFER_IN: 'Moved', ISSUED: 'Issued', RETURNED: 'Returned', RETURNED_DISPOSED: 'Returned (written off)', USED_IN_TREATMENT: 'Used', DAMAGED: 'Damaged', EXPIRED: 'Expired', LOST: 'Lost', FOUND: 'Found', AUDIT_CORRECTION: 'Count correction', SIGNED_OUT: 'Signed out', SIGNED_IN: 'Signed in' };
const FEED_ICON = { RESTOCK: ['receive', 'in'], TRANSFER_IN: ['move', 'mv'], ISSUED: ['out', 'out'], SIGNED_OUT: ['out', 'out'], SIGNED_IN: ['in', 'in'], RETURNED: ['in', 'in'], DAMAGED: ['minus', 'bad'], EXPIRED: ['minus', 'bad'], LOST: ['minus', 'bad'], USED_IN_TREATMENT: ['minus', ''], RETURNED_DISPOSED: ['minus', 'bad'] };
const dayLabel = (iso) => { const d = String(iso).slice(0, 10), t = new Date().toISOString().slice(0, 10), y = new Date(Date.now() - 86400000).toISOString().slice(0, 10); return d === t ? 'Today' : d === y ? 'Yesterday' : date(iso); };
async function loadFeed() {
  let rows;
  try { rows = await api('GET', '/api/stores/activity?limit=40'); } catch (e) { el('#feed').innerHTML = `<li class="err">${esc(e.message)}</li>`; return; }
  rows = rows.filter((r) => r.reason !== 'TRANSFER_OUT');
  let lastDay = '';
  el('#feed').innerHTML = rows.length ? rows.map((r) => {
    const q = r.kind === 'stock' ? `${Math.abs(r.qty)} × ` : '';
    const where = r.reason === 'TRANSFER_IN' ? `${r.from ? esc(r.from) + ' → ' : ''}${esc(r.location)}` : r.person ? esc(r.person) : r.location ? esc(r.location) : '';
    const b = [r.batch_no && 'batch ' + r.batch_no, r.expiry_date && 'exp ' + date(r.expiry_date)].filter(Boolean).join(', ');
    const [ic, cls] = FEED_ICON[r.reason] || ['item', ''];
    const d = dayLabel(r.at), head = d !== lastDay ? `<li class="day">${esc(d)}</li>` : '';
    lastDay = d;
    return `${head}<li><span class="fi ${cls}">${icon(ic)}</span><div><strong>${esc(REASON[r.reason] || words(r.reason))}</strong> ${q}${esc(r.item)}${where ? ` <span class="dim">— ${where}</span>` : ''}${b ? `<div class="dim" style="font-size:12px">${esc(b)}</div>` : ''}
      <div class="when">${esc(new Date(r.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }))}${r.by ? ' · ' + esc(r.by) : ''}${r.via === 'STORES' ? '<span class="via">SCAN</span>' : ''}</div></div></li>`;
  }).join('') : '<li class="dim">Nothing yet.</li>';
}

let summary = null, attTab = null;
async function loadSummary() {
  try { summary = await api('GET', '/api/stores/summary'); } catch { return; }
  const t = summary.today;
  el('#today').innerHTML = [['Received', t.received], ['Moved', t.moved], ['Issued', t.issued], ['Out', t.signed_out], ['In', t.signed_in]].map(([l, n]) => `<div><b>${n}</b><span>${l}</span></div>`).join('');
  const overdue = summary.assets_out.filter((a) => a.overdue).length;
  const tabs = [
    ['expired', 'Expired', summary.expired.length, 'bad'],
    ['expiring', 'Expiring', summary.expiring.length, 'warn'],
    ['low', 'Low stock', summary.low.length, 'warn'],
    ['out', overdue ? `Out (${overdue} overdue)` : 'Signed out', summary.assets_out.length, overdue ? 'bad' : ''],
  ];
  if (!attTab) attTab = (tabs.find((x) => x[2]) || tabs[1])[0];
  el('#attTabs').innerHTML = tabs.map(([k, l, n, c]) => `<button class="tab ${n ? c : ''} ${k === attTab ? 'on' : ''}" data-tab="${k}">${esc(l)} <b>${n}</b></button>`).join('');
  el('#attTabs').querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { attTab = b.dataset.tab; loadSummary(); }));
  const list = attTab === 'expired' ? summary.expired : attTab === 'expiring' ? summary.expiring : attTab === 'low' ? summary.low : summary.assets_out;
  const empty = { expired: 'Nothing has expired.', expiring: 'Nothing expires in the next 30 days.', low: 'Nothing is at its reorder level.', out: 'No assets signed out.' }[attTab];
  el('#att').innerHTML = list.length ? list.slice(0, 50).map((x) => {
    if (attTab === 'low') return `<li><div>${esc(x.item)}<div class="s">reorder at ${x.reorder_level}</div></div><span class="r"><b style="color:var(--busy)">${x.total}</b> ${esc(x.unit)}</span></li>`;
    if (attTab === 'out') return `<li><div>${esc(x.tag || '')} ${esc(x.description)}<div class="s">${esc(x.person || '?')} · since ${esc(date(x.since))}</div></div><span class="r">${x.due ? `<span style="color:${x.overdue ? 'var(--emergency)' : 'inherit'}">due ${esc(date(x.due))}</span>` : '<span class="s">no due date</span>'}</span></li>`;
    return `<li><div>${esc(x.item)}<div class="s">${esc(x.location)}${x.batch_no ? ` · batch ${esc(x.batch_no)}` : ''}</div></div><span class="r"><span style="color:${x.expired ? 'var(--emergency)' : 'var(--busy)'}">${esc(date(x.expiry_date))}</span><div class="s">${x.qty} ${esc(x.unit)}</div></span></li>`;
  }).join('') : `<li class="dim">${esc(empty)}</li>`;
}
async function loadCatalogue() { catalogue = await api('GET', '/api/stores/catalogue').catch(() => null); }
const refresh = () => { loadFeed(); loadSummary(); };

(async () => {
  try { await loadCatalogue(); }
  catch {}
  if (!catalogue) { el('#panel').innerHTML = '<div class="note bad"><div>The Stores page is not turned on for your role — an admin can give it to you in Admin → Menu &amp; sections.</div></div>'; return; }
  drawGuide(); render(); refresh(); manual.focus();
})();
setInterval(refresh, 60000);
</script>
</body>
</html>
