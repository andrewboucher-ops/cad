; CCCS welfare check call — the phone system menu (FreePBX).
;
; CCCS (routes-attendance.js) rings the officer through AMI and, once they
; answer, drops the call here with CCCS_TOKEN set. The officer keys their
; date of birth as 8 digits (DDMMYYYY); this posts them to CCCS, which
; compares and answers CONFIRMED, RETRY or FAILED in plain text. The date of
; birth never comes to the PBX.
;
; Install: FreePBX → Admin → Config Edit → extensions_custom.conf, replace any
; existing [cccs-welfare-check] block with this one, save, then in
; Admin → Asterisk CLI run:  dialplan reload
;
; CCCS is reached on its LAN address: comms.echeloncic.com does not resolve
; back into the LAN from here (the same hairpin problem as CT 150).
;
; Prompts: four System Recordings (Admin → System Recordings), names exactly:
;   cccs-welfare-intro   "This is an Echelon welfare check. Please enter your
;                         date of birth as eight digits: day, month, year."
;   cccs-welfare-retry   "That didn't match. Please try again."
;   cccs-welfare-thanks  "Thank you. Stay safe."
;   cccs-welfare-fail    "We could not confirm your welfare. The control room
;                         has been alerted and will call you."

[cccs-welfare-check]
exten => s,1,Answer()
 same => n,Set(CCCS_URL=http://192.168.7.54:4000/api/welfare-checkcall/${CCCS_TOKEN}/verify)
 same => n,Set(CURLOPT(conntimeout)=5)
 same => n,Set(CURLOPT(httptimeout)=10)
 same => n,Wait(1)
 same => n(ask),Read(DOB,custom/cccs-welfare-intro,8,,1,10)
 same => n,Set(RESULT=${CURL(${CCCS_URL},digits=${DOB})})
 same => n,NoOp(CCCS welfare verify: ${RESULT})
 same => n,GotoIf($["${RESULT}" = "CONFIRMED"]?ok)
 same => n,GotoIf($["${RESULT}" = "RETRY"]?retry)
 ; FAILED, or CCCS not reachable: CCCS raises the alarm itself (on FAILED
 ; straight away, otherwise when its 10-minute result timeout runs out).
 same => n,Playback(custom/cccs-welfare-fail)
 same => n,Hangup()
 same => n(retry),Playback(custom/cccs-welfare-retry)
 same => n,Goto(ask)
 same => n(ok),Playback(custom/cccs-welfare-thanks)
 same => n,Hangup()
