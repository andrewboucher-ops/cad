# coturn for CCCS. Without this, roughly a third of sessions on mobile networks
# will fail to establish audio — and they fail silently, which is worse.
#
#   apt install coturn
#   cp turnserver.conf /etc/turnserver.conf   (edit the marked lines)
#   systemctl enable --now coturn

listening-port=3478
tls-listening-port=5349

# Replace with this server's public address and your domain
external-ip=YOUR.PUBLIC.IP
realm=turn.yourdomain.example
server-name=turn.yourdomain.example

# Long-term credentials. Generate a strong secret; for production, move to
# time-limited credentials issued per session by CCCS.
lt-cred-mech
user=cccs:CHANGE_THIS_PASSWORD

cert=/etc/letsencrypt/live/turn.yourdomain.example/fullchain.pem
pkey=/etc/letsencrypt/live/turn.yourdomain.example/privkey.pem

fingerprint
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Do not let the relay be used to reach your own network
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

total-quota=200
