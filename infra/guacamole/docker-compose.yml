# Apache Guacamole — browser-based remote access (RDP / VNC / SSH) behind Caddy.
# Installed by install.sh into /opt/guacamole; see README.md.
#
#   guacd      speaks RDP/VNC/SSH to the target machines
#   guacamole  the web app (users, connections, permissions, history)
#   postgres   stores all of the above
#   caddy      HTTPS with an automatic certificate, the only thing exposed

services:
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    volumes:
      - ./data/recordings:/var/lib/guacamole/recordings

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # Schema is loaded once, on first start with an empty data directory.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 10s
      retries: 10

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_user
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      # Entra ID users get a database account on first sign-in, so they can
      # be given permissions and show up in history.
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: "true"
      # TOTP second factor for local (non-SSO) logins such as guacadmin.
      TOTP_ENABLED: ${TOTP_ENABLED:-true}
      # Serve at https://<domain>/ rather than /guacamole/
      WEBAPP_CONTEXT: ROOT
      # Log the real client IP (from Caddy) instead of the proxy's.
      REMOTE_IP_VALVE_ENABLED: "true"
      # Lets session recordings be played back from the History screen.
      RECORDING_SEARCH_PATH: /var/lib/guacamole/recordings
    # Entra ID single sign-on, only when openid.env exists (see openid.env.example).
    env_file:
      - path: ./openid.env
        required: false
    volumes:
      - ./data/recordings:/var/lib/guacamole/recordings:ro

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - guacamole
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GUAC_DOMAIN: ${GUAC_DOMAIN:?set GUAC_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
