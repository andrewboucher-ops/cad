; Echelon AI phone assistant — append to /etc/asterisk/extensions_custom.conf
; (Admin → Config Edit in FreePBX, or over SSH), then: fwconsole reload
;
; Needs Asterisk 18+ with app_audiosocket and func_curl (both ship with
; FreePBX 16/17). Check with:  asterisk -rx "module show like audiosocket"
;
; Set these two in /etc/asterisk/globals_custom.conf:
;   AI_HOST=192.168.7.xx        ; the VM/container running voice-agent
;   AI_ONCALL=07xxxxxxxxx       ; on-call duty mobile (or a FreePBX ext/ring group number)

[echelon-ai-agent]
exten => s,1,NoOp(Echelon AI assistant for ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(AI_UUID=${CURL(http://${AI_HOST}:8091/start?caller=${URIENCODE(${CALLERID(num)})}&name=${URIENCODE(${CALLERID(name)})})})
 ; Agent not reachable → don't leave the caller in silence: go straight to on-call.
 same => n,GotoIf($["${LEN(${AI_UUID})}" != "36"]?oncall)
 same => n,AudioSocket(${AI_UUID},${AI_HOST}:9092)
 same => n,Set(AI_NEXT=${CURL(http://${AI_HOST}:8091/next/${AI_UUID})})
 same => n,GotoIf($["${AI_NEXT}" = "TRANSFER"]?oncall)
 same => n,Hangup()
 ; The transfer number is fixed here, never chosen by the assistant.
 same => n(oncall),Dial(Local/${AI_ONCALL}@from-internal,60)
 ; On-call didn't answer either: control room voicemail.
 same => n,Goto(ext-local,vmu901,1)   ; control room (ext 901) voicemail — change if yours differs
 same => n,Hangup()
